[workspace]
resolver = "2"
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/app", "crates/macos-url", "crates/macos-webext", "crates/android"]

[workspace.package]
version = "0.8.8"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
url = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
blackhole-domain = { path = "crates/domain" }
blackhole-application = { path = "crates/application" }
blackhole-infrastructure = { path = "crates/infrastructure" }
blackhole-macos-url = { path = "crates/macos-url" }
blackhole-macos-webext = { path = "crates/macos-webext" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1


[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Pages may declare a global `ipc` (Google Docs does): wry keeps its bridge as `__bhipc` and leaves `ipc` overridable.
[patch.crates-io]
wry = { path = "vendor/wry" }
