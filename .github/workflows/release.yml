name: Release

# Push on main with a Cargo.toml version that has no release yet, or a tag vX.Y.Z (must equal the
# Cargo.toml version) -> build macOS + Windows + Android, publish a GitHub release (tag vX.Y.Z).
# Other pushes and pull requests only build and test.
# The in-app updater reads that release: it installs BlackHole-Setup-*-x64.exe (Windows) or
# BlackHole-macos-universal.zip (macOS) after checking them against SHA256SUMS.txt.
# Android: BlackHole-android.apk, signed with the release key from the secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD;
# without them, BlackHole-android-debug.apk (Gradle's debug key) with a warning.
# Manual run (Actions -> Run workflow) builds the same artifacts without publishing.
# The release text comes from crates/domain/src/changelog.rs (scripts/release_notes.py): a
# version without an entry there is not published.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version (bump it and Cargo.lock first)"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            # A new version landed on main: publish it (the release creates the tag).
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Release notes exist for this version
        if: steps.ver.outputs.release == 'true'
        run: python3 scripts/release_notes.py "${{ steps.ver.outputs.version }}" > /dev/null

  windows:
    needs: [test, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked -p blackhole

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" "/DExePath=..\target\release\blackhole.exe" scripts\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\portable | Out-Null
          Copy-Item target\release\blackhole.exe dist\portable\BlackHole.exe
          Compress-Archive -Path dist\portable\BlackHole.exe -DestinationPath dist\BlackHole-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BlackHole-windows
          path: |
            dist/BlackHole-Setup-*-x64.exe
            dist/BlackHole-windows-x64.zip

  macos:
    needs: [test, version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          cargo build --release --locked -p blackhole --target aarch64-apple-darwin
          cargo build --release --locked -p blackhole --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/blackhole \
            target/aarch64-apple-darwin/release/blackhole \
            target/x86_64-apple-darwin/release/blackhole

      - name: Bundle BlackHole.app
        run: BLACKHOLE_BIN=target/universal/blackhole scripts/package-macos.sh

      - name: Zip (used by the updater) and DMG
        run: |
          cd dist
          ditto -c -k --keepParent BlackHole.app BlackHole-macos-universal.zip
          hdiutil create -volname BlackHole -srcfolder BlackHole.app -ov -format UDZO BlackHole-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: BlackHole-macos
          path: |
            dist/BlackHole-macos-universal.zip
            dist/BlackHole-macos-universal.dmg

  android:
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          # The default list ("tools platform-tools") fails: the legacy "tools" package is gone
          # from recent command-line tools (16.0), so sdkmanager exits with code 1.
          packages: platform-tools

      - name: NDK, SDK packages and cargo-ndk
        run: |
          sdkmanager --install "ndk;27.3.13750724" "platforms;android-35" "build-tools;35.0.0"
          cargo install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Clippy (Android target)
        run: cargo ndk -t arm64-v8a -P 29 clippy -p blackhole-android --all-targets --locked -- -D warnings

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            # The key only lives in the runner's temporary directory for this job, removed even
            # when the build fails.
            export BH_ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
            trap 'rm -f "$BH_ANDROID_KEYSTORE"' EXIT
            # Secrets pasted from a terminal often carry a trailing newline (or CR, or spaces
            # around the alias): strip them, or keytool looks for an alias that does not exist.
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$BH_ANDROID_KEYSTORE"
            BH_ANDROID_KEY_ALIAS="$(printf '%s' "$BH_ANDROID_KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            BH_ANDROID_KEYSTORE_PASSWORD="$(printf '%s' "$BH_ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')"
            BH_ANDROID_KEY_PASSWORD="$(printf '%s' "$BH_ANDROID_KEY_PASSWORD" | tr -d '\r\n')"
            export BH_ANDROID_KEY_ALIAS BH_ANDROID_KEYSTORE_PASSWORD BH_ANDROID_KEY_PASSWORD
            # Check the key before a 3-minute build, with an error that says what is wrong.
            if ! keytool -list -keystore "$BH_ANDROID_KEYSTORE" -storepass:env BH_ANDROID_KEYSTORE_PASSWORD > "$RUNNER_TEMP/aliases.txt" 2>&1; then
              echo "::error::ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD is wrong: the keystore does not open"
              exit 1
            fi
            if ! keytool -list -keystore "$BH_ANDROID_KEYSTORE" -storepass:env BH_ANDROID_KEYSTORE_PASSWORD -alias "$BH_ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
              aliases="$(grep -i 'PrivateKeyEntry' "$RUNNER_TEMP/aliases.txt" | cut -d, -f1 | paste -sd ' ' -)"
              echo "::error::ANDROID_KEY_ALIAS does not name a key of the keystore; its keys: ${aliases:-none}"
              exit 1
            fi
            rm -f "$RUNNER_TEMP/aliases.txt"
            ./gradlew assembleRelease -PrustRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../dist/BlackHole-android.apk
          else
            echo "::warning::No Android release key in the secrets: publishing a debug-signed APK (BlackHole-android-debug.apk)"
            ./gradlew assembleDebug -PrustRelease --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/BlackHole-android-debug.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BlackHole-android
          path: dist/BlackHole-android*.apk

  publish:
    if: needs.version.outputs.release == 'true'
    needs: [version, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes (from the in-app changelog)
        run: python3 scripts/release_notes.py "${{ needs.version.outputs.version }}" > release-notes.md

      - name: Checksums
        working-directory: dist
        run: sha256sum BlackHole-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/BlackHole-Setup-*-x64.exe
            dist/BlackHole-windows-x64.zip
            dist/BlackHole-macos-universal.zip
            dist/BlackHole-macos-universal.dmg
            dist/BlackHole-android*.apk
            dist/SHA256SUMS.txt
