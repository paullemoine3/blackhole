[package]
name = "blackhole"
version.workspace = true
edition.workspace = true
description = "Privacy-first, Arc-inspired browser powered by the operating system's web engine (WebKit / WebView2)"

[dependencies]
blackhole-domain.workspace = true
blackhole-application.workspace = true
blackhole-infrastructure.workspace = true
blackhole-macos-url.workspace = true
blackhole-macos-webext.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
# `devtools`: the inspector (elements, console, network) of web pages, in release builds too.
wry = { version = "0.57", features = ["devtools"] }
winit = "0.30"
tracing = "0.1"
rfd = "0.17.2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
core-graphics = { version = "0.23", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
xcap = { version = "0.9", optional = true }
softbuffer = { version = "0.4", default-features = false }

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
optional = true

[features]
# Dev-only scripted UI driver that can take screenshots (see src/devtools.rs). macOS and Windows.
devtools = ["dep:image", "dep:core-graphics", "dep:xcap"]

[lints]
workspace = true
