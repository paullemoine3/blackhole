<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* A tab dragged out of the sidebar: drawn above the page (or in its own small window outside
     BlackHole), with where it would go. Never takes the mouse: the sidebar keeps the gesture.
     The tab is a pane of glass that leans with the speed of the pointer (index.html draws the
     same while it is over the sidebar). */
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; pointer-events: none; user-select: none;
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #f3f1ff; }
  body.solid { background: #1c1930; }
  #card { position: fixed; left: 0; top: 0; width: 220px; box-sizing: border-box; display: flex; align-items: center; gap: 8px;
    padding: 8px 11px; border-radius: 12px; opacity: 0; will-change: transform; transform-origin: 20% 50%;
    background: rgba(60, 52, 137, .42); -webkit-backdrop-filter: blur(12px) saturate(1.3); backdrop-filter: blur(12px) saturate(1.3);
    border: 1px solid rgba(206, 203, 246, .45);
    box-shadow: 5px 5px 0 -1px rgba(38, 33, 92, .55), 5px 5px 0 0 rgba(206, 203, 246, .2), 0 12px 30px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .2); }
  body.on #card { opacity: 1; }
  body.solid #card { background: #3c3489; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); }
  #ico { width: 16px; height: 16px; flex: none; border-radius: 4px; display: grid; place-items: center; font-size: 10px; font-weight: 700;
    background: rgba(255,255,255,.18); overflow: hidden; }
  #ico img { width: 16px; height: 16px; }
  #title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #badge { position: fixed; left: 0; top: 0; padding: 4px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap;
    background: rgba(60, 52, 137, .78); border: 1px solid rgba(206, 203, 246, .4); color: #fff; opacity: 0; transition: opacity .12s ease;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #badge.no { background: rgba(163, 45, 45, .85); border-color: rgba(247, 193, 193, .45); }
  #badge.quiet { background: rgba(74, 71, 96, .8); }
  body.on #badge.shown { opacity: 1; }
  /* Split: the half that would show the tab slides in from its side. */
  #pane { position: fixed; box-sizing: border-box; border-radius: 12px; border: 1.5px solid rgba(206, 203, 246, .7);
    background: color-mix(in srgb, var(--bh-accent, #7c5cff) 14%, transparent); opacity: 0;
    transition: transform .26s cubic-bezier(.2,.85,.25,1), opacity .18s ease; display: grid; place-items: start center; padding-top: 28px; }
  #pane.left { transform: translateX(-24px); }
  #pane.right { transform: translateX(24px); }
  #pane.shown { opacity: 1; transform: none; }
  #pane span, #fav > div { padding: 6px 12px; border-radius: 10px; font-weight: 600; background: rgba(38, 33, 92, .62); border: 1px solid rgba(206, 203, 246, .35);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  /* Start page: the Favorites section itself takes it; the words sit in it. */
  #fav { position: fixed; box-sizing: border-box; display: grid; place-items: start end; padding: 8px 12px; border-radius: 16px; opacity: 0;
    border: 1.5px dashed rgba(206, 203, 246, .7); background: color-mix(in srgb, var(--bh-accent, #7c5cff) 12%, rgba(20, 18, 30, .45));
    transition: opacity .16s ease; }
  body.fav #fav { opacity: 1; }
  #fav > div { display: flex; align-items: center; gap: 10px; font-size: 14px; transform: scale(.92); transition: transform .22s cubic-bezier(.2,.85,.25,1); }
  body.fav #fav > div { transform: scale(1); }
  #fav.no { border-color: #6b6880; background: rgba(20, 18, 30, .4); color: #b9b6c8; }
  #fav .star { font-size: 18px; color: #cecbf6; }
  #fav.no .star { color: #6b6880; }
  body.fav:not(.still) #fav:not(.no) .star { animation: star-in .5s ease-out; }
  @keyframes star-in { from { transform: scale(.4) rotate(-40deg); } }
  .ring { position: fixed; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid #cecbf6;
    box-shadow: 0 0 14px color-mix(in srgb, var(--bh-accent, #7c5cff) 70%, transparent); }
  body.still *, body.still *::before { transition: none !important; animation: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="pane"><span id="panetxt"></span></div>
<div id="fav"><div><span class="star">★</span><span id="favtxt"></span></div></div>
<div id="card"><span id="ico"></span><span id="title"></span></div>
<div id="badge"></div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const LEAN = -2, EASE_IN = 'cubic-bezier(.55,0,.75,.2)';
  let zone = '', pos = [0, 0], pane = null, lean = 0, last = null, raf = 0, gone = false;
  const still = () => document.body.classList.contains('still') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const place = () => {
    const [x, y] = pos;
    $('card').style.transform = `translate(${x}px, ${y}px) rotate(${(LEAN + lean).toFixed(2)}deg) scale(1.04)`;
  };
  // It leans with the speed of the pointer, then rights itself.
  const settle = () => {
    raf = 0;
    if (Math.abs(lean) < 0.05 || still()) { lean = 0; place(); return; }
    lean *= 0.86;
    place();
    raf = requestAnimationFrame(settle);
  };
  const say = (x) => window.ipc.postMessage(JSON.stringify(x));
  window.bhDrag = {
    // The tab: its title and icon (or letter); `solid` in a window that cannot be transparent.
    start(t) {
      $('title').textContent = t.title || '';
      const ico = $('ico');
      ico.textContent = '';
      if (t.icon) {
        const img = document.createElement('img');
        img.referrerPolicy = 'no-referrer';
        img.onerror = () => { img.remove(); ico.textContent = t.letter || ''; };
        img.src = t.icon;
        ico.append(img);
      } else ico.textContent = t.letter || '';
      document.body.className = (t.solid ? 'solid ' : '') + (t.still ? 'still ' : '') + (t.float ? 'float ' : '');
      for (const a of document.getAnimations()) a.cancel();
      document.querySelectorAll('.ring').forEach((r) => r.remove());
      zone = ''; lean = 0; last = null; gone = false;
    },
    // Where the pointer is (this view's pixels; `sx` on the screen) and what a drop there would do.
    at(s) {
      const b = document.body;
      b.classList.add('on');
      const float = b.classList.contains('float');
      pos = float ? [4, 4] : [s.x + 12, s.y - 14];
      const now = performance.now();
      if (last && s.sx != null && !still()) {
        const v = (s.sx - last.x) / Math.max(8, now - last.t);
        lean = Math.max(-11, Math.min(11, lean * 0.6 + v * 5));
        if (!raf) raf = requestAnimationFrame(settle);
      }
      if (s.sx != null) last = { x: s.sx, t: now };
      place();
      const badge = $('badge');
      badge.textContent = s.label || '';
      badge.className = (s.label && s.zone !== 'fav' && !(s.zone === 'left' || s.zone === 'right') ? 'shown ' : '') + (s.no ? 'no' : s.zone === 'none' ? 'quiet' : '');
      badge.style.transform = `translate(${pos[0]}px, ${pos[1] + 42}px)`;
      b.classList.toggle('fav', s.zone === 'fav');
      if (s.zone === 'fav' && s.pane) Object.assign($('fav').style, { left: s.pane.x + 'px', top: s.pane.y + 'px', width: s.pane.w + 'px', height: s.pane.h + 'px' });
      $('fav').classList.toggle('no', !!s.no);
      $('favtxt').textContent = s.zone === 'fav' ? s.label : $('favtxt').textContent;
      const p = $('pane');
      if (s.zone === 'left' || s.zone === 'right') {
        pane = s.pane;
        if (zone !== s.zone) {
          // Starts from its side each time it changes, then slides in.
          p.className = s.zone;
          Object.assign(p.style, { left: s.pane.x + 'px', top: s.pane.y + 'px', width: s.pane.w + 'px', height: s.pane.h + 'px' });
          void p.offsetWidth;
        }
        $('panetxt').textContent = s.label;
        p.className = s.zone + ' shown';
      } else p.className = zone === 'left' || zone === 'right' ? zone : '';
      zone = s.zone;
    },
    // Released: the tab goes where it was dropped, then the shell hides this view (`tab_drag_gone`).
    drop(kind) {
      const card = $('card'), from = card.style.transform, done = () => { if (!gone) { gone = true; say({ cmd: 'tab_drag_gone' }); } };
      cancelAnimationFrame(raf); raf = 0;
      $('badge').classList.remove('shown');
      if (still()) { done(); return; }
      let end;
      if (kind === 'pane' || kind === 'fav') {
        // Taken in where it was let go (a pane of the split, the favorites): a ring spreads like a
        // Pulsar's beat, the card shrinks into it and the drawn zone fades.
        const ring = document.createElement('div');
        ring.className = 'ring';
        Object.assign(ring.style, { left: pos[0] + 24 + 'px', top: pos[1] + 16 + 'px' });
        document.body.append(ring);
        ring.animate([{ transform: 'scale(.4)', opacity: 1 }, { transform: 'scale(4.2)', opacity: 0 }], { duration: 560, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
        card.animate([{ transform: from, opacity: 1 }, { transform: `translate(${pos[0]}px, ${pos[1]}px) scale(.2)`, opacity: 0 }], { duration: 360, easing: EASE_IN, fill: 'forwards' });
        end = $(kind === 'pane' ? 'pane' : 'fav').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 560, easing: 'ease-out', fill: 'forwards' });
      } else if (kind === 'away') {
        // Off to the other window: stretched and gone.
        end = card.animate([{ transform: from, opacity: 1 }, { transform: `${from} translateX(70px) scale(1.5, .55)`, opacity: 0 }], { duration: 320, easing: EASE_IN, fill: 'forwards' });
      } else if (kind === 'refused') {
        // Refused: a shake, then it fades.
        const b = $('badge');
        b.classList.add('shown', 'no');
        card.animate([0, -7, 7, -5, 5, -2, 0].map((d) => ({ transform: `${from} translateX(${d}px)` })), { duration: 340, easing: 'ease-out' });
        end = document.body.animate([{ opacity: 1 }, { opacity: 1, offset: .6 }, { opacity: 0 }], { duration: 620, fill: 'forwards' });
      }
      if (end) end.onfinish = done; else done();
      setTimeout(done, 900);
    },
    stop() {
      document.body.classList.remove('on', 'fav');
      for (const a of document.getAnimations()) a.cancel();
      document.querySelectorAll('.ring').forEach((r) => r.remove());
      $('pane').className = '';
      zone = ''; lean = 0; last = null;
    },
  };
  window.ipc.postMessage(JSON.stringify({ cmd: 'tab_drag_ready' }));
})();
</script>
</body>
</html>
