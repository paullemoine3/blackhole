<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Site injoignable</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0c0b12; color: #eceaf5; font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
    background: radial-gradient(800px 500px at 50% 35%, rgba(124,92,255,.22), transparent 70%), #0c0b12; }
  .scene { position: relative; width: 300px; height: 220px; margin-bottom: 6px; }
  .hole { position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%;
    background: radial-gradient(circle, #000 0 34%, rgba(255,170,60,.95) 38%, rgba(255,90,40,.5) 52%, rgba(124,92,255,.3) 64%, transparent 76%);
    box-shadow: 0 0 80px rgba(255,120,40,.25), 0 0 160px rgba(124,92,255,.22); animation: pulse 4s ease-in-out infinite; }
  .ring { position: absolute; left: 50%; top: 50%; width: 196px; height: 196px; margin: -98px 0 0 -98px; border-radius: 50%; border: 2px solid transparent;
    border-top-color: rgba(255,205,120,.85); border-right-color: rgba(124,92,255,.75); animation: swirl 7s linear infinite; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px 1px rgba(190,170,255,.8); animation: twinkle 3s ease-in-out infinite; }
  .ship { position: absolute; left: 50%; top: 50%; width: 110px; height: 56px; margin: -92px 0 0 -128px; animation: drift 6s ease-in-out infinite; }
  .spark { transform-box: fill-box; transform-origin: center; animation: spark 1.1s steps(2, end) infinite; }
  .debris { animation: debris 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
  .url { max-width: min(560px, 86vw); font-size: 13px; opacity: .55; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  p.hint { max-width: 440px; font-size: 13px; opacity: .7; }
  button { font: inherit; color: #fff; background: rgba(124,92,255,.85); border: 0; border-radius: 9px; padding: 8px 20px; margin-top: 6px; cursor: pointer; }
  button:hover { background: rgb(124,92,255); }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes swirl { to { transform: rotate(360deg); } }
  @keyframes twinkle { 50% { opacity: .25; } }
  @keyframes drift { 0%, 100% { transform: translate(0, 0) rotate(-14deg); } 50% { transform: translate(10px, 8px) rotate(-6deg); } }
  @keyframes spark { 0% { opacity: 1; transform: scale(1); } 100% { opacity: .15; transform: scale(.5); } }
  @keyframes debris { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(6px, -5px) rotate(40deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="star" style="left:12%;top:18%"></div><div class="star" style="left:86%;top:12%;animation-delay:-1s"></div>
  <div class="star" style="left:92%;top:72%;animation-delay:-2s"></div><div class="star" style="left:6%;top:80%;animation-delay:-.5s"></div>
  <div class="star" style="left:30%;top:6%;animation-delay:-1.5s"></div>
  <div class="hole"></div><div class="ring"></div>
  <svg class="ship" viewBox="0 0 110 56" fill="none" stroke-linejoin="round">
    <path d="M10 30 L44 18 L92 22 L104 30 L92 38 L44 42 Z" fill="#2a2740" stroke="#8d86c9" stroke-width="2"/>
    <path d="M62 22 L84 24 L92 30 L84 36 L62 38 Z" fill="#15131f" stroke="#8d86c9" stroke-width="1.5"/>
    <path d="M70 26 L82 27 L85 30 L80 33 L70 34 Z" fill="#7c5cff" opacity=".55"/>
    <path d="M30 20 L38 4 L50 6 L46 19 Z" fill="#2a2740" stroke="#8d86c9" stroke-width="2"/>
    <path d="M30 40 L36 52 L52 50 L46 41 Z" fill="#2a2740" stroke="#8d86c9" stroke-width="2"/>
    <path d="M44 18 L50 28 L42 33 L48 42" stroke="#0c0b12" stroke-width="3"/>
    <path d="M8 24 L22 28 L14 32 L24 36 L10 38" stroke="#ff8a3c" stroke-width="2"/>
    <circle class="spark" cx="12" cy="31" r="4" fill="#ffb020"/>
    <circle class="spark" cx="46" cy="30" r="2.5" fill="#fff" style="animation-delay:-.5s"/>
    <circle class="spark" cx="38" cy="10" r="2" fill="#ff8a3c" style="animation-delay:-.3s"/>
    <path class="debris" d="M2 48 L10 44 L12 50 Z" fill="#2a2740" stroke="#8d86c9" stroke-width="1.5"/>
    <path class="debris" d="M100 8 L108 10 L104 16 Z" fill="#2a2740" stroke="#8d86c9" stroke-width="1.5" style="animation-delay:-2s"/>
  </svg>
</div>
<h1>Site injoignable</h1>
<div class="url" id="url"></div>
<p class="hint">La connexion s'est perdue dans le vide. Vérifiez votre réseau ou le VPN, puis réessayez.</p>
<button id="retry">Réessayer</button>
<script>
const target = __BH_URL__;
document.getElementById('url').textContent = target;
const retry = () => { location.href = target; };
window.__bhRetry = retry;
document.getElementById('retry').onclick = retry;
</script>
</body>
</html>
