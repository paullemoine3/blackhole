<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="color-scheme" content="dark">
<title>Erreur</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  :root { --accent: 124,92,255; --hot: 255,170,60; --warm: 255,90,40; }
  body.danger { --accent: 220,50,80; --hot: 255,96,110; --warm: 220,40,70; }
  body.calm { --accent: 70,130,255; --hot: 120,200,255; --warm: 70,120,255; }
  body.amber { --accent: 230,150,40; --hot: 255,205,120; --warm: 255,138,60; }
  body.green { --accent: 40,190,130; --hot: 61,220,151; --warm: 30,160,110; }
  html, body { height: 100%; background: #0c0b12; color: #eceaf5; font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
    background: radial-gradient(800px 500px at 50% 35%, rgba(var(--accent),.22), transparent 70%), #0c0b12; overflow-y: auto; }
  .scene { position: relative; width: 320px; height: 220px; margin-bottom: 6px; flex: none; }
  .hole { position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%;
    background: radial-gradient(circle, #000 0 34%, rgba(var(--hot),.95) 38%, rgba(var(--warm),.5) 52%, rgba(var(--accent),.3) 64%, transparent 76%);
    box-shadow: 0 0 80px rgba(var(--warm),.25), 0 0 160px rgba(var(--accent),.22); animation: pulse 4s ease-in-out infinite; }
  .ring { position: absolute; left: 50%; top: 50%; width: 196px; height: 196px; margin: -98px 0 0 -98px; border-radius: 50%; border: 2px solid transparent;
    border-top-color: rgba(var(--hot),.85); border-right-color: rgba(var(--accent),.75); animation: swirl 7s linear infinite; }
  .hole[hidden], .ring[hidden] { display: none; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px 1px rgba(190,170,255,.8); animation: twinkle 3s ease-in-out infinite; }
  .art { position: absolute; inset: 0; width: 320px; height: 220px; overflow: hidden; }
  svg[hidden] { display: none; }
  .ship { position: absolute; left: 50%; top: 50%; width: 110px; height: 56px; margin: -92px 0 0 -128px; animation: drift 6s ease-in-out infinite; }
  /* Shared motions; inside the SVGs, rotations name their own centre (transform-origin in px). */
  .fb { transform-box: fill-box; transform-origin: center; }
  .spark { transform-box: fill-box; transform-origin: center; animation: spark 1.1s steps(2, end) infinite; }
  .debris { animation: debris 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .blink { animation: blink 1.6s steps(2, end) infinite; }
  .fast { animation-duration: .7s; }
  .bob { animation: bob 4s ease-in-out infinite; }
  .float { animation: float 7s ease-in-out infinite; }
  .rot { animation: swirl 12s linear infinite; }
  .rot.rev { animation-direction: reverse; }
  .rot.quick { animation-duration: 2.4s; }
  .rot.blur { animation-duration: .6s; }
  .wave { animation: wave 2.2s ease-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
  .lost { animation: lost 2.2s ease-out infinite; }
  .bar1 { animation: sig 3s steps(1, end) infinite; } .bar2 { animation: sig 3s steps(1, end) infinite -.5s; } .bar3 { animation: sig 3s steps(1, end) infinite -1s; }
  .sweep { animation: swirl 3s linear infinite; transform-origin: 160px 104px; }
  .ping { animation: ping 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .scan { animation: scanlines 2.4s linear infinite; }
  .beam { animation: beam 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .laser { animation: laser 1.2s ease-in-out infinite; }
  .alarm { animation: alarm 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .trail { animation: trail 1.6s linear infinite; }
  .out { animation: out 4s ease-in infinite; }
  .scanbar { animation: scanbar 2.6s ease-in-out infinite; }
  .knock { animation: knock 3s ease-in-out infinite; }
  .flash { animation: flash 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .smoke { animation: smoke 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .flame { animation: flame .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  .jitter { animation: jitter .35s steps(2, end) infinite; }
  .drip { animation: drip 2.4s linear infinite; }
  .glitch { animation: glitch 2.2s steps(1, end) infinite; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
  .url { max-width: min(560px, 86vw); font-size: 13px; opacity: .55; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  p.hint { max-width: 460px; font-size: 13px; opacity: .7; }
  p.hint + p.hint { margin-top: -6px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; color: #fff; background: rgba(124,92,255,.85); border: 0; border-radius: 9px; padding: 8px 20px; margin-top: 6px; cursor: pointer; }
  button:hover { background: rgb(124,92,255); }
  button.ghost { background: rgba(255,255,255,.08); }
  button.ghost:hover { background: rgba(255,255,255,.14); }
  button.risky { background: rgba(220,40,70,.18); color: #ffb3bd; border: 1px solid rgba(255,96,110,.45); }
  button.risky:hover { background: rgba(220,40,70,.32); }
  details { max-width: min(520px, 90vw); width: 100%; font-size: 12.5px; text-align: left; background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 8px 12px; }
  summary { cursor: pointer; opacity: .75; list-style: none; text-align: center; }
  /* A drawn chevron (12 px box, 1.5 px stroke), not a font glyph: the same on every system. */
  summary::before { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 9px 2px 3px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .2s; }
  details[open] summary::before { transform: rotate(45deg); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 10px 0 4px; }
  dt { opacity: .55; }
  dd { overflow-wrap: anywhere; }
  .warn { margin: 8px 0 2px; opacity: .8; }
  details .actions { margin-top: 6px; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes swirl { to { transform: rotate(360deg); } }
  @keyframes twinkle { 50% { opacity: .25; } }
  @keyframes drift { 0%, 100% { transform: translate(0, 0) rotate(-14deg); } 50% { transform: translate(10px, 8px) rotate(-6deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes float { 0%, 100% { transform: translate(0, 0) rotate(-4deg); } 50% { transform: translate(6px, -6px) rotate(5deg); } }
  @keyframes spark { 0% { opacity: 1; transform: scale(1); } 100% { opacity: .15; transform: scale(.5); } }
  @keyframes debris { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(6px, -5px) rotate(40deg); } }
  @keyframes wave { 0% { opacity: .9; transform: scale(.5); } 70% { opacity: .3; } 100% { opacity: 0; transform: scale(1.4); } }
  @keyframes lost { 0%, 35% { opacity: 0; } 45% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes sig { 0% { opacity: 1; } 33% { opacity: .15; } 66% { opacity: 1; } }
  @keyframes blink { 50% { opacity: .2; } }
  @keyframes ping { 0% { opacity: 0; transform: scale(.4); } 10% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.8); } }
  @keyframes scanlines { from { transform: translateY(-10px); } to { transform: translateY(10px); } }
  @keyframes beam { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
  @keyframes laser { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes alarm { 0%, 100% { opacity: .15; transform: scale(.94); } 50% { opacity: .7; transform: scale(1.04); } }
  @keyframes trail { from { transform: translateX(40px); opacity: 0; } 30% { opacity: .9; } to { transform: translateX(-60px); opacity: 0; } }
  @keyframes out { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(90px, -40px) rotate(160deg); opacity: 0; } }
  @keyframes scanbar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(26px); } }
  @keyframes knock { 0%, 100% { transform: translateX(0); } 45% { transform: translateX(58px); } 52% { transform: translateX(44px) rotate(-12deg); } 70% { transform: translateX(10px); } }
  @keyframes flash { 0%, 40%, 60%, 100% { opacity: 0; transform: scale(.6); } 47% { opacity: 1; transform: scale(1.2); } }
  @keyframes smoke { 0% { opacity: .7; transform: translate(0, 0) scale(.4); } 100% { opacity: 0; transform: translate(14px, -46px) scale(1.6); } }
  @keyframes flame { from { transform: scaleY(.7); } to { transform: scaleY(1.15); } }
  @keyframes jitter { 0% { transform: translate(-2px, 1px); } 100% { transform: translate(2px, -1px); } }
  @keyframes drip { from { transform: translateY(0); opacity: 1; } to { transform: translateY(40px); opacity: 0; } }
  @keyframes glitch { 0%, 100% { opacity: 1; } 20% { opacity: .1; } 24% { opacity: 1; } 61% { opacity: .3; } 64% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  body.still *, body.still *::before, body.still *::after { animation: none !important; transition: none !important; }
</style>
</head>

<h1 id="title"></h1>
<div class="url" id="url"></div>
<p class="hint" id="hint"></p>
<p class="hint" id="hint2" hidden></p>
<div class="actions" id="actions"></div>
<details id="advanced" hidden>
  <summary></summary>
  <dl id="facts"></dl>
  <p class="warn" id="warn"></p>
  <div class="actions" id="risky"></div>
</details>
<script>
// Everything that comes from the site (address, host, certificate names) is inserted with
// textContent only. Texts come from the catalog of the interface language (`cfg.i18n`, keys
// `error.*`, see crates/domain/i18n), with the host and status as parameters.
const cfg = __BH_ERROR__;
const target = cfg.url || '';
const host = cfg.host || target;
const $ = (id) => document.getElementById(id);
const L = cfg.i18n || { lang: 'en', s: {} };
const T = (key, p) => (L.s[key] ?? key).replace(/\{(\w+)\}/g, (m, k) => (p && k in p ? String(p[k]) : m));
document.documentElement.lang = L.lang;
if (cfg.animations === false) document.body.classList.add('still');
const retry = () => { location.href = target; };
window.__bhRetry = retry;
const back = () => { history.length > 1 ? history.back() : retry(); };
const date = (secs) => {
  if (!secs) return '';
  try { return new Date(secs * 1000).toLocaleString(L.lang, { dateStyle: 'long', timeStyle: 'short' }); } catch (_) { return ''; }
};
// The shell asks before anything risky: its own menu, not this page, grants the exception.
const ask = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  window.__bhipc && window.__bhipc.postMessage(JSON.stringify({ cmd: 'error_menu', x: r.left, y: r.bottom + 4 }));
};
const REASONS = {
  expired: ['error.reason_expired', 'error.reason_expired_hint'],
  not_yet_valid: ['error.reason_not_yet_valid', 'error.reason_not_yet_valid_hint'],
  untrusted: ['error.reason_untrusted', 'error.reason_untrusted_hint'],
  self_signed: ['error.reason_self_signed', 'error.reason_self_signed_hint'],
  name_mismatch: ['error.reason_name_mismatch', 'error.reason_name_mismatch_hint'],
  revoked: ['error.reason_revoked', 'error.reason_revoked_hint'],
  invalid: ['error.reason_invalid', 'error.reason_invalid_hint'],
};
const PAGES = {
  unreachable: { hole: true, main: 'retry' },
  offline: { tint: 'calm', main: 'retry' },
  not_found: { tint: 'green', main: 'retry' },
  redirects: { main: 'retry' },
  certificate: { tint: 'danger', main: 'back', risky: 'error.continue_anyway' },
  clock: { tint: 'amber', main: 'retry', risky: 'error.continue_anyway' },
  http_only: { tint: 'amber', main: 'back', risky: 'error.continue_http' },
  unauthorized: { tint: 'amber', main: 'login' },
  forbidden: { tint: 'danger', main: 'back', second: 'retry' },
  server: { tint: 'danger', main: 'retry' },
  blocked: { tint: 'calm', main: 'back', allow: true },
};
const kind = PAGES[cfg.kind] ? cfg.kind : 'unreachable';
const page = PAGES[kind];
// One scene per kind; the black hole stays the backdrop of "Site unreachable".
if (page.tint) document.body.classList.add(page.tint);
// `hidden` is an attribute only on SVG elements (no property).
document.querySelector('[data-art="' + kind + '"]').removeAttribute('hidden');
for (const el of document.querySelectorAll('.hole, .ring')) el.hidden = !page.hole;
// SMIL motions (the looping ship) ignore CSS: stop them like the rest when motion is off.
const still = cfg.animations === false || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still) for (const svg of document.querySelectorAll('svg')) svg.pauseAnimations && svg.pauseAnimations();

const params = { host, status: String(cfg.status || '') };
const reason = REASONS[cfg.reason] || REASONS.invalid;
let title = T('error.' + kind + '_title');
let hint = kind === 'certificate' || kind === 'clock' || kind === 'blocked' ? '' : T('error.' + kind + '_hint', params);
if (kind === 'certificate') hint = T(reason[1], params);
if (kind === 'clock') hint = T('error.clock_hint', { host, date: date(Date.now() / 1000) });
if (kind === 'blocked') hint = T(cfg.why === 'ad blocked' ? 'error.blocked_ad_hint' : 'error.blocked_tracker_hint', params);
if (kind === 'server' && cfg.status) title = T('error.server_title_status', params);
document.title = title;
$('title').textContent = title;
$('url').textContent = target;
$('hint').textContent = hint;
$('advanced').querySelector('summary').textContent = T('error.advanced');
if (kind === 'certificate' || kind === 'clock') {
  $('hint2').hidden = false;
  $('hint2').textContent = T('error.intercept_warning');
}

const button = (label, run, cls) => {
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = run;
  return b;
};
const ACTIONS = {
  retry: ['error.retry', retry],
  back: ['error.back', back],
  login: ['error.login', retry],
};
const main = ACTIONS[page.main];
$('actions').append(button(T(main[0]), main[1]));
if (page.second) $('actions').append(button(T(ACTIONS[page.second][0]), ACTIONS[page.second][1], 'ghost'));
if (page.main === 'back' && !page.second && kind !== 'blocked') $('actions').append(button(T('error.retry'), retry, 'ghost'));
if (page.allow) $('actions').append(button(T('error.allow_site'), ask, 'risky'));

if (page.risky) {
  $('advanced').hidden = false;
  const facts = [['error.fact_host', host]];
  if (kind !== 'http_only') facts.push(['error.fact_reason', T(reason[0])]);
  if (cfg.issuer) facts.push(['error.fact_issuer', cfg.issuer]);
  if (cfg.subject) facts.push(['error.fact_subject', cfg.subject]);
  if (cfg.from) facts.push(['error.fact_from', date(cfg.from)]);
  if (cfg.to) facts.push(['error.fact_to', date(cfg.to)]);
  for (const [k, v] of facts) {
    const dt = document.createElement('dt'); dt.textContent = T(k);
    const dd = document.createElement('dd'); dd.textContent = v;
    $('facts').append(dt, dd);
  }
  if (cfg.hsts) {
    $('warn').textContent = T('error.hsts', params);
  } else {
    $('warn').textContent = T('error.exception_scope');
    $('risky').append(button(T(page.risky), ask, 'risky'));
  }
}
if (kind === 'offline') window.addEventListener('online', retry);
</script>
