<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @property --accent { syntax: '<color>'; inherits: true; initial-value: #7c5cff; }
  @property --glow { syntax: '<color>'; inherits: true; initial-value: rgba(124,92,255,.5); }
  @property --glow2 { syntax: '<color>'; inherits: true; initial-value: rgba(124,92,255,.22); }
  @property --tint1 { syntax: '<color>'; inherits: true; initial-value: #100f17; }
  @property --tint2 { syntax: '<color>'; inherits: true; initial-value: #100f17; }
  :root { --accent: #7c5cff; --glow: rgba(124,92,255,.5); --glow2: rgba(124,92,255,.22); transition: --accent .45s ease, --glow .45s ease, --glow2 .45s ease, --tint1 .45s ease, --tint2 .45s ease; }
  /* Switching space: the list glides in from the side of the space chosen (--dir), the rest fades. */
  aside.switching #scroll { animation: space-slide .42s cubic-bezier(.2,.85,.25,1); }
  aside.switching > :not(#scroll):not(#spaces) { animation: spacefade .4s ease; }
  @keyframes spacefade { from { opacity: .25; } to { opacity: 1; } }
  @keyframes space-slide { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 26px)); filter: blur(3px); } }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; color: #eceaf5; user-select: none; -webkit-user-select: none; }
  html { background: #100f17; }
  /* --ox: where the window's left edge is inside this view (it slides out with the sidebar), so the glow lines up with the top bar's. */
  body { background: radial-gradient(700px 500px at var(--ox, 0px) -38px, var(--glow), transparent 70%), radial-gradient(500px 400px at 100% 100%, var(--glow2), transparent 70%), linear-gradient(180deg, var(--tint1, #100f17), var(--tint2, #100f17)); }
  body.flyout { box-shadow: 6px 0 24px rgba(0,0,0,.45); border-right: 1px solid rgba(255,255,255,.1); }
  /* Elevation of the page card: it floats above the tinted frame; the shell sets --cl (its left edge).
     The view starts under the top bar, so the shadow fades in instead of being cut by that edge. */
  #cardshadow { position: fixed; inset: 0; z-index: -1; pointer-events: none; -webkit-mask-image: linear-gradient(180deg, transparent 0, rgba(0,0,0,.35) 14px, #000 44px); mask-image: linear-gradient(180deg, transparent 0, rgba(0,0,0,.35) 14px, #000 44px); }
  #cardshadow::before { content: ''; position: absolute; top: 0; right: 8px; bottom: 8px; left: var(--cl, 248px); border-radius: 14px; box-shadow: 0 14px 36px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.07); }
  body.flyout #cardshadow { display: none; }
  aside { width: var(--sw, 240px); height: 100%; padding: 12px 10px 10px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; background: transparent; cursor: pointer; border-radius: 8px; padding: 0; line-height: 1; }
  .row { display: flex; gap: 4px; align-items: center; }
  .icon { width: 32px; height: 32px; flex: none; display: grid; place-items: center; opacity: .75; }
  .icon:hover { background: rgba(255,255,255,.1); opacity: 1; }
  .icon.on { color: var(--accent); opacity: 1; }
  .grow { flex: 1; }
  .section { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .5; padding: 4px 8px 0; white-space: nowrap; }
  #pinned { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; border-radius: 12px; }
  #pinned:empty { display: none; }
  body.dragging #pinned:empty { display: grid; place-items: center; min-height: 56px; border: 1px dashed rgba(255,255,255,.3); background: rgba(255,255,255,.04); }
  body.dragging #pinned:empty::after { content: 'Drop here to pin'; font-size: 12px; opacity: .55; }
  body.dragging #pinned { min-height: 56px; }
  #pinned .tab { justify-content: center; height: 48px; padding: 0; background: rgba(255,255,255,.07); }
  #pinsep { height: 1px; flex: none; margin: 0 6px; background: rgba(255,255,255,.14); }
  #pinned:empty + #pinsep { display: none; }
  #pinned .tab.active { background: rgba(255,255,255,.2); }
  #pinned .dot { width: 28px; height: 28px; border-radius: 9px; font-size: 13px; }
  .secrow[hidden] { display: none; }
  .fold { cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .fold:hover { opacity: 1; }
  body:not(.dragging) #pinned.collapsed, body:not(.dragging) #folders.collapsed { display: none; }
  .secrow { display: flex; justify-content: space-between; align-items: center; padding-right: 2px; }
  .mini { font-size: 11px; text-transform: none; letter-spacing: 0; padding: 2px 6px; opacity: .8; display: inline-flex; align-items: center; gap: 4px; }
  .mini:hover { background: rgba(255,255,255,.1); }
  .folder { display: flex; flex-direction: column; border-radius: 10px; }
  .fh { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; cursor: pointer; }
  .fh:hover { background: rgba(255,255,255,.08); }
  .chev { width: 18px; height: 18px; display: grid; place-items: center; opacity: .7; flex: none; }
  .fname { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { font-size: 11px; opacity: .5; }
  .sedit { width: 110px; flex: none; }
  .fedit { flex: 1; min-width: 0; font: inherit; font-weight: 600; color: inherit; background: rgba(255,255,255,.12); border: 1px solid var(--accent); border-radius: 6px; padding: 1px 6px; outline: none; user-select: text; -webkit-user-select: text; }
  .fb { display: flex; flex-direction: column; gap: 2px; margin-left: 12px; padding-left: 6px; border-left: 1px solid rgba(255,255,255,.12); }
  .folder.collapsed .fb { display: none; }
  body.dropping aside { outline: 2px dashed var(--accent); outline-offset: -4px; }
  .bm .dot { background: rgba(255,255,255,.14); }
  .tab.asleep .dot, .tab.asleep .title { opacity: .45; }
  .tab.dragging { opacity: .35; }
  .ghost { position: fixed; z-index: 50; width: 220px; box-sizing: border-box; pointer-events: none; background: #2a2838; box-shadow: 0 8px 24px rgba(0,0,0,.5); border-radius: 9px; }
  .ghost .x { opacity: 0; }
  .drop-before, .drop-after, #pinned .drop-before, #pinned .drop-after { box-shadow: none; }
  .drop-into { background: rgba(255,255,255,.1); outline: 1px dashed var(--accent); }
  #dropcard { display: none; position: fixed; z-index: 40; pointer-events: none; box-sizing: border-box; border: 2px dotted var(--accent); border-radius: 10px; background: rgba(255,255,255,.06); }
  #dropcard.line { border: 0; border-radius: 3px; background: var(--accent); }
  #folders { display: flex; flex-direction: column; gap: 2px; flex: none; }
  #folders:empty { min-height: 8px; }
  #foldsep { height: 1px; flex: none; margin: 2px 6px; background: rgba(255,255,255,.14); }
  #tabs { flex: none; display: flex; flex-direction: column; gap: 2px; min-height: 40px; }
  /* Everything above the new-tab button scrolls as one; the spaces bar below stays put. */
  #scroll { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 10px; margin-right: -6px; padding-right: 6px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.22) transparent; }
  #scroll > * { flex: none; }
  #scroll::-webkit-scrollbar { width: 6px; }
  #scroll::-webkit-scrollbar-track { background: transparent; }
  #scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 6px; }
  #scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  #stats { flex: none; display: flex; justify-content: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,.55); white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
  #stats:empty { display: none; }
  #spaces, #update, #dls, #media, footer { flex: none; }
  #dls { display: flex; flex-direction: column; gap: 6px; }
  #dls:empty, #media:empty { display: none; }
  #media { display: flex; flex-direction: column; gap: 6px; }
  #tidy:empty { display: none; }
  /* Sidebar cards (tidy-up, meeting, player, downloads): the design system's card, entrance and
     press; the space's color for what is live. */
  #tidy .td, #meet .mt, .mc, .dl { border-radius: var(--bh-radius-card); font: var(--bh-text-body-small);
    animation: card-in var(--bh-duration-spring) var(--bh-ease-pop) backwards; }
  @keyframes card-in { from { opacity: 0; transform: translateY(8px) scale(.97); } }
  #tidy .td { margin: 2px 4px 6px; padding: var(--bh-space-10); background: var(--bh-fill-card); box-shadow: inset 0 0 0 1px var(--bh-border-card); display: flex; flex-direction: column; gap: var(--bh-space-6); }
  #tidy .q { font-weight: 600; }
  #tidy .gs { display: flex; flex-wrap: wrap; gap: var(--bh-space-4); }
  #tidy .gs span { padding: 1px 7px; border-radius: var(--bh-radius-chip); background: var(--bh-fill-control); opacity: var(--bh-opacity-soft); font: var(--bh-text-caption); }
  #tidy .bt { display: flex; justify-content: flex-end; gap: var(--bh-space-6); }
  #tidy button, #meet button { border: 0; border-radius: var(--bh-radius-control); padding: 0 var(--bh-space-10); height: 26px; font: var(--bh-text-caption); font-weight: 600; cursor: pointer; color: inherit;
    background: var(--bh-fill-control); transition: background-color var(--bh-duration-hover) var(--bh-ease-standard), transform var(--bh-duration-press) var(--bh-ease-press); }
  #tidy button:hover { background: var(--bh-fill-control-hover); }
  #tidy button:active, #meet button:active { transform: scale(.95); }
  #tidy button.go, #meet button { background: var(--bh-accent); color: var(--bh-text-on-accent); }
  #tidy button.go:hover, #meet button:hover { background: color-mix(in srgb, var(--bh-accent) 82%, white); }
  #meet:empty { display: none; }
  #meet .mt { display: flex; align-items: center; gap: var(--bh-space-9); padding: var(--bh-space-8) var(--bh-space-8) var(--bh-space-8) var(--bh-space-10);
    background: color-mix(in srgb, var(--bh-accent) 22%, var(--bh-fill-card)); box-shadow: inset 0 0 0 1px var(--bh-accent-border); }
  #meet .mt.on { box-shadow: var(--bh-shadow-meet-live); animation: card-in var(--bh-duration-spring) var(--bh-ease-pop) backwards, meet-live var(--bh-duration-breathe) ease-in-out infinite; }
  @keyframes meet-live { 50% { box-shadow: 0 0 0 1px var(--bh-accent), 0 0 20px -2px var(--bh-accent-glow); } }
  #meet .mt svg { flex: none; width: var(--bh-icon-md); height: var(--bh-icon-md); fill: none; stroke: currentColor; stroke-width: var(--bh-icon-stroke); stroke-linecap: round; stroke-linejoin: round; opacity: var(--bh-opacity-soft); }
  #meet .tx { flex: 1; min-width: 0; }
  #meet .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #meet .wh { opacity: var(--bh-opacity-secondary); font: var(--bh-text-caption); }
  .mc { display: flex; flex-direction: column; gap: var(--bh-space-6); padding: var(--bh-space-8) var(--bh-space-10); background: var(--bh-fill-card); box-shadow: inset 0 0 0 1px var(--bh-border-card); }
  .mc .top { display: flex; align-items: center; gap: var(--bh-space-8); min-width: 0; cursor: pointer; border-radius: var(--bh-radius-row); }
  .mc .top:hover .nm { text-decoration: underline; text-underline-offset: 2px; }
  .mc .top .dot { flex: none; }
  .mc .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .mc .ctl { display: flex; align-items: center; justify-content: center; gap: var(--bh-space-4); }
  .mc button { border: 0; background: var(--bh-fill-control); color: inherit; border-radius: var(--bh-radius-control); width: 30px; height: 26px; cursor: pointer; display: grid; place-items: center; padding: 0;
    transition: background-color var(--bh-duration-hover) var(--bh-ease-standard), transform var(--bh-duration-press) var(--bh-ease-press); }
  .mc button:hover { background: var(--bh-fill-control-hover); }
  .mc button:active { transform: scale(.9); }
  .mc button.off { background: var(--bh-media-off); }
  .mc .cl { background: none; width: 26px; opacity: var(--bh-opacity-secondary); }
  .mc .cl:hover { opacity: 1; }
  .snd { flex: none; width: 24px; height: 24px; margin: -2px 0; display: grid; place-items: center; border: 0; border-radius: var(--bh-radius-chip); background: none; color: inherit; padding: 0; cursor: pointer; opacity: var(--bh-opacity-soft); }
  #pinned .tab { position: relative; }
  body.noanim .mc, body.noanim .mc * { animation: none !important; transition: none !important; }
  .dl { display: flex; flex-direction: column; gap: var(--bh-space-6); padding: var(--bh-space-8) var(--bh-space-10); background: var(--bh-fill-card); box-shadow: inset 0 0 0 1px var(--bh-border-card); cursor: pointer;
    transition: background-color var(--bh-duration-hover) var(--bh-ease-standard), box-shadow var(--bh-duration-base) var(--bh-ease-standard), transform var(--bh-duration-press) var(--bh-ease-press); }
  .dl:hover { background: var(--bh-fill-hover-strong); }
  .dl:active { transform: scale(.97); }
  .dl .top { display: flex; align-items: center; gap: var(--bh-space-8); min-width: 0; }
  .dl .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .dl .pc { flex: none; opacity: var(--bh-opacity-secondary); font: var(--bh-text-caption); font-variant-numeric: tabular-nums; }
  .dl .bar { height: var(--bh-size-progress); border-radius: var(--bh-radius-pill); overflow: hidden; background: var(--bh-fill-control); }
  .dl .fill { height: 100%; width: 0; border-radius: var(--bh-radius-pill); background: var(--bh-accent); box-shadow: var(--bh-shadow-progress); transition: width var(--bh-duration-panel) var(--bh-ease-glide); }
  .dl.unk .fill { width: 35%; animation: dl-slide 1.1s ease-in-out infinite; }
  /* Done: the bar fills in green and the card flashes once; a click opens Library > Downloads. */
  .dl.ok { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bh-success) 45%, transparent); animation: dl-done var(--bh-duration-lit) var(--bh-ease-standard); }
  .dl.ok .pc { color: var(--bh-success-text); opacity: 1; font-weight: 600; }
  .dl.ok .fill { width: 100%; background: var(--bh-success); box-shadow: none; }
  .dl.bad { box-shadow: inset 0 0 0 1px var(--bh-insecure-border); }
  .dl.bad .pc { color: var(--bh-danger-text); opacity: 1; }
  .dl.bad .fill { width: 100%; background: var(--bh-danger-solid); box-shadow: none; }
  @keyframes dl-done { 30% { background: color-mix(in srgb, var(--bh-success) 22%, var(--bh-fill-card)); } }
  @keyframes dl-slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  body.noanim .dl, body.noanim .dl *, body.noanim #tidy .td, body.noanim #meet .mt { animation: none !important; transition: none !important; }
  .newrow { display: flex; align-items: center; margin: 4px 0; } .newrow .new { flex: 1; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 13px; border-radius: 9px; cursor: pointer; min-width: 0; }
  .tab:hover { background: rgba(255,255,255,.08); }
  .tab.active { background: rgba(255,255,255,.16); }
  .dot { flex: none; width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
  .dot img, .tile img { width: 100%; height: 100%; object-fit: contain; border-radius: inherit; }
  .dot.ico { background: rgba(255,255,255,.16) !important; padding: 2px; box-sizing: border-box; font-size: 0; }
  .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .x { opacity: 0; width: 24px; height: 24px; margin: -2px -2px -2px 0; border-radius: 6px; display: grid; place-items: center; flex: none; }
  .tab:hover .x { opacity: .7; } .x:hover { background: rgba(255,255,255,.15); opacity: 1 !important; }
  #pinned .title, #pinned .x { display: none; }
  .new { text-align: left; padding: 8px 8px 8px 14px; opacity: .7; white-space: nowrap; display: flex; align-items: center; gap: 9px; } .new:hover { background: rgba(255,255,255,.08); opacity: 1; }
  footer { display: flex; align-items: center; gap: 4px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.08); }
  #spaces { display: flex; gap: 6px; width: 100%; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
  #spaces::-webkit-scrollbar { display: none; }
  /* A space is a card: its colour as a background, the emoji (or initial) on top. */
  .space { flex: 1 1 0; height: 34px; min-width: 34px; border-radius: 11px; border: 0; padding: 0 7px; display: flex; align-items: center; justify-content: center; gap: 7px; color: #fff; font-size: 18px; line-height: 1; font-weight: 700;
    background: linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 55%, #000)); opacity: .62; transition: opacity .15s, transform .15s, box-shadow .15s, flex-grow .3s cubic-bezier(.3,1.2,.4,1); }
  .space.active { flex-grow: 2.4; }
  .space.sdragging { opacity: .3; }
  .space.sdrop-before { box-shadow: -3px 0 0 0 #fff; }
  .space.sdrop-after { box-shadow: 3px 0 0 0 #fff; }
  .space:hover { opacity: .92; transform: translateY(-1px); }
  .space.active { opacity: 1; box-shadow: 0 0 0 2px rgba(255,255,255,.92), 0 5px 14px color-mix(in srgb, var(--c) 60%, transparent); }
  .space .sname { font-size: 12.5px; font-weight: 600; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: none; }
  .space.active .sname { display: block; }
  .space .gl { font-size: 18px; }
  .space:not(.emoji) .gl { font-size: 14px; }
  .ficon { flex: none; width: 20px; height: 20px; display: grid; place-items: center; line-height: 1; font-size: 14px; border-radius: 6px; }
  .ficon:hover { background: rgba(255,255,255,.14); }
  .ficon.def { opacity: .6; filter: grayscale(1); }
  .tab.split { box-shadow: inset 3px 0 0 var(--accent); background: rgba(255,255,255,.09); }
  .tab.split.active { background: rgba(255,255,255,.2); }
  .mo { flex: none; width: 24px; height: 24px; margin: -2px 0; display: grid; place-items: center; border-radius: 6px; opacity: 0; }
  .tab:hover .mo { opacity: .7; } .mo:hover { background: rgba(255,255,255,.15); opacity: 1 !important; }
  #pinned .mo { display: none; }
  .sp { flex: none; width: 24px; height: 24px; margin: -2px 0; display: grid; place-items: center; border-radius: 6px; opacity: 0; }
  .tab:hover .sp { opacity: .7; } .sp:hover { background: rgba(255,255,255,.15); opacity: 1 !important; }
  .tab.split .sp { opacity: 1; color: var(--accent); }
  #pinned .sp { display: none; }
  /* Idle tabs give the room of their hover buttons to the title, which truncates later. */
  .tab:not(:hover) :is(.x, .mo) { display: none; }
  .tab:not(:hover):not(.split) .sp { display: none; }
  .tab { gap: 6px; }
  .shield { font-size: 11px; opacity: .7; padding: 0 8px; height: 32px; display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; border: 0; border-radius: 8px; background: transparent; color: inherit; white-space: nowrap; }
  .shield:hover { opacity: 1; background: rgba(255,255,255,.12); }
  /* The count jumps when something new is blocked (as on Android). */
  #blockedn { display: inline-block; }
  #blockedn.bump { animation: bump .4s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes bump { 40% { transform: scale(1.35); color: #8ff0b4; } }
  #toast { position: fixed; bottom: 54px; left: 10px; width: calc(var(--sw, 240px) - 20px); padding: 8px 12px; border-radius: 10px; background: #1b1a26; border: 1px solid rgba(255,255,255,.14); opacity: 0; transition: opacity .25s; pointer-events: none; font-size: 12px; }
  #toast.show { opacity: 1; }
  #toast.act { display: flex; align-items: center; gap: 8px; }
  #toast.act.show { pointer-events: auto; }
  #toast .txt { flex: 1; min-width: 0; }
  #toast button { flex: none; border: 0; border-radius: 7px; padding: 3px 9px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  #toast button.alt { background: rgba(255,255,255,.12); font-weight: 500; }
  #toast.act { flex-wrap: wrap; }



  /* Update button: only present when a newer release is available */
  .update { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: flex-start; gap: 8px; width: 100%; padding: 8px 10px; font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; background: linear-gradient(135deg, var(--accent), rgba(255,255,255,.22)); box-shadow: 0 0 0 1px rgba(255,255,255,.14); transition: box-shadow .2s ease; }
  .update[hidden] { display: none; }
  .update .ico { flex: none; display: inline-flex; width: 18px; height: 18px; align-items: center; justify-content: center; }
  .update .ico svg { width: 16px; height: 16px; display: block; }
  .update::after { content: ""; position: absolute; inset: 0; transform: translateX(-120%); background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); pointer-events: none; }
  .update:hover, .update.hov { box-shadow: 0 0 0 1px rgba(255,255,255,.3), 0 6px 20px var(--glow); }
  .update:hover .ico, .update.hov .ico { animation: up-bounce .7s ease-in-out infinite; }
  .update:hover::after, .update.hov::after { animation: up-shine .9s ease-out; }
  .update.busy { cursor: progress; opacity: .85; }
  .update.busy .ico { animation: up-spin 1s linear infinite; }
  .update.error { background: linear-gradient(135deg, #b4443c, rgba(255,255,255,.18)); }
  @keyframes up-bounce { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-3px); } }
  @keyframes up-shine { to { transform: translateX(120%); } }
  @keyframes up-spin { to { transform: rotate(360deg); } }
  body.noanim .update, body.noanim .update * { animation: none !important; transition: none !important; }
  /* Install: a ship takes off from the button (launchShip); same motion as Settings > Updates. */
  .launch { position: fixed; z-index: 50; width: 20px; height: 20px; margin: -10px 0 0 -10px; pointer-events: none; color: #fff;
    filter: drop-shadow(0 0 6px var(--accent)); animation: launch-climb 1.4s cubic-bezier(.55, 0, 1, .45) forwards; }
  .launch svg { width: 20px; height: 20px; display: block; animation: launch-shake .08s linear 5; }
  .launch::after { content: ""; position: absolute; left: 50%; top: 92%; width: 4px; margin-left: -2px; border-radius: 2px; height: 0;
    background: linear-gradient(to bottom, #ffd36b, rgba(255, 90, 40, .6) 35%, transparent); animation: launch-flame 1.4s ease-in forwards; }
  .launch .spark { position: absolute; left: 50%; top: 100%; width: 3px; height: 3px; border-radius: 50%; background: #ffc35c; opacity: 0;
    animation: launch-spark .7s .2s ease-out forwards; }
  @keyframes launch-climb { 0% { transform: translateY(6px) scale(.4); opacity: 0; } 12% { transform: translateY(0) scale(1); opacity: 1; }
    35% { transform: translateY(-4px); } 100% { transform: translateY(-110vh) scale(.85); opacity: 1; } }
  @keyframes launch-shake { 25% { transform: translateX(-.6px); } 75% { transform: translateX(.6px); } }
  @keyframes launch-flame { 0%, 25% { height: 4px; opacity: 1; } 100% { height: 160px; opacity: 0; } }
  @keyframes launch-spark { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  .update.launched .ico { visibility: hidden; }
  body.noanim .launch { display: none; }
  @media (prefers-reduced-motion: reduce) { .launch { display: none; } }

  /* ---- Motion ----------------------------------------------------------------------------
     Rows reflow smoothly (FLIP in `motion` below), closed rows fade out where they were,
     new rows slide in, the tab that becomes active lights up, buttons give under the pointer. */
  .tab, .fh, .new, .icon, .mini, .shield, .ficon, .x, .mo, .sp, .snd, .space {
    transition: background-color .18s ease, opacity .18s ease, box-shadow .22s ease, transform .16s cubic-bezier(.3,1.4,.5,1), flex-grow .3s cubic-bezier(.3,1.2,.4,1); }
  .tab:active:not(.dragging), .fh:active, .new:active, .icon:active, .mini:active, .shield:active { transform: scale(.975); }
  .space:active { transform: scale(.94); }
  .tab.active { box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 1px 0 rgba(255,255,255,.04); }
  #pinned .tab:hover { transform: translateY(-1px); background: rgba(255,255,255,.11); }
  #pinned .tab.active { box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 8px 18px -8px var(--glow); }
  #pinned .tab .dot { transition: transform .22s cubic-bezier(.3,1.6,.5,1); }
  #pinned .tab:hover .dot { transform: scale(1.08); }
  .tab.lit { animation: tab-lit .55s cubic-bezier(.2,.8,.2,1); }
  @keyframes tab-lit { from { background-color: color-mix(in srgb, var(--accent) 42%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent), 0 0 18px -4px var(--glow); } }
  .ghost-out { position: fixed; z-index: 30; margin: 0; pointer-events: none; }
  #toast { transform: translateY(10px) scale(.97); transition: opacity .25s ease, transform .34s cubic-bezier(.2,1.3,.4,1); }
  #toast.show { transform: none; }
  #scroll::-webkit-scrollbar-thumb { transition: background-color .2s ease; }
  body.noanim *, body.noanim *::before, body.noanim *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  /* Icons (ui/icons.js) on the scale of the design system: 16 px in buttons, 12 px inline marks. */
  .ficon.def { filter: none; }
  .tab .dot.glyph { background: rgba(255,255,255,.14); color: inherit; }
</style>
</head>
<body>
<div id="cardshadow"></div>
<aside>
<div id="scroll">
  <div class="section secrow" id="pinhead" hidden><span class="fold" id="pinfold" data-i18n-title="sidebar.toggle_quick"></span></div>
  <div id="pinned"></div>
  <div id="pinsep"></div>
  <div class="section secrow"><span class="fold" id="foldfold" data-i18n-title="sidebar.toggle_folders"></span><button class="mini" id="newfolder" data-i18n-title="palette.new_folder"><i data-icon="plus" data-size="xs"></i><span data-i18n="sidebar.folder">Folder</span></button></div>
  <div id="folders"></div>
  <div id="foldsep"></div>
  <div class="newrow"><button class="new" id="new"><i data-icon="plus"></i><span class="full-only" data-i18n="sidebar.new_tab">New tab</span></button></div>
  <div id="tidy"></div>
  <div id="tabs"></div>
</div>
  <div id="spaces"></div>
  <div id="meet"></div>
  <div id="media"></div>
  <div id="dls"></div>
  <button class="update" id="update" hidden><span class="ico"></span><span class="full-only" id="updtxt"></span></button>
  <div id="stats" data-i18n-title="sidebar.stats_hint"></div>
  <footer>
    <button class="icon" id="library" data-i18n-title="palette.hint_library" data-i18n-aria="palette.hint_library"><i data-icon="library"></i></button>
    <button class="icon" id="gear" data-i18n-aria="settings.title"><i data-icon="gear"></i></button>
    <button class="shield" id="shield" data-i18n-title="sidebar.privacy_report"><i data-icon="shield"></i><span class="full-only" id="blockedn"> 0</span></button>
    <span class="grow"></span>
    <button class="icon" id="addspace" data-i18n-title="palette.new_space" data-i18n-aria="palette.new_space"><i data-icon="plus"></i></button>
  </footer>
</aside>
<div id="toast"></div>
<script>
const send = (m) => window.ipc.postMessage(JSON.stringify(m));
const $ = (id) => document.getElementById(id);
const PALETTE = ['#7c5cff', '#ff5c8a', '#2fd4a0', '#ffb020', '#3aa0ff'];
let state = { tabs: [], spaces: [], engines: [], activeTab: null };
let shownTab = null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return 'hsl(' + h + ',60%,50%)'; }
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
// The site's own icon replaces the coloured initial; the initial comes back if it fails to load.
function withIcon(node, url, favicons) {
  const src = (favicons || {})[host(url)];
  if (!src) return node;
  const letter = node.textContent, bg = node.style.background;
  const img = document.createElement('img');
  img.referrerPolicy = 'no-referrer';
  img.decoding = 'async';
  img.draggable = false;
  img.onerror = () => { img.remove(); node.textContent = letter; node.style.background = bg; node.classList.remove('ico'); };
  img.src = src;
  node.textContent = '';
  node.style.background = '';
  node.classList.add('ico');
  node.append(img);
  return node;
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }

function tabNode(t) {
  const n = el('div', 'tab' + (t.id === state.activeTab ? ' active' : '') + (t.asleep ? ' asleep' : ''));
  n.title = t.asleep ? bhT('sidebar.asleep', { title: t.title }) : t.title;
  n.dataset.tab = t.id;
  n.dataset.pinned = t.pinned ? '1' : '';
  n.dataset.folder = t.folder == null ? '' : t.folder;
  const d = el('span', 'dot', (host(t.url)[0] || '•').toUpperCase());
  d.style.background = hue(host(t.url));
  withIcon(d, t.url, state.favicons);
  if (t.split) n.classList.add('split');
  if (!t.pinned && (t.split || t.id !== state.activeTab)) {
    const sp = el('button', 'sp');
    sp.append(bhIcon('split'));
    sp.title = bhT(t.split ? 'palette.close_split' : 'menu.split_open');
    sp.onmousedown = (e) => e.stopPropagation();
    sp.onclick = (e) => { e.stopPropagation(); send(t.split ? { cmd: 'close_split' } : { cmd: 'split', id: t.id }); };
    n.append(d, el('span', 'title', t.title), sp);
  } else n.append(d, el('span', 'title', t.title));
  // No speaker on quick access tiles: it covered the tile, so a playing tab was hard to click.
  const md = !t.pinned && (state.media || []).find(m => m.id === t.id);
  if (md && (md.playing || md.muted)) {
    const sn = el('button', 'snd');
    sn.append(bhIcon(md.muted ? 'mute' : 'sound', 'xs'));
    sn.title = bhT(md.muted ? 'sidebar.unmute_this' : 'sidebar.playing_mute');
    sn.onmousedown = (e) => e.stopPropagation();
    sn.onclick = (e) => { e.stopPropagation(); send({ cmd: 'media_ctl', id: t.id, action: 'mute' }); };
    n.insertBefore(sn, n.querySelector('.sp, .title').nextSibling);
  }
  if (!t.pinned) {
    const mo = el('button', 'mo');
    mo.append(bhIcon('more'));
    mo.title = bhT('sidebar.tab_options');
    mo.onmousedown = (e) => e.stopPropagation();
    mo.onclick = (e) => { e.stopPropagation(); const r = mo.getBoundingClientRect(); tabMenu(t, r.left, r.bottom + 4); };
    n.append(mo);
  }
  // A quick access or folder tab keeps its place: its button puts it to sleep, like Cmd/Ctrl+W
  // (closing it for good is in its menu). Other tabs close.
  const keep = t.pinned || t.folder != null;
  if (!keep || !t.asleep) {
    const x = el('button', 'x');
    x.append(bhIcon(keep ? 'minus' : 'close', 'xs'));
    x.title = bhT(keep ? 'sidebar.sleep_hint' : 'menu.close_tab');
    x.onmousedown = (e) => e.stopPropagation();
    x.onclick = (e) => { e.stopPropagation(); send(keep ? { cmd: 'close_instance', id: t.id } : { cmd: 'close', id: t.id }); };
    n.append(x);
  }
  n.onmousedown = (e) => {
    if (e.button === 0) down = { id: t.id, node: n, x: e.clientX, y: e.clientY };
    else if (e.button === 1) e.preventDefault(); // no autoscroll
  };
  n.onclick = () => { if (!justDragged) send({ cmd: 'activate', id: t.id }); };
  // Middle click: a quick access or folder tab goes to sleep (it stays), another tab closes.
  n.onauxclick = (e) => {
    if (e.button !== 1) return;
    e.preventDefault();
    send(keep ? { cmd: 'close_instance', id: t.id } : { cmd: 'close', id: t.id });
  };
  n.oncontextmenu = (e) => { e.preventDefault(); tabMenu(t, e.clientX, e.clientY); };
  return n;
}

function openMenu(x, y, items) { send({ cmd: 'menu', origin: 'sidebar', x, y, items }); }

// Menus share one vocabulary: "quick access" (pinned tiles), "put to sleep" (the tab keeps its
// place), "close" (it goes to the archive), "delete" (a container and what is inside). Icons are
// names drawn by the command bar (palette.html); `confirm` asks for a second click.
function tabMenu(t, x, y) {
  const keep = t.pinned || t.folder != null;
  const items = [{ icon: 'pin', label: bhT(t.pinned ? 'menu.quick_remove' : 'menu.quick_add'), run: { cmd: 'pin', id: t.id } }];
  items.push({ icon: 'edit', label: bhT('menu.rename_tab'), run: { cmd: 'edit_tab', id: t.id } });
  if (!t.pinned) {
    if (t.split) items.push({ icon: 'split', label: bhT('palette.close_split'), run: { cmd: 'close_split' } });
    else if (t.id !== state.activeTab) items.push({ icon: 'split', label: bhT('menu.split_open'), run: { cmd: 'split', id: t.id } });
  }
  if (t.folder != null) items.push({ icon: 'out', label: bhT('menu.out_of_folder'), run: { cmd: 'move_tab', id: t.id, before: null, folder: null, pinned: false } });
  items.push({ sep: true });
  if (!t.asleep) items.push({ icon: 'reload', label: bhT('bar.reload'), run: { cmd: 'reload_tab', id: t.id } });
  items.push({ icon: 'copy', label: bhT('menu.duplicate'), run: { cmd: 'duplicate_tab', id: t.id } });
  items.push({ icon: 'link', label: bhT('menu.copy_link'), copy: t.url });
  items.push({ icon: 'compare', label: bhT('menu.compare'), run: { cmd: 'action', id: 'compare' } });
  if (/^https?:/.test(t.url)) items.push(...(state.devices || []).map(d => ({ icon: 'devices', label: bhT('palette.continue_on', { name: d.name }), run: { cmd: 'continue_on', id: t.id, device: d.id } })));
  if (t.id === state.activeTab && !t.asleep) items.push({ icon: 'code', label: bhT('menu.inspect'), run: { cmd: 'action', id: 'key:devtools' } });
  const md = (state.media || []).find(m => m.id === t.id);
  if (md) items.push({ icon: md.muted ? 'sound' : 'mute', label: bhT(md.muted ? 'menu.unmute_tab' : 'menu.mute_tab'), run: { cmd: 'media_ctl', id: t.id, action: 'mute' } });
  const others = state.spaces.filter(sp => sp.id !== state.activeSpace);
  if (others.length) {
    items.push({ sep: true }, { head: bhT('menu.move_to_space') });
    items.push(...others.map(sp => ({ icon: sp.icon || 'space', color: sp.icon ? null : sp.color, label: sp.name, run: { cmd: 'move_tab_to_space', id: t.id, space: sp.id } })));
  }
  items.push({ sep: true });
  const loose = state.tabs.filter(o => o.id !== t.id && !o.pinned && o.folder == null).length;
  if (loose) items.push({ icon: 'close', label: bhT('menu.close_others'), confirm: bhTn('menu.close_others_confirm', loose), run: { cmd: 'close_other_tabs', id: t.id } });
  if (t.pinned) {
    // Closing a quick access tab never takes it off the list (like Cmd/Ctrl+W): it only stops
    // its page. "Remove from quick access" above is the way to take it off.
    if (!t.asleep) items.push({ icon: 'close', label: bhT('menu.close_tab'), run: { cmd: 'close_instance', id: t.id } });
  } else {
    if (keep && !t.asleep) items.push({ icon: 'sleep', label: bhT('menu.sleep'), run: { cmd: 'close_instance', id: t.id } });
    items.push({ icon: 'close', label: bhT('menu.close_tab'), danger: true, run: { cmd: 'close', id: t.id } });
  }
  openMenu(x, y, items);
}

// Space colors offered in its menu (any #rrggbb is accepted by the host).
const COLORS = [['color.violet', '#7c5cff'], ['color.pink', '#ff5c8a'], ['color.green', '#2fd4a0'], ['color.amber', '#ffb020'], ['color.blue', '#3aa0ff'], ['color.red', '#e5534b'], ['color.teal', '#14b8c4'], ['color.grey', '#8b8a99']];

function spaceMenu(sp, x, y) {
  const items = [];
  if (sp.id !== state.activeSpace) items.push({ icon: 'switch', label: bhT('menu.switch_space'), run: { cmd: 'space', id: sp.id } });
  items.push(
    { icon: 'emoji', label: bhT('menu.change_emoji'), run: { cmd: 'pick_icon', kind: 'space', id: sp.id } },
    { icon: 'edit', label: bhT('menu.rename_space'), run: { cmd: 'edit_space', id: sp.id } },
    { sep: true }, { head: bhT('easel.color') },
    ...COLORS.map(([name, hex]) => ({ icon: hex.toLowerCase() === (sp.color || '').toLowerCase() ? 'check' : '', color: hex, label: bhT(name), run: { cmd: 'set_space_color', id: sp.id, color: hex } })),
  );
  if (state.spaces.length > 1) {
    // Only the active space's tabs are known here; the others say nothing about their count.
    const n = sp.id === state.activeSpace ? state.tabs.length : null;
    const confirm = n === 0 ? bhT('easel.delete_confirm') : n == null ? bhT('menu.archive_its_tabs') : bhTn('menu.archive_tabs_confirm', n);
    items.push({ sep: true }, { icon: 'trash', label: bhT('menu.delete_space'), danger: true, confirm, run: { cmd: 'delete_space', id: sp.id } });
  }
  openMenu(x, y, items);
}

function folderMenu(f, x, y) {
  // Its subfolders go with it, and their tabs too.
  const tree = new Set([f.id]);
  for (let grew = true; grew;) {
    grew = false;
    for (const s of state.folders) if (!tree.has(s.id) && tree.has(s.parent)) { tree.add(s.id); grew = true; }
  }
  const inside = state.tabs.filter(t => tree.has(t.folder)).length;
  openMenu(x, y, [
    { icon: 'edit', label: bhT('menu.rename_folder'), run: { cmd: 'edit_folder', id: f.id } },
    { icon: 'emoji', label: bhT('menu.change_emoji'), run: { cmd: 'pick_icon', kind: 'folder', id: f.id } },
    { icon: 'folder', label: bhT('menu.new_subfolder'), run: { cmd: 'new_folder', parent: f.id } },
    { icon: f.collapsed ? 'expand' : 'collapse', label: bhT(f.collapsed ? 'menu.expand_folder' : 'menu.collapse_folder'), run: { cmd: 'toggle_folder', id: f.id } },
    ...(f.parent != null ? [{ icon: 'out', label: bhT('menu.out_of_folder'), run: { cmd: 'move_folder', id: f.id, parent: null, before: null } }] : []),
    { sep: true },
    { icon: 'trash', label: bhT('menu.delete_folder'), danger: true, confirm: inside ? bhTn('menu.archive_tabs_confirm', inside) : bhT('easel.delete_confirm'), run: { cmd: 'delete_folder', id: f.id } },
  ]);
}

// Right-click on empty sidebar space: create things, then the Easels to open.
function createMenu(x, y) {
  const easels = state.easels || [];
  openMenu(x, y, [
    { icon: 'plus', label: bhT('sidebar.new_tab'), run: { cmd: 'new_tab' } },
    { icon: 'folder', label: bhT('palette.new_folder'), run: { cmd: 'new_folder' } },
    { icon: 'space', label: bhT('palette.new_space'), run: { cmd: 'action', id: 'new_space' } },
    { icon: 'easel', label: bhT('menu.new_easel'), run: { cmd: 'action', id: 'new_easel' } },
    { icon: 'video', label: bhT('palette.new_meet'), run: { cmd: 'open_meet' } },
    ...(easels.length ? [{ sep: true }, { head: 'Easels' }] : []),
    ...easels.map(e => ({ icon: 'easel', label: e.name, run: { cmd: 'open_easel_tab', id: e.id } })),
  ]);
}
document.querySelector('aside').oncontextmenu = (e) => { if (!e.defaultPrevented) { e.preventDefault(); createMenu(e.clientX, e.clientY); } };

// An easel is a tab of its own: click to open it, right-click for options.
function easelNode(e) {
  const n = el('div', 'tab easel' + (e.open ? ' active' : ''));
  const ed = el('span', 'dot glyph');
  ed.append(bhIcon('easel', 'xs'));
  n.append(ed, el('span', 'title', e.name), el('span', 'count', e.count ? String(e.count) : ''));
  n.title = bhT('sidebar.easel_hint', { name: e.name });
  n.dataset.easel = e.id;
  n.onmousedown = (ev) => { if (ev.button === 0) down = { easel: e.id, node: n, x: ev.clientX, y: ev.clientY }; };
  n.onclick = () => { if (!justDragged) send({ cmd: 'open_easel_tab', id: e.id }); };
  n.oncontextmenu = (ev) => {
    ev.preventDefault();
    openMenu(ev.clientX, ev.clientY, [
      { icon: 'easel', label: bhT('menu.open_as_tab'), run: { cmd: 'open_easel_tab', id: e.id } },
      { icon: 'window', label: bhT('menu.open_in_easel_window'), run: { cmd: 'open_easel', id: e.id } },
      ...(state.folders.some(f => f.id === e.folder) ? [{ icon: 'out', label: bhT('menu.out_of_folder'), run: { cmd: 'move_easel', id: e.id, folder: null } }] : []),
      { sep: true },
      { icon: 'trash', label: bhT('menu.delete_easel'), danger: true, confirm: bhT('menu.delete_easel_confirm'), run: { cmd: 'delete_easel', id: e.id } },
    ]);
  };
  return n;
}

function folderNode(f, tabs, easels = [], subs = []) {
  const box = el('div', 'folder' + (f.collapsed ? ' collapsed' : ''));
  const h = el('div', 'fh');
  h.dataset.folder = f.id;
  const chev = el('span', 'chev');
  chev.append(bhIcon(f.collapsed ? 'collapse' : 'expand', 'xs'));
  const ficon = el('span', 'ficon' + (f.icon ? '' : ' def'), f.icon || null);
  if (!f.icon) ficon.append(bhIcon('folder'));
  ficon.title = bhT('menu.change_emoji');
  ficon.onmousedown = (e) => e.stopPropagation();
  ficon.onclick = (e) => { e.stopPropagation(); send({ cmd: 'pick_icon', kind: 'folder', id: f.id }); };
  const name = el('span', 'fname', f.name);
  h.title = bhT('sidebar.folder_hint', { name: f.name });
  h.append(chev, ficon, name, el('span', 'count', tabs.length + easels.length ? String(tabs.length + easels.length) : ''));
  h.onclick = () => { if (!justDragged) send({ cmd: 'toggle_folder', id: f.id }); };
  h.onmousedown = (e) => { if (e.button === 0 && !editing) down = { folder: f.id, node: box, x: e.clientX, y: e.clientY }; };
  h.ondblclick = () => editFolder(h, name, f);
  h.oncontextmenu = (e) => { e.preventDefault(); folderMenu(f, e.clientX, e.clientY); };
  const body = el('div', 'fb');
  body.dataset.folder = f.id;
  body.append(...subs, ...tabs.map(tabNode), ...easels.map(easelNode));
  box.append(h, body);
  return { box, name, h, f };
}
const folderNodes = new Map();
function editFolderId(id) { const n = folderNodes.get(id); if (n) editFolder(n.h, n.name, n.f); }

function editTab(id) {
  const node = document.querySelector('.tab[data-tab="' + id + '"]');
  const t = state.tabs.find(t => t.id === id);
  const title = node && node.querySelector('.title');
  if (!title || !t) return;
  editing = true;
  const input = el('input', 'fedit');
  input.value = t.title;
  let done = false;
  const finish = (commit) => {
    if (done) return; done = true; editing = false;
    if (commit && input.value.trim() !== t.title) send({ cmd: 'rename_tab', id, name: input.value });
    flush();
    window.bh.render(state);
  };
  input.onkeydown = (e) => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); e.stopPropagation(); };
  input.onblur = () => finish(true);
  for (const ev of ['click', 'mousedown', 'dblclick']) input.addEventListener(ev, (e) => e.stopPropagation());
  title.replaceWith(input);
  input.focus(); input.select();
}

function editSpace(id) {
  const b = document.querySelector('.space[data-space="' + id + '"]');
  const sp = state.spaces.find(s => s.id === id);
  if (!b || !sp) return;
  editing = true;
  const input = el('input', 'fedit sedit');
  input.value = sp.name;
  let done = false;
  const finish = (commit) => {
    if (done) return; done = true; editing = false;
    if (commit && input.value.trim() && input.value.trim() !== sp.name) send({ cmd: 'rename_space', id, name: input.value });
    flush();

    if (pc.textContent !== label) pc.textContent = label;
    const width = known && !d.state ? pct + '%' : '';
    if (c.lastChild.firstChild.style.width !== width) c.lastChild.firstChild.style.width = width;
    c.title = d.name + (known ? ' — ' + fmtBytes(d.received) + ' / ' + fmtBytes(d.total) : '');
    if (box.children[i] !== c) box.insertBefore(c, box.children[i] || null);
  });
  for (const [id, c] of dlNodes) if (!seen.has(id)) { c.remove(); dlNodes.delete(id); }
}
// Arc-style mini player for a tab that plays (or was paused) while another page is shown.
// It stays on the player it shows while that tab is listed, and is only rebuilt when what it
// shows changes: a state refresh no longer replays its animation or reloads its icon.
let mediaId = null, mediaSig = '';
// Tidy-up suggestion: the loose tabs of the busiest sites, filed into one folder per site.
let tidySig = '';
function renderTidy(t) {
  const sig = t ? JSON.stringify(t) : '';
  if (sig === tidySig) return;
  tidySig = sig;
  if (!t) { $('tidy').replaceChildren(); return; }
  const card = el('div', 'td');
  const folders = t.groups.length;
  card.append(el('div', 'q', bhTn('sidebar.tidy_ask', folders, { tabs: t.tabs })));
  const gs = el('div', 'gs');
  gs.append(...t.groups.map(g => el('span', null, `${g.name} · ${g.count}`)));
  const bt = el('div', 'bt');
  const later = el('button', null, bhT('sidebar.not_now'));
  later.onclick = () => send({ cmd: 'dismiss_tidy' });
  const go = el('button', 'go', bhT('sidebar.tidy_up'));
  go.onclick = () => send({ cmd: 'tidy' });
  bt.append(later, go);
  card.append(gs, bt);
  $('tidy').replaceChildren(card);
}
// The next meeting of the synced calendars (Settings > Calendar), with a Join button. Only
// rebuilt when it changes (its "In N min" moves once a minute).
let meetSig = '';
function renderMeeting(m) {
  const box = $('meet');
  const sig = m ? JSON.stringify(m) : '';
  if (sig === meetSig) return;
  const fresh = !meetSig || !m || JSON.parse(meetSig).url !== m.url;
  meetSig = sig;
  if (!m) { box.replaceChildren(); return; }
  const card = fresh || !box.firstChild ? el('div', 'mt') : box.firstChild;
  card.className = 'mt' + (m.on ? ' on' : '');
  card.title = m.title + ' — ' + m.when;
  const ico = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  ico.setAttribute('viewBox', '0 0 16 16');
  ico.innerHTML = '<rect x="1.5" y="4" width="9" height="8" rx="1.8"/><path d="M10.5 7l4-2.2v6.4l-4-2.2"/>';
  const tx = el('div', 'tx');
  tx.append(el('div', 'nm', m.title), el('div', 'wh', m.when));
  const join = el('button', null, bhT('sidebar.join'));
  join.onclick = () => send({ cmd: 'open_meet', url: m.url });
  card.replaceChildren(ico, tx, join);
  if (!card.parentNode) box.replaceChildren(card);
}
function renderMedia(s) {
  const box = $('media');
  const list = (s.media || []).filter(m => m.id !== s.activeTab);
  const m = list.find(m => m.id === mediaId) || list.find(m => m.playing) || list[0];
  const t = m && s.tabs.find(t => t.id === m.id);
  if (!t) { mediaId = null; mediaSig = ''; box.replaceChildren(); return; }
  const icon = (s.favicons || {})[host(t.url)] || '';
  const sig = JSON.stringify([t.id, t.title, t.url, icon, m.playing, m.muted, m.mic, m.micOn, m.cam, m.camOn]);
  if (sig === mediaSig && box.firstChild) return;
  let card = box.firstChild;
  // A new card slides in; the same player only has its content refreshed.
  if (!card || mediaId !== t.id) { card = el('div', 'mc'); box.replaceChildren(card); }
  mediaId = t.id;
  mediaSig = sig;
  const top = el('div', 'top');
  const d = el('span', 'dot', (host(t.url)[0] || '•').toUpperCase());
  d.style.background = hue(host(t.url));
  withIcon(d, t.url, s.favicons);
  top.append(d, el('span', 'nm', t.title || host(t.url)));
  top.title = bhT('sidebar.go_to', { host: host(t.url) });
  top.onclick = () => send({ cmd: 'activate', id: t.id });
  const ctl = el('div', 'ctl');
  const btn = (cls, icon, title, action) => { const b = el('button', cls); b.append(bhIcon(icon)); b.title = title; b.setAttribute('aria-label', title); b.onclick = () => send({ cmd: 'media_ctl', id: t.id, action }); return b; };
  ctl.append(
    btn('', m.playing ? 'pause' : 'play', bhT(m.playing ? 'easel.pause' : 'sidebar.play'), 'toggle'),
    btn('', m.muted ? 'mute' : 'sound', bhT(m.muted ? 'sidebar.unmute' : 'sidebar.mute'), 'mute'));
  if (m.mic) ctl.append(btn(m.micOn ? '' : 'off', m.micOn ? 'mic' : 'mic-off', bhT(m.micOn ? 'sidebar.mic_off' : 'sidebar.mic_on'), 'mic'));
  if (m.cam) ctl.append(btn(m.camOn ? '' : 'off', m.camOn ? 'video' : 'video-off', bhT(m.camOn ? 'sidebar.cam_off' : 'sidebar.cam_on'), 'cam'));
  ctl.append(
    btn('', 'pip', bhT('palette.pip'), 'pip'),
    btn('cl', 'close', bhT('sidebar.close_player'), 'close'));
  card.replaceChildren(top, ctl);
}
const UPDATE_ICONS = { ready: 'download', busy: 'spinner', error: 'alert' };
function renderUpdate(u, current) {
  const b = $('update');
  b.hidden = !u;
  if (!u) return;
  const busy = u.state === 'downloading';
  b.classList.toggle('busy', busy);
  b.classList.toggle('error', u.state === 'error');
  const ico = busy ? 'busy' : u.state === 'error' ? 'error' : 'ready';
  const icon = b.querySelector('.ico');
  if (icon.dataset.k !== ico) { icon.dataset.k = ico; icon.replaceChildren(bhIcon(UPDATE_ICONS[ico])); }
  const version = u.version;
  $('updtxt').textContent = busy ? bhT('sidebar.updating', { version })
    : u.state === 'error' ? bhT('sidebar.update_failed') : bhT('sidebar.update_to', { version });
  b.title = busy ? bhT('sidebar.update_downloading', { version })
    : u.state === 'error' ? u.error : bhT('sidebar.update_available', { version, current });
}
$('update').onclick = () => {
  const b = $('update');
  if (b.classList.contains('busy')) return;
  launchShip(b.querySelector('.ico'));
  send({ cmd: 'apply_update' });
};
// The ship leaves the button's icon spot with a flame trail and sparks (see Settings > Updates).
function launchShip(from) {
  if (!from || document.body.classList.contains('noanim') || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = from.getBoundingClientRect();
  const ship = document.createElement('div');
  ship.className = 'launch';
  ship.style.left = (r.left + r.width / 2) + 'px';
  ship.style.top = (r.top + r.height / 2) + 'px';
  ship.append(bhIcon('rocket', 'md'));
  for (let i = 0; i < 8; i++) {
    const a = Math.PI * (0.15 + 0.7 * i / 7);
    const spark = document.createElement('i');
    spark.className = 'spark';
    spark.style.setProperty('--dx', (Math.cos(a) * 26).toFixed(1) + 'px');
    spark.style.setProperty('--dy', (Math.sin(a) * 18).toFixed(1) + 'px');
    ship.append(spark);
  }
  document.body.append(ship);
  $('update').classList.add('launched');
  setTimeout(() => { ship.remove(); $('update').classList.remove('launched'); }, 1600);
}
// The privacy report of the site shown opens above the shield.
$('shield').onclick = () => { const r = $('shield').getBoundingClientRect(); send({ cmd: 'privacy_report', x: r.left, y: r.top - 8 }); };
$('new').onclick = () => send({ cmd: 'new_tab' });
function tooltips() {
  $('shield').title = bhT('sidebar.privacy_report');
  $('new').title = bhT('sidebar.new_tab_keys', { keys: bhKeys('mod+t') });
  $('gear').title = bhT('sidebar.settings_keys', { keys: bhKeys('mod+,') });
}
tooltips();
// Language changed: tooltips, then everything drawn from the state (cards drawn only on change).
let lastStats = null;
addEventListener('bhlang', () => {
  tooltips();
  tidySig = meetSig = mediaSig = '';
  if (lastStats) bh.stats(...lastStats);
  if (state && state.spaces && state.spaces.length) bh.render(state);
});
$('library').onclick = () => send({ cmd: 'open_library' });
function applyFolds(list) {
  const pinned = list.includes('pinned'), folders = list.includes('folders');
  $('pinned').classList.toggle('collapsed', pinned);
  $('folders').classList.toggle('collapsed', folders);
  $('pinhead').hidden = !$('pinned').children.length;
  $('pinfold').replaceChildren(bhIcon(pinned ? 'collapse' : 'expand', 'xs'), bhT('sidebar.quick_access'));
  $('foldfold').replaceChildren(bhIcon(folders ? 'collapse' : 'expand', 'xs'), bhT('sidebar.pinned'));
}
function toggleFold(section) {
  const list = new Set((state && state.collapsed) || []);
  const collapsed = !list.has(section);
  collapsed ? list.add(section) : list.delete(section);
  if (state) state.collapsed = [...list];
  const before = motion.snapshot();
  applyFolds([...list]);
  if (state) motion.play(before, state, state);
  send({ cmd: 'set_section_collapsed', section, collapsed });
}
$('pinfold').onclick = () => toggleFold('pinned');
$('foldfold').onclick = () => toggleFold('folders');
$('newfolder').onclick = () => { newFolderPending = true; send({ cmd: 'new_folder' }); };
$('gear').onclick = () => send({ cmd: 'open_settings' });
$('addspace').onclick = () => {
  const n = state.spaces.length;
  send({ cmd: 'new_space', name: bhT('sidebar.default_space', { n: n + 1 }), color: PALETTE[n % PALETTE.length] });
};
// Hidden sidebar: touching the left edge floats a copy over the page; leaving it slides it back.
let peeking = false;
const peek = (on) => { if (peeking !== on) { peeking = on; send({ cmd: 'peek', on }); } };
document.addEventListener('mousemove', (e) => {
  if (window.bh.role === 'flyout' || state.sidebarOpen !== false) return;
  if (e.clientX < state.sidebarWidth + 6) peek(true);
});
document.addEventListener('mouseleave', () => { if (window.bh.role === 'flyout') peek(false); });
send({ cmd: 'ready' });
</script>
