<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>BlackHole Library</title>
<style>
  /* Built on the design system's tokens (`--bh-*`, ui/theme.js) and icons (ui/icons.js), like
     Settings. The space's color comes in as --accent (see bh.render). */
  :root { --accent: #7c5cff; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bh-bg-shell); color: var(--bh-text-primary); font: var(--bh-text-body-page); user-select: none; -webkit-user-select: none; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--bh-accent); outline-offset: 2px; }
  #app { display: grid; grid-template-columns: var(--bh-size-settings-nav) minmax(0, 1fr); height: 100vh; }

  /* Rail: the sections, as in Settings. */
  nav { display: flex; flex-direction: column; gap: var(--bh-space-2); padding: var(--bh-space-14) var(--bh-space-10); overflow-y: auto;
    border-right: 1px solid var(--bh-border-hairline);
    background: radial-gradient(420px 320px at 0% 0%, var(--bh-accent-glow-soft), transparent 70%), var(--bh-fill-sunken); }
  nav .group { font: var(--bh-text-section-label); letter-spacing: .09em; text-transform: uppercase; opacity: var(--bh-opacity-section); padding: var(--bh-space-4) var(--bh-space-10) var(--bh-space-6); }
  nav button.nav { display: flex; align-items: center; gap: var(--bh-space-10); width: 100%; min-height: 34px; padding: 0 var(--bh-space-10); border: 0; border-radius: var(--bh-radius-row);
    background: transparent; text-align: left; opacity: var(--bh-opacity-idle);
    transition: background-color var(--bh-duration-hover) var(--bh-ease-standard), opacity var(--bh-duration-hover) var(--bh-ease-standard), transform var(--bh-duration-press) var(--bh-ease-press); }
  nav button.nav:hover { background: var(--bh-fill-hover); opacity: 1; }
  nav button.nav:active { transform: scale(.975); }
  nav button.nav.on { background: var(--bh-accent-wash); opacity: 1; }
  nav button.nav.on .bh-i { color: var(--bh-accent); filter: brightness(1.35); }
  nav .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { min-width: 22px; padding: 1px 7px; border-radius: var(--bh-radius-pill); background: var(--bh-fill-control); text-align: center;
    font: var(--bh-text-caption); font-weight: 600; font-variant-numeric: tabular-nums; opacity: var(--bh-opacity-soft); }
  .count:empty { display: none; }
  .count.hot { background: var(--bh-accent); color: var(--bh-text-on-accent); opacity: 1; }
  #back { margin-top: auto; }

  /* Section */
  main { overflow-y: auto; padding: var(--bh-space-28) var(--bh-space-36) var(--bh-space-56);
    transition: opacity var(--bh-duration-quick) var(--bh-ease-standard), filter var(--bh-duration-quick) var(--bh-ease-standard), transform var(--bh-duration-quick) var(--bh-ease-standard); }
  main.out { opacity: 0; filter: blur(8px); transform: scale(.97); }
  .wrap { max-width: 920px; margin: 0 auto; }
  .sh { display: flex; align-items: flex-start; gap: var(--bh-space-14); margin-bottom: var(--bh-space-18); }
  .sh .badge { flex: none; width: 40px; height: 40px; border-radius: var(--bh-radius-card); display: grid; place-items: center;
    background: var(--bh-accent-wash); box-shadow: inset 0 0 0 1px var(--bh-accent-border); }
  h1 { font: var(--bh-text-title-library); }
  .lead { font: var(--bh-text-body-small); opacity: var(--bh-opacity-muted); margin-top: var(--bh-space-2); }

  /* Tools: search, filter, clear. */
  .tools { display: flex; align-items: center; gap: var(--bh-space-8); flex-wrap: wrap; margin-bottom: var(--bh-space-16); }
  .search { position: relative; flex: 1 1 260px; display: flex; }
  .search .bh-i { position: absolute; left: 10px; top: 8px; opacity: var(--bh-opacity-muted); }
  .field { flex: 1; min-width: 0; height: 32px; padding: 0 var(--bh-space-10) 0 32px; border: 1px solid var(--bh-border-field); border-radius: var(--bh-radius-row);
    background: var(--bh-fill-field); font: var(--bh-text-body-shell); user-select: text; -webkit-user-select: text;
    transition: border-color var(--bh-duration-hover), box-shadow var(--bh-duration-hover); }
  .field::placeholder { color: var(--bh-text-placeholder); }
  .field:focus, .field:focus-visible { outline: none; border-color: var(--bh-accent); box-shadow: 0 0 0 3px var(--bh-accent-wash); }
  .seg { display: inline-flex; flex: none; padding: 2px; gap: 2px; border-radius: var(--bh-radius-row); background: var(--bh-fill-control); }
  .seg button { text-transform: capitalize; height: 28px; padding: 0 var(--bh-space-10); border: 0; border-radius: var(--bh-radius-chip-button); background: transparent; font: var(--bh-text-body-shell);
    opacity: var(--bh-opacity-secondary); transition: background-color var(--bh-duration-base) var(--bh-ease-settle), opacity var(--bh-duration-quick), color var(--bh-duration-quick); }
  .seg button:hover { opacity: 1; }
  .seg button.on { background: var(--bh-accent); color: var(--bh-text-on-accent); opacity: 1; box-shadow: var(--bh-shadow-switch-knob); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--bh-space-6); height: 32px; padding: 0 var(--bh-space-14); border: 0; border-radius: var(--bh-radius-control);
    background: var(--bh-fill-control); font: var(--bh-text-body-shell); white-space: nowrap;
    transition: background-color var(--bh-duration-hover) var(--bh-ease-standard), transform var(--bh-duration-press) var(--bh-ease-press); }
  .btn:hover { background: var(--bh-fill-control-hover); }
  .btn:active { transform: scale(.96); }
  .btn.danger { color: var(--bh-danger-text); }
  .btn.armed, .btn.armed:hover { background: var(--bh-danger-fill); color: var(--bh-white); }

  /* Lists: rows in a card, grouped by day where it helps. */
  .card { background: var(--bh-fill-card); border: 1px solid var(--bh-border-card); border-radius: var(--bh-radius-card); margin-bottom: var(--bh-space-16); overflow: hidden; }
  .card > * + * { border-top: 1px solid var(--bh-border-hairline); }
  .day { font: var(--bh-text-section-label); letter-spacing: .09em; text-transform: uppercase; opacity: var(--bh-opacity-section); padding: var(--bh-space-6) var(--bh-space-4) var(--bh-space-8); }
  .row { display: flex; align-items: center; gap: var(--bh-space-12); min-height: 52px; padding: var(--bh-space-8) var(--bh-space-12) var(--bh-space-8) var(--bh-space-16); cursor: pointer;
    transition: background-color var(--bh-duration-hover) var(--bh-ease-standard); }
  .row:hover { background: var(--bh-fill-hover); }
  .row:active { background: var(--bh-fill-pressed); }
  .row:focus-visible { outline-offset: -2px; border-radius: var(--bh-radius-control); }
  .ico { width: 32px; height: 32px; border-radius: var(--bh-radius-row); display: grid; place-items: center; flex: none; background: var(--bh-fill-control); }
  .ico.ok { background: color-mix(in srgb, var(--bh-success) 22%, transparent); color: var(--bh-success-text); }
  .ico.bad { background: var(--bh-danger-fill); color: var(--bh-white); }
  .ico.live { background: var(--bh-accent-wash); color: var(--bh-text-primary); }
  .ico.live .bh-i { animation: bh-spin 1.2s linear infinite; }
  .grow { flex: 1; min-width: 0; }
  .grow b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow i { display: block; font: var(--bh-text-host); font-style: normal; opacity: var(--bh-opacity-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .chip { display: inline-block; vertical-align: 1px; margin-left: var(--bh-space-6); padding: 0 7px; border-radius: var(--bh-radius-chip); font: var(--bh-text-caption); font-weight: 600; }
  .chip.new { background: var(--bh-accent); color: var(--bh-text-on-accent); }
  .chip.ok { background: color-mix(in srgb, var(--bh-success) 22%, transparent); color: var(--bh-success-text); }
  .chip.bad { background: var(--bh-danger-fill); color: var(--bh-white); }
  s { opacity: var(--bh-opacity-tertiary); }
  /* Row actions: shown on hover and keyboard focus. */
  .acts { display: flex; gap: var(--bh-space-2); opacity: 0; transition: opacity var(--bh-duration-hover) var(--bh-ease-standard); }
  .row:hover .acts, .row:focus-within .acts { opacity: 1; }
  .ib { width: var(--bh-size-icon-button); height: var(--bh-size-icon-button); display: grid; place-items: center; border: 0; border-radius: var(--bh-radius-control); background: transparent;
    opacity: var(--bh-opacity-secondary); transition: background-color var(--bh-duration-hover), opacity var(--bh-duration-hover), transform var(--bh-duration-press) var(--bh-ease-press); }
  .ib:hover { background: var(--bh-fill-control-hover); opacity: 1; }
  .ib:active { transform: scale(.9); }
  .ib:focus-visible { opacity: 1; }

  /* Media: tiles. */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--bh-space-12); }
  .tile { position: relative; height: 128px; border: 1px solid var(--bh-border-card); border-radius: var(--bh-radius-card); overflow: hidden; display: grid; place-items: center;
    background: var(--bh-fill-card); cursor: pointer; padding: 0;
    transition: transform var(--bh-duration-spring) var(--bh-ease-press), box-shadow var(--bh-duration-spring) var(--bh-ease-standard), border-color var(--bh-duration-hover); }
  .tile:hover { transform: translateY(-2px); box-shadow: var(--bh-shadow-tile-lift); border-color: var(--bh-border-hover); }
  .tile:active { transform: scale(.98); }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .tile > .bh-i { opacity: var(--bh-opacity-muted); }
  .tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--bh-space-16) var(--bh-space-10) var(--bh-space-6); font: var(--bh-text-caption); text-align: left;
    background: linear-gradient(transparent, var(--bh-scrim-caption)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Easels: cards with their first note. */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--bh-space-12); }
  .ec { display: flex; flex-direction: column; gap: var(--bh-space-6); height: 136px; padding: var(--bh-space-14) var(--bh-space-16); text-align: left; overflow: hidden;
    border: 1px solid var(--bh-border-card); border-radius: var(--bh-radius-card); background: var(--bh-fill-card); cursor: pointer;
    transition: transform var(--bh-duration-spring) var(--bh-ease-press), box-shadow var(--bh-duration-spring) var(--bh-ease-standard), border-color var(--bh-duration-hover); }
  .ec:hover { transform: translateY(-2px); box-shadow: var(--bh-shadow-item-hover); border-color: var(--bh-accent-border); }
  .ec:active { transform: scale(.98); }
  .ec .head { display: flex; align-items: center; gap: var(--bh-space-8); }
  .ec .head b { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ec small { font: var(--bh-text-caption); opacity: var(--bh-opacity-muted); }
  .ec p { font: var(--bh-text-body-small); opacity: var(--bh-opacity-soft); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }

  /* Spaces: one column each, the active one lit. */
  .cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--bh-space-12); align-items: start; }
  .col { border: 1px solid var(--bh-border-card); border-radius: var(--bh-radius-card); background: var(--bh-fill-card); overflow: hidden; }
  .col.on { border-color: var(--bh-accent-border); box-shadow: var(--bh-shadow-item-hover); }
  .col h3 { display: flex; align-items: center; gap: var(--bh-space-8); font: var(--bh-text-body-strong); padding: var(--bh-space-12) var(--bh-space-14); border-bottom: 1px solid var(--bh-border-hairline); }
  .col h3 .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .col .fl { display: flex; align-items: center; gap: var(--bh-space-6); font: var(--bh-text-caption); opacity: var(--bh-opacity-muted); padding: var(--bh-space-8) var(--bh-space-14) var(--bh-space-2); }
  .col .row { min-height: 36px; padding: var(--bh-space-6) var(--bh-space-14); }
  .col .row b { font-weight: 400; }

  /* Empty state: an icon in a soft circle and one sentence. */
  .empty { display: flex; flex-direction: column; align-items: center; gap: var(--bh-space-10); padding: var(--bh-space-56) var(--bh-space-16); text-align: center;
    font: var(--bh-text-body-small); color: var(--bh-text-secondary); }
  .empty .halo { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--bh-fill-faint); box-shadow: inset 0 0 0 1px var(--bh-border-hairline); }
  .empty p { max-width: 360px; }

  /* Entrance: the entries of a section rise one after another. */
  main.enter :is(.row, .tile, .ec, .col, .day, .card, .empty) { animation: rise var(--bh-duration-spring) var(--bh-ease-settle) backwards; animation-delay: calc(var(--i, 0) * 16ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.985); } }
  @keyframes bh-spin { to { transform: rotate(360deg); } }
  #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9; }
  body.noanim *, body.noanim *::before, body.noanim *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style></head><body>
<div id="app" style="opacity:0">
<nav id="rail">
  <div class="group" data-i18n="library.title">Library</div>
  <button class="nav" data-s="media"><i data-icon="image"></i><span class="nm" data-i18n="library.media">Media</span><span class="count" data-c="media"></span></button>
  <button class="nav" data-s="downloads"><i data-icon="download"></i><span class="nm" data-i18n="library.downloads">Downloads</span><span class="count" data-c="downloads"></span></button>
  <button class="nav" data-s="easels"><i data-icon="easel"></i><span class="nm" data-i18n="library.easels">Easels &amp; Notes</span><span class="count" data-c="easels"></span></button>
  <button class="nav" data-s="spaces"><i data-icon="grid"></i><span class="nm" data-i18n="library.spaces">Spaces</span><span class="count" data-c="spaces"></span></button>
  <button class="nav" data-s="history"><i data-icon="history"></i><span class="nm" data-i18n="library.history">History</span></button>
  <button class="nav" data-s="watches"><i data-icon="eye"></i><span class="nm" data-i18n="library.watches">Watched Areas</span><span class="count" data-c="watches"></span></button>
  <button class="nav" data-s="archive"><i data-icon="archive"></i><span class="nm" data-i18n="library.archive">Archived Tabs</span><span class="count" data-c="archive"></span></button>
  <button class="btn" id="back"><i data-icon="back"></i><span data-i18n="library.back">Back</span></button>
</nav>
<main id="m"></main></div>
<canvas id="fx"></canvas>
<script>
// Every text from a page, a file or a catalog goes in with textContent / attributes only.
const send = (o) => window.ipc.postMessage(JSON.stringify(o));
let S = null, sec = 'media', q = '', filter = 'all', clearArm = {};
const $ = (id) => document.getElementById(id);
const host = (u) => { try { return new URL(u).host; } catch { return u || ''; } };
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
const icon = (name, size) => bhIcon(name, size);
function iconButton(name, title, onclick) {
  const b = el('button', 'ib');
  b.type = 'button'; b.title = title; b.setAttribute('aria-label', title);
  b.append(icon(name));
  b.onclick = (e) => { e.stopPropagation(); onclick(); };
  return b;
}
// A clickable row: icon tile, title and subtitle, actions on the right.
function row(ico, title, sub, onopen, actions) {
  const r = el('div', 'row');
  r.tabIndex = 0;
  r.setAttribute('role', 'button');
  if (ico) r.append(ico);
  const g = el('div', 'grow');
  g.append(title instanceof Node ? title : el('b', null, title));
  if (sub != null) g.append(sub instanceof Node ? sub : el('i', null, sub));
  r.append(g);
  if (actions && actions.length) { const a = el('div', 'acts'); a.append(...actions); r.append(a); }
  r.onclick = onopen;
  r.onkeydown = (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target === r) { e.preventDefault(); onopen(); } };
  return r;
}
function tile(cls, iconName) { const t = el('div', 'ico' + (cls ? ' ' + cls : '')); t.append(icon(iconName)); return t; }
function empty(iconName, text) {
  const e = el('div', 'empty');
  const h = el('div', 'halo'); h.append(icon(iconName, 'md'));
  e.append(h, el('p', null, text));
  return e;
}
function ago(at, now) { const m = Math.max(0, Math.round((now - at) / 60)); return m < 1 ? bhT('time.just_now') : m < 60 ? bhT('time.min_ago', { n: m }) : m < 1440 ? bhT('time.h_ago', { n: Math.round(m / 60) }) : day(at, now); }
function day(at, now) { const d = Math.floor((now - at) / 86400); return d <= 0 ? bhT('time.today') : d == 1 ? bhT('time.yesterday') : new Date(at * 1000).toLocaleDateString(bhI18n.lang); }
const has = (t) => !q || String(t || '').toLowerCase().includes(q.toLowerCase());

const SECTIONS = {
  media: { icon: 'image', title: 'library.media' },
  downloads: { icon: 'download', title: 'library.downloads' },
  easels: { icon: 'easel', title: 'library.easels' },
  spaces: { icon: 'grid', title: 'library.spaces' },
  history: { icon: 'history', title: 'library.history' },
  watches: { icon: 'eye', title: 'library.watches' },
  archive: { icon: 'archive', title: 'library.archive' },
};
function header(lead) {
  const h = el('div', 'sh');
  const b = el('div', 'badge'); b.append(icon(SECTIONS[sec].icon, 'md'));
  const t = el('div');
  t.append(el('h1', null, bhT(SECTIONS[sec].title)));
  if (lead) t.append(el('p', 'lead', lead));
  h.append(b, t);
  return h;
}
// Search field, an optional filter (segmented) and an optional "clear" that asks twice.
function tools(placeholder, withFilter, clearKind) {
  const bar = el('div', 'tools');
  if (placeholder) {
    const s = el('label', 'search');
    const f = el('input', 'field');
    f.id = 'q'; f.type = 'search'; f.placeholder = placeholder; f.value = q;
    f.setAttribute('aria-label', placeholder);
    s.append(icon('search'), f);
    bar.append(s);
  }
  if (withFilter) {
    const seg = el('div', 'seg');
    seg.setAttribute('role', 'radiogroup');
    for (const [k, label] of [['all', 'library.filter_all'], ['completed', 'library.filter_completed'], ['failed', 'library.filter_failed']]) {
      const b = el('button', k === filter ? 'on' : '', bhT(label));
      b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(k === filter));
      b.onclick = () => { filter = k; render(); };
      seg.append(b);
    }
    bar.append(seg);
  }
  if (clearKind) {
    const armed = clearArm.kind === clearKind;
    const b = el('button', 'btn danger' + (armed ? ' armed' : ''));
    b.type = 'button'; b.append(icon('trash'), el('span', null, bhT(armed ? 'library.clear_confirm' : 'home.clear')));
    // Clearing cannot be undone: a second click within 3 s confirms.
    b.onclick = () => {
      clearTimeout(clearArm.t);
      if (armed) { clearArm = {}; render(); send({ cmd: 'library_clear', kind: clearKind }); }
      else { clearArm = { kind: clearKind, t: setTimeout(() => { clearArm = {}; render(); }, 3000) }; render(); }
    };
    bar.append(b);
  }
  return bar;
}
function byDay(list, at, make) {
  const out = [];
  let last = '', card = null;
  for (const item of list) {
    const d = day(at(item), S.now);
    if (d !== last) { out.push(el('div', 'day', d)); card = el('div', 'card'); out.push(card); last = d; }
    card.append(make(item));
  }
  return out;
}

const VIEWS = {
  media() {
    const l = S.media.filter((x) => has(x.name));
    const out = [header(bhTn('library.items', S.media.length)), tools(bhT('library.search_media'))];
    if (!l.length) return [...out, empty('image', bhT('library.empty'))];
    const g = el('div', 'grid');
    for (const x of l) {
      const t = el('button', 'tile'); t.type = 'button'; t.title = x.name;
      if (x.thumb) { const img = el('img'); img.alt = ''; img.src = x.thumb; t.append(img); }
      else t.append(icon(x.kind === 'video' ? 'play' : 'image', 'lg'));
      t.append(el('span', 'cap', x.name));
      t.onclick = () => send({ cmd: 'library_open_file', id: x.id });
      g.append(t);
    }
    return [...out, g];
  },
  downloads() {
    const l = S.downloads.filter((d) => has(d.name) && (filter === 'all' || (filter === 'completed' ? d.done && d.ok : d.done && !d.ok)));
    const out = [header(bhTn('library.items', S.downloads.length)), tools(bhT('library.search_downloads'), true, 'downloads')];
    if (!l.length) return [...out, empty('download', bhT('library.empty'))];
    const card = el('div', 'card');
    for (const d of l) {
      const state = !d.done ? 'live' : d.ok ? (d.exists ? 'ok' : '') : 'bad';
      const ico = tile(state, !d.done ? 'spinner' : d.ok ? (d.exists ? 'check' : 'download') : 'alert');
      const title = el('b', null, d.name);
      const status = !d.done ? bhT('library.downloading') : !d.ok ? bhT('library.failed') : !d.exists ? bhT('library.file_gone') : null;
      const sub = el('i', null, [host(d.url), status, d.at ? ago(d.at, S.now) : null].filter(Boolean).join(' · '));
      const del = iconButton('close', bhT('library.remove'), () => send({ cmd: 'library_delete_download', id: d.id }));
      card.append(row(ico, title, sub, () => send({ cmd: 'library_open_file', id: d.id }), [del]));
    }
    return [...out, card];
  },
  easels() {
    const out = [header(bhTn('library.items', S.easels.length))];

function counts() {
  const n = { media: S.media.length, downloads: S.downloads.length, easels: S.easels.length, spaces: S.spaces.length,
    watches: (S.watches || []).length, archive: S.archive.length };
  const live = S.downloads.filter((d) => !d.done).length, unread = (S.watches || []).filter((w) => w.unread).length;
  document.querySelectorAll('.count').forEach((c) => {
    const k = c.dataset.c;
    const v = k === 'downloads' && live ? live : k === 'watches' && unread ? unread : n[k];
    c.textContent = v ? String(v) : '';
    c.classList.toggle('hot', (k === 'downloads' && live > 0) || (k === 'watches' && unread > 0));
  });
}
function render() {

  m.replaceChildren(wrap);
  const qi = $('q'); if (qi && had) { qi.focus(); qi.setSelectionRange(q.length, q.length); }
}

const cv = $('fx'), cx = cv.getContext('2d'); let raf = 0;

// The entries of a section that just opened rise one after another.
function stagger() {
