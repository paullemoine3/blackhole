<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<style>
:root{--a:#6a8cff;--bg:#16171c;--fg:#e8e9ee;--dim:#8b8e99;--card:#22242b}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;font:13px -apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);user-select:none}
#rail{width:210px;padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--a) 14%,#101116)}
#rail button.nav{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--dim);display:flex;align-items:center;gap:10px}
#rail button.nav:hover{background:#ffffff10}
#rail button.nav.on{background:#ffffff18;color:var(--fg)}
#rail .sp{flex:1}
#back{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
#back:hover{background:#ffffff18}
main{flex:1;padding:22px 28px;overflow:auto}
h1{margin:0 0 14px;font-size:20px}
.tools{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;background:var(--card);border:0;border-radius:8px;padding:9px 12px;color:var(--fg);outline:0}
.btn{all:unset;cursor:pointer;background:var(--card);padding:8px 12px;border-radius:8px}
.btn:hover{background:#ffffff1c}
.btn.armed,.btn.armed:hover{background:#ff5a5ad9;color:#fff}
.new{font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--a);color:#fff;margin-left:6px}
s{opacity:.55}
.empty{text-align:center;color:var(--dim);margin-top:80px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;height:130px;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}
.tile img{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;bottom:0;left:0;right:0;font-size:11px;padding:4px 8px;background:#000a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer}
.row:hover{background:#ffffff0e}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t i{font-style:normal;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.x{opacity:0;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;flex:none;border-radius:6px}
.row:hover .x{opacity:1}.x:hover{background:#ffffff22}
.day{color:var(--dim);font-size:11px;text-transform:uppercase;margin:14px 0 4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:#f4f4f6;color:#222;border-radius:12px;padding:14px;height:130px;cursor:pointer;overflow:hidden}
.card b{display:block;margin-bottom:6px}.card small{color:#666}
.cols{display:flex;gap:16px;align-items:flex-start}
.col{flex:1;min-width:200px;background:var(--card);border-radius:12px;padding:12px}
.col h3{margin:0 0 8px;font-size:13px}.col.on h3{color:var(--a)}
.col .f{color:var(--dim);margin-top:6px}
main{transition:opacity .22s ease,filter .22s ease,transform .22s ease}
main.out{opacity:0;filter:blur(8px);transform:scale(.97)}
#app{display:flex;flex:1;min-width:0;height:100vh}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9}
.row,.tile,.card,.col,.btn,#rail button.nav,#back{transition:background-color .15s ease,transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s ease,color .15s ease}
.tile:hover,.card:hover{transform:translateY(-2px);box-shadow:0 12px 26px -14px #000}
.row:active,.tile:active,.card:active,.btn:active{transform:scale(.98)}
#rail button.nav.on{box-shadow:inset 3px 0 0 var(--a)}
main.enter :is(.row,.tile,.card,.col){animation:rise .32s cubic-bezier(.2,.85,.25,1.1) backwards;animation-delay:calc(var(--i,0)*16ms)}
@keyframes rise{from{opacity:0;transform:translateY(6px) scale(.98)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app" style="opacity:0"><div id="rail">
<button class="nav" data-s="media"><i data-icon="image"></i><span data-i18n="library.media">Media</span></button>
<button class="nav" data-s="downloads"><i data-icon="download"></i><span data-i18n="library.downloads">Downloads</span></button>
<button class="nav" data-s="easels"><i data-icon="easel"></i><span data-i18n="library.easels">Easels &amp; Notes</span></button>
<button class="nav" data-s="spaces"><i data-icon="grid"></i><span data-i18n="library.spaces">Spaces</span></button>
<button class="nav" data-s="history"><i data-icon="history"></i><span data-i18n="library.history">History</span></button>
<button class="nav" data-s="watches"><i data-icon="eye"></i><span data-i18n="library.watches">Watched Areas</span></button>
<button class="nav" data-s="archive"><i data-icon="archive"></i><span data-i18n="library.archive">Archived Tabs</span></button>
<div class="sp"></div>
<button id="back" data-i18n-title="library.back" data-i18n-aria="library.back"><i data-icon="back"></i></button>
</div>
<main id="m"></main></div>
<canvas id="fx"></canvas>
<script>
const send=o=>window.ipc.postMessage(JSON.stringify(o));
let S=null,sec='media',q='',filter='all',clearArm={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host=u=>{try{return new URL(u).host}catch{return u}};
// Catalog texts are inserted as HTML here, escaped like any other text.
const T=(k,p)=>esc(bhT(k,p));
function ago(at,now){const m=Math.max(0,Math.round((now-at)/60));return m<1?bhT('time.just_now'):m<60?bhT('time.min_ago',{n:m}):m<1440?bhT('time.h_ago',{n:Math.round(m/60)}):day(at,now)}
function day(at,now){const d=Math.floor((now-at)/86400);return d<=0?bhT('time.today'):d==1?bhT('time.yesterday'):new Date(at*1000).toLocaleDateString(bhI18n.lang)}
const FILTERS={all:'library.filter_all',completed:'library.filter_completed',failed:'library.filter_failed'};
const NONE=()=>`<div class="empty">${T('library.empty')}</div>`;
function render(){
 if(!S)return;
 document.documentElement.style.setProperty('--a',S.accent||'#6a8cff');
 document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.s==sec));
 const m=document.getElementById('m');const has=t=>!q||t.toLowerCase().includes(q.toLowerCase());
 let h='';
 const tools=(ph,f,clear)=>`<div class="tools"><input id="q" placeholder="${ph}" value="${esc(q)}">${f?`<button class="btn" id="flt">${T('library.filter',{filter:bhT(FILTERS[filter])})}</button>`:''}${clear?(clearArm.kind==clear?`<button class="btn armed" data-clear="${clear}">${T('library.clear_confirm')}</button>`:`<button class="btn" data-clear="${clear}">${T('home.clear')}</button>`):''}</div>`;
 if(sec=='media'){
  const l=S.media.filter(x=>has(x.name));
  h=`<h1>${T('library.media')}</h1>`+tools(T('library.search_media'))+(l.length?'<div class="grid">'+l.map(x=>`<div class="tile" data-open="${x.id}">${x.thumb?`<img src="${x.thumb}">`:bhIconHTML(x.kind=='video'?'play':'image','lg')}<span>${esc(x.name)}</span></div>`).join('')+'</div>':NONE());
 }else if(sec=='downloads'){
  const l=S.downloads.filter(d=>has(d.name)&&(filter=='all'||(filter=='completed'?d.done&&d.ok:d.done&&!d.ok)));
  h=`<h1>${T('library.downloads')}</h1>`+tools(T('library.search_downloads'),1,'downloads')+(l.length?l.map(d=>`<div class="row" data-open="${d.id}"><div class="t"><b>${esc(d.name)}</b><i>${d.done?(d.ok?(d.exists?esc(host(d.url)):T('library.file_gone')):T('library.failed')):T('library.downloading')}</i></div><span class="x" data-del="${d.id}">${bhIconHTML('close','xs')}</span></div>`).join(''):NONE());
 }else if(sec=='easels'){
  h=`<h1>${T('library.easels')}</h1>`+(S.easels.length?'<div class="cards">'+S.easels.map(e=>`<div class="card" data-easel="${e.id}"><b>${esc(e.name)}</b><small>${esc(bhTn('library.items',e.count))}</small><div>${esc(e.preview)}</div></div>`).join('')+'</div>':NONE());
 }else if(sec=='spaces'){
  h=`<h1>${T('library.spaces')}</h1><div class="cols">`+S.spaces.map(s=>`<div class="col${s.active?' on':''}"><h3>${esc(s.icon)} ${esc(s.name)}</h3>${s.folders.map(f=>`<div class="f">${bhIconHTML('folder','xs')} ${esc(f.name)}</div>`+s.tabs.filter(t=>t.folder==f.id).map(t=>tabRow(s,t)).join('')).join('')}${s.tabs.filter(t=>t.folder==null).map(t=>tabRow(s,t)).join('')}</div>`).join('')+'</div>';
 }else if(sec=='history'){
  const l=(S.history||[]).filter(a=>has(a.title+a.url));
  h=`<h1>${T('library.history')}</h1>`+tools(T('library.search_history'),0,'history')+(l.length?'':NONE());
  let last='';for(const a of l.slice(0,400)){const d=day(a.at,S.now);if(d!=last){h+=`<div class="day">${esc(d)}</div>`;last=d}
   h+=`<div class="row" data-visit="${esc(a.url)}"><div class="t"><b>${esc(a.title||a.url)}</b><i>${esc(a.url)}</i></div><span class="x" data-forget="${esc(a.url)}">${bhIconHTML('close','xs')}</span></div>`}
 }else if(sec=='watches'){
  // Areas of pages read again every half hour; a change shows the value before and after.
  const l=(S.watches||[]).filter(w=>has(w.title+w.url+w.value));
  h=`<h1>${T('library.watches')}</h1>`+tools(T('library.search_watches'))+(l.length?l.map(w=>`<div class="row" data-visit="${esc(w.url)}"><div class="t"><b>${esc(w.title||host(w.url))}${w.unread?` <span class="new">${T('library.changed')}</span>`:''}</b><i>${w.previous?`<s>${esc(w.previous)}</s> → `:''}${w.value?esc(w.value):T('library.reading')} · ${esc(host(w.url))}${w.checked>0?' · '+T('library.checked',{when:ago(w.checked,S.now)}):''}</i></div><span class="x" data-wcheck="${w.id}" title="${T('library.check_now')}">⟳</span><span class="x" data-wdel="${w.id}" title="${T('library.stop_watching')}">${bhIconHTML('close','xs')}</span></div>`).join(''):`<div class="empty">${T('library.watches_empty')}</div>`);
  if(l.some(w=>w.unread))setTimeout(()=>send({cmd:'watches_seen'}),1500);
 }else{
  const l=S.archive.filter(a=>has(a.title+a.url));
  h=`<h1>${T('library.archive')}</h1>`+tools(T('library.search_archive'),0,'archive')+(l.length?'':NONE());
  let last='';for(const a of l){const d=day(a.at,S.now);if(d!=last){h+=`<div class="day">${esc(d)}</div>`;last=d}
   h+=`<div class="row" data-reopen="${a.index}"><div class="t"><b>${esc(a.title||a.url)}</b><i>${esc(a.url)}</i></div><span class="x" data-delarch="${a.index}">${bhIconHTML('close','xs')}</span></div>`}
 }
 const had=document.activeElement&&document.activeElement.id=='q';
 m.innerHTML=h;
 const qi=document.getElementById('q');if(qi&&had){qi.focus();qi.setSelectionRange(q.length,q.length)}
}
function tabRow(s,t){return `<div class="row" data-tab="${t.id}" data-space="${s.id}"><div class="t"><b>${esc(t.title||t.url)}</b></div></div>`}
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let raf=0;
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Particles are pulled into a black hole (accretion ring included) then the hole closes.
function fx(full){
 if(calm)return;
 cancelAnimationFrame(raf);
 const dpr=devicePixelRatio||1,W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
 const box=full?{x:0,y:0,w:W,h:H}:document.getElementById('m').getBoundingClientRect();
 const ox=box.x+box.w/2,oy=box.y+box.h/2,n=full?320:70,dur=full?1100:420;
 const col=getComputedStyle(document.documentElement).getPropertyValue('--a')||'#6a8cff';
 const P=Array.from({length:n},()=>{const a=Math.random()*6.283,d=Math.random()**.6*Math.hypot(box.w,box.h)/2*(full?1:.8);
  return{a,d,s:.4+Math.random()*.6,z:1+Math.random()*2.2,l:Math.random()*.35}});
 const t0=performance.now();
 (function step(now){
  const t=Math.min(1,(now-t0)/dur);cx.clearRect(0,0,W,H);
  const hole=(full?46:18)*Math.sin(Math.min(1,t*1.6)*Math.PI*(t>.6?.5:.5))*(t>.8?1-(t-.8)/.2:1);
  for(const p of P){
   const k=Math.max(0,Math.min(1,(t-p.l)/(1-p.l)));const e=k*k*(3-2*k);
   const r=p.d*(1-e),a=p.a+e*(full?7:4)*p.s;
   const x=ox+Math.cos(a)*r,y=oy+Math.sin(a)*r*(full?1:.8);
   cx.globalAlpha=(1-e*.9)*.9;cx.fillStyle=e>.7?'#ffb35a':col;cx.fillRect(x,y,p.z*(1-e*.6),p.z*(1-e*.6));
  }
  cx.globalAlpha=1;
  if(hole>0){const g=cx.createRadialGradient(ox,oy,hole*.6,ox,oy,hole*1.9);g.addColorStop(0,'#ff9a3c');g.addColorStop(.5,'#ff9a3c55');g.addColorStop(1,'#0000');
   cx.fillStyle=g;cx.beginPath();cx.arc(ox,oy,hole*1.9,0,6.283);cx.fill();cx.fillStyle='#000';cx.beginPath();cx.arc(ox,oy,hole*.8,0,6.283);cx.fill()}
  if(t<1)raf=requestAnimationFrame(step);else cx.clearRect(0,0,W,H);
 })(t0);
}
// Opening: a plain fade.
function intro(){
 render();stagger();
 const app=document.getElementById('app');
 app.style.clipPath='';
 if(calm){app.style.opacity='';return}
 app.style.transition='none';app.style.opacity='0';
 void app.offsetWidth;
 app.style.transition='opacity .25s ease';
 app.style.opacity='1';
}
const full_delay=0;
function go(s){if(s==sec)return;const m=document.getElementById('m');m.classList.add('out');fx(false);setTimeout(()=>{sec=s;q='';render();stagger();m.classList.remove('out')},200)}
// The entries of a section that just opened rise one after another.
function stagger(){if(calm)return;const m=document.getElementById('m');m.querySelectorAll('.row,.tile,.card,.col').forEach((n,i)=>n.style.setProperty('--i',Math.min(i,24)));m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter');clearTimeout(stagger.t);stagger.t=setTimeout(()=>m.classList.remove('enter'),900)}
document.getElementById('rail').onclick=e=>{const b=e.target.closest('.nav');if(b)go(b.dataset.s)};
document.getElementById('back').onclick=()=>send({cmd:'close_library'});
addEventListener('bhlang',()=>render());
document.addEventListener('keydown',e=>{if(e.key=='Escape')send({cmd:'close_library'})});
document.getElementById('m').addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;render()}});
document.getElementById('m').addEventListener('click',e=>{
 const t=e.target,c=a=>t.closest('['+a+']');
 let n;
 if(t.id=='flt'){filter={all:'completed',completed:'failed',failed:'all'}[filter];render();return}
 // Clearing cannot be undone: a second click within 3 s confirms (the list may re-render between).
 if((n=c('data-clear'))){const k=n.dataset.clear;clearTimeout(clearArm.t);if(clearArm.kind==k){clearArm={};render();send({cmd:'library_clear',kind:k})}else{clearArm={kind:k,t:setTimeout(()=>{clearArm={};render()},3000)};render()}return}
 if((n=c('data-del'))){e.stopPropagation();send({cmd:'library_delete_download',id:+n.dataset.del});return}
 if((n=c('data-wcheck'))){e.stopPropagation();send({cmd:'watch_check',id:+n.dataset.wcheck});return}
 if((n=c('data-wdel'))){e.stopPropagation();send({cmd:'watch_remove',id:+n.dataset.wdel});return}
 if((n=c('data-forget'))){e.stopPropagation();send({cmd:'forget_history',url:n.dataset.forget});return}
 if((n=c('data-visit'))){send({cmd:'open',input:n.dataset.visit});return}
 if((n=c('data-delarch'))){send({cmd:'delete_archived',index:+n.dataset.delarch});return}
 if((n=c('data-open'))){send({cmd:'library_open_file',id:+n.dataset.open});return}
 if((n=c('data-easel'))){send({cmd:'open_easel_tab',id:+n.dataset.easel});return}
 if((n=c('data-reopen'))){send({cmd:'reopen_archived',index:+n.dataset.reopen});return}
 if((n=c('data-tab'))){send({cmd:'library_open_tab',space:+n.dataset.space,id:+n.dataset.tab})}
});
// `jump` [n, section]: the command bar asked for a section; applied once per request number.
let jumped=0;
window.bh={render:s=>{if(!s.history&&S)s.history=S.history;S=s;if(s.jump&&s.jump[0]>jumped){jumped=s.jump[0];if(s.jump[1])sec=s.jump[1],q=''}render()},intro,prep:()=>{if(!calm){const a=document.getElementById('app');a.style.transition='none';a.style.opacity='0'}}};
render();
send({cmd:'library_ready'});
</script></body></html>
