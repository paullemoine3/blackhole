<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --accent: #7c5cff; --glow: rgba(124,92,255,.35); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; color: #eceaf5; user-select: none; -webkit-user-select: none; background: #100f17; }
  body { background: radial-gradient(700px 500px at 0% 0%, var(--glow), transparent 70%), var(--tint, #100f17); }
  .bar { height: 100%; display: flex; align-items: center; gap: 4px; padding: 0 12px; }
  body.macos .bar { padding-left: 84px; }
  button { font: inherit; line-height: 1; padding: 0; color: inherit; border: 0; background: transparent; cursor: pointer; border-radius: 8px; width: 28px; height: 28px; display: grid; place-items: center; opacity: .75; flex: none; }
  button:disabled { opacity: .25; cursor: default; }
  button:disabled:hover { background: transparent; opacity: .25; }
  button:hover { background: rgba(255,255,255,.1); opacity: 1; }
  .side { flex: 1; display: flex; min-width: 0; }
  .right { justify-content: flex-end; gap: 2px; }
  .ext { position: relative; width: 28px; height: 28px; }
  .ext img { width: 18px; height: 18px; border-radius: 4px; }
  .ext .badge { position: absolute; right: 0; bottom: 1px; min-width: 14px; padding: 0 3px; border-radius: 7px; background: var(--accent); color: #fff; font-size: 9px; line-height: 14px; font-weight: 700; }
  .center { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); width: min(640px, 46vw); min-width: 180px; }
  .lock { position: absolute; left: 12px; top: 9px; opacity: .55; pointer-events: none; }
  #omni { width: 100%; height: 30px; padding: 0 14px; border-radius: 10px; color: inherit; font: inherit; text-align: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); opacity: 1; display: block; transition: background .15s; }
  #omni:hover { background: rgba(255,255,255,.14); }
  #url { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #url.ph { color: rgba(236,234,245,.5); }
  #zoom { position: absolute; right: 8px; top: 3px; width: auto; height: 24px; padding: 0 9px; border-radius: 7px; gap: 6px; font-size: 12px; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.14); opacity: 1; display: flex; align-items: center; }
  #zoom[hidden] { display: none; }
  #zoom:hover { background: rgba(255,255,255,.24); }
  #progress { position: fixed; left: var(--cl, 8px); right: 8px; bottom: 0; height: 3px; pointer-events: none; overflow: hidden; border-radius: 3px 3px 0 0; opacity: 0; transition: opacity .25s ease .15s; }
  #progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #ffb020); box-shadow: 0 0 8px var(--accent); }
  #progress.on { opacity: 1; transition: none; }
  #progress.on i { width: 85%; transition: width 12s cubic-bezier(.1,.7,.2,1); }
  #progress.done i { width: 100%; transition: width .2s ease-out; }
  #zoom .x { opacity: .6; }
  body.secure #omni { padding-left: 30px; padding-right: 30px; }
  body.secure .lock { display: block; }
  .lock { display: none; }
  #insecure { position: absolute; left: 6px; top: 5px; height: 20px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; line-height: 20px;
    color: #ffb3bd; background: rgba(220,40,70,.22); border: 1px solid rgba(255,96,110,.4); pointer-events: none; white-space: nowrap; }
  #insecure[hidden] { display: none; }
  body.insecure #omni { padding-left: 108px; }
  .priv { flex: none; align-self: center; margin-left: 8px; margin-right: 0; padding: 3px 10px; border-radius: 999px; font-size: 12px; background: rgba(255,255,255,.14); }
  .priv[hidden] { display: none; }
  .win { display: none; flex: none; align-self: stretch; margin-right: -12px; margin-left: 6px; }
  body.windows .win { display: flex; }
  .win button { width: 46px; height: 100%; border-radius: 0; opacity: .8; }
  .win button:hover { background: rgba(255,255,255,.12); opacity: 1; }
  .win button.close:hover { background: #e81123; color: #fff; }
  .win svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; }
  #wmax .restore, body.maxed #wmax .square { display: none; }
  body.maxed #wmax .restore { display: block; }
  /* Motion: buttons give under the pointer, the address slides in when it changes, the
     loading bar shimmers and the reload arrow turns. All of it stops with animations off. */
  button { transition: background-color .15s ease, opacity .15s ease, transform .16s cubic-bezier(.3,1.5,.5,1); }
  button:active:not(:disabled) { transform: scale(.88); }
  #omni:active { transform: scale(.985); }
  .win button:active:not(:disabled) { transform: none; }
  #omni { transition: background-color .15s ease, border-color .25s ease, box-shadow .25s ease, transform .16s ease; }
  #omni:hover { border-color: rgba(255,255,255,.18); box-shadow: 0 0 0 3px rgba(255,255,255,.04), 0 6px 18px -10px var(--glow); }
  #progress i { position: relative; overflow: hidden; }
  #progress.on i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); animation: shimmer 1.2s ease-in-out infinite; }
  @keyframes shimmer { to { transform: translateX(100%); } }
  #reload.spin { animation: spin .5s cubic-bezier(.3,.9,.4,1); }
  @keyframes spin { from { transform: rotate(-200deg); } }
  #zoom:not([hidden]) { animation: pop .25s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  .ext { animation: pop .25s cubic-bezier(.2,1.4,.4,1) backwards; }
  body.noanim *, body.noanim *::before, body.noanim *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="side">
    <button id="sidebar"><i data-icon="sidebar"></i></button>
    <button id="back"><i data-icon="back"></i></button>
    <button id="forward"><i data-icon="forward"></i></button>
    <button id="reload"><i data-icon="reload"></i></button>
    <button id="home" data-i18n-title="bar.start_page"><i data-icon="home"></i></button>
  </div>
  <div class="center">
    <i data-icon="lock" data-size="xs" class="lock"></i>
    <button id="omni" type="button"><span id="url"></span></button>
    <span id="insecure" hidden data-i18n-title="bar.insecure_hint" data-i18n="bar.insecure">Not secure</span>
    <button id="zoom" type="button" hidden><i data-icon="search" data-size="xs"></i><span id="zoomn"></span><i data-icon="close" data-size="xs" class="x"></i></button>
  </div>
  <div class="side right" id="exts"></div>
  <span class="priv" id="priv" hidden data-i18n="bar.private">Private</span>
  <div id="progress"><i></i></div>
  <div class="win">
    <button id="wmin" data-i18n-title="window.minimize"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
    <button id="wmax" data-i18n-title="window.maximize"><svg class="square" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg><svg class="restore" viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5v-2h7v7h-2"/></svg></button>
    <button id="wclose" class="close" data-i18n-title="window.close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const send = (m) => window.ipc.postMessage(JSON.stringify(m));
let current = '';
const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};
const pretty = (url) => {
  try { const u = new URL(url); return u.host.replace(/^www\./, '') + (u.pathname.length > 1 ? u.pathname : ''); } catch (_) { return url; }
};

// Tooltips spell their shortcuts the way the system does (see ui/keys.js).
const either = (a, b) => bhMac ? bhKeys(a) : bhT('keys.either', { a: bhKeys(a), b: bhKeys(b) });
function tooltips() {
  $('sidebar').title = bhT('bar.toggle_sidebar', { keys: bhKeys('mod+b') });
  $('back').title = bhT('bar.back', { keys: either('mod+[', 'alt+left') });
  $('forward').title = bhT('bar.forward', { keys: either('mod+]', 'alt+right') });
  $('reload').title = bhMac ? bhT('bar.reload') : bhT('bar.reload_keys', { keys: 'F5' });
  $('zoom').title = bhT('bar.reset_zoom', { keys: bhKeys('mod+0') });
}
tooltips();
let last = null;
addEventListener('bhlang', () => { tooltips(); if (last) { $('url').textContent = ''; bh.render(last); } });

let loadingNow = false;
function progress(on) {
  if (on === loadingNow) return;
  loadingNow = on;
  const p = $('progress');
  if (on) {
    p.classList.remove('done', 'on');
    void p.offsetWidth;
    p.classList.add('on');
  } else {
    p.classList.add('done');
    p.classList.remove('on');
    setTimeout(() => { if (!loadingNow) p.classList.remove('done'); }, 450);
  }
}

window.bh = {
  render(s) {
    last = s;
    progress(!!s.loading);
    const root = document.documentElement.style;
    root.setProperty('--accent', s.color);
    root.setProperty('--glow', rgba(s.color, .5));
    root.setProperty('--tint', mix(s.color, .3));
    document.body.classList.toggle('macos', s.os === 'macos');
    document.body.classList.toggle('windows', s.os === 'windows');
    document.body.classList.toggle('maxed', !!s.maximized);
    $('back').disabled = !s.canBack;
    $('forward').disabled = !s.canForward;
    $('priv').hidden = !s.private;
    const zoom = s.zoom || 100;
    $('zoom').hidden = zoom === 100;
    $('zoomn').textContent = zoom + '%';
    document.body.classList.toggle('secure', s.url.startsWith('https:') && !s.insecure);
    document.body.classList.toggle('insecure', !!s.insecure);
    $('insecure').hidden = !s.insecure;
    document.body.classList.toggle('noanim', s.animations === false);
    const text = s.url ? pretty(s.url) : bhT('bar.search_with', { engine: s.engine });
    if ($('url').textContent !== text) {
      $('url').textContent = text;
      if (s.animations !== false && $('url').animate) {
        $('url').animate([{ opacity: 0, transform: 'translateY(4px)', filter: 'blur(2px)' }, { opacity: 1, transform: 'none', filter: 'none' }], { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)' });
      }
    }
    $('url').classList.toggle('ph', !s.url);
    // Extension buttons only pop in the first time they appear.
    const known = new Set([...$('exts').children].map(b => b.title));
    $('exts').replaceChildren(...(s.extensions || []).map(e => {
      const b = document.createElement('button');
      b.className = 'ext'; b.title = e.label;
      if (known.has(e.label)) b.style.animation = 'none';
      if (e.icon) { const i = document.createElement('img'); i.src = e.icon; b.append(i); } else b.textContent = (e.label[0] || '•').toUpperCase();
      if (e.badge) { const g = document.createElement('span'); g.className = 'badge'; g.textContent = e.badge; b.append(g); }
      b.onclick = () => { const r = b.getBoundingClientRect(); send({ cmd: 'ext_action', id: e.id, x: r.left, y: r.top, w: r.width, h: r.height }); };
      return b;
    }));
  },
};
const mix = (hex, r) => {
  const n = parseInt(hex.slice(1), 16), b = [16, 15, 23];
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map((c, i) => Math.round(b[i] + (c - b[i]) * r).toString(16).padStart(2, '0')).join('');
};
$('omni').onclick = () => send({ cmd: 'palette', mode: 'url' });
$('zoom').onclick = () => send({ cmd: 'shortcut', key: 'zoom_reset' });
$('sidebar').onclick = () => send({ cmd: 'lock' });
$('back').onclick = () => send({ cmd: 'back' });
$('forward').onclick = () => send({ cmd: 'forward' });
$('reload').onclick = () => {
  const r = $('reload');
  r.classList.remove('spin'); void r.offsetWidth; r.classList.add('spin');
  send({ cmd: 'reload' });
};
$('home').onclick = () => send({ cmd: 'home' });
$('wmin').onclick = () => send({ cmd: 'window_minimize' });
$('wmax').onclick = () => send({ cmd: 'window_maximize' });
$('wclose').onclick = () => send({ cmd: 'window_close' });
document.addEventListener('dblclick', (e) => {
  if (e.button === 0 && !e.target.closest('button, input')) send({ cmd: 'window_maximize' });
});
document.addEventListener('mousedown', (e) => {
  if (e.button === 0 && !e.target.closest('button, input')) send({ cmd: 'drag_window' });
});
send({ cmd: 'ready' });
</script>
</body>
</html>
