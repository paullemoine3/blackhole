<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BlackHole</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html { background: #0c0b12; }
  html, body { height: 100%; background: #0c0b12; color: #eceaf5; font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { overflow-y: auto; background: radial-gradient(800px 500px at 50% -10%, rgba(124,92,255,.22), transparent 70%), #0c0b12; }
  main { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 56px 28px 40px; }
  /* Sky, as on the project's site (docs/index.html): stars drawn once on a canvas, which drifts a
     little with the scroll and the pointer (transform only). Still without animations. */
  #sky { position: fixed; left: -3vw; top: -6vh; width: 106vw; height: 116vh; z-index: 0; pointer-events: none; opacity: .9;
    transform: translate3d(var(--px, 0px), calc(var(--sy, 0) * -.06px + var(--py, 0px)), 0); transition: transform .8s cubic-bezier(.2,.7,.2,1); }
  body.noanim #sky { transform: none; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 26px; }
  /* The black hole is quiet at rest: only its ring turns. Under the pointer the disc swells, a
     second ring races and the stars around it are swallowed. Same logo as the Android start page
     (mobile.html) and as the launch splash, which lands on it. */
  .logo { position: relative; width: 1em; height: 1em; font-size: 46px; flex: none; }
  .logo i, #splash i { position: absolute; border-radius: 50%; }
  .logo .glow, #splash .glow { inset: -45%; opacity: .55; background: radial-gradient(circle, rgba(255,120,40,.3), rgba(124,92,255,.16) 45%, transparent 70%); }
  .logo .disc, #splash .disc { inset: 0; background: radial-gradient(circle, #000 0 34%, rgba(255,170,60,.95) 38%, rgba(255,90,40,.5) 52%, rgba(124,92,255,.3) 64%, transparent 76%); }
  .logo .ring, #splash .ring { inset: -11%; border: 2px solid transparent; border-top-color: rgba(255,205,120,.9); border-right-color: rgba(124,92,255,.8); }
  /* Two paces: these slow ones bring the logo back to rest, the quick ones further down start the reaction. */
  .logo .glow { transition: opacity 1s ease, transform 1s cubic-bezier(.2,.7,.2,1); }
  .logo .disc { transition: transform 1s cubic-bezier(.2,.7,.2,1); }
  .logo .ring { animation: orbit 9s linear infinite; }
  .logo .fast { inset: -22%; border-top-color: #fff; border-right-color: rgba(255,205,120,.9); opacity: 0; transition: opacity .9s ease; animation: orbit 1.1s linear infinite paused; }
  .logo .mote { left: 50%; top: 50%; width: 2px; height: 2px; margin: -1px; background: #fff; box-shadow: 0 0 6px 1px rgba(190,170,255,.9); opacity: .8;
    transform: rotate(var(--a)) translateX(var(--r));
    transition: transform 1.5s cubic-bezier(.2,.7,.2,1) calc(var(--k) * 70ms), opacity 1.2s ease-out calc(.15s + var(--k) * 70ms);
    animation: mote-in 1.1s cubic-bezier(.2,.7,.2,1) calc(var(--k) * 80ms) backwards; }
  .mote:nth-last-child(6) { --k: 0; --a: 20deg; --r: .72em; } .mote:nth-last-child(5) { --k: 1; --a: 75deg; --r: .82em; } .mote:nth-last-child(4) { --k: 2; --a: 140deg; --r: .92em; }
  .mote:nth-last-child(3) { --k: 3; --a: 200deg; --r: .72em; } .mote:nth-last-child(2) { --k: 4; --a: 255deg; --r: .82em; } .mote:nth-last-child(1) { --k: 5; --a: 320deg; --r: .92em; }
  @media (prefers-reduced-motion: no-preference) {
    body:not(.noanim) .brand:hover .glow { opacity: 1; transform: scale(1.15); transition: opacity .4s ease, transform .5s cubic-bezier(.3,1.4,.5,1); }
    body:not(.noanim) .brand:hover .disc { transform: scale(1.12); transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
    body:not(.noanim) .brand:active .disc { transform: scale(.92); }
    body:not(.noanim) .brand:hover .fast { opacity: 1; animation-play-state: running; transition: opacity .3s ease; }
    body:not(.noanim) .brand:hover .mote { opacity: 0; transform: rotate(calc(var(--a) + 150deg)) translateX(.2em) scale(.3); transition: transform .7s cubic-bezier(.5,0,.8,.6), opacity .7s ease-in; }
  }
  @keyframes orbit { to { transform: rotate(360deg); } }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
  .card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); border-radius: 16px; padding: 18px; margin-bottom: 18px; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; opacity: .5; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .card h2 button { font: inherit; text-transform: none; letter-spacing: 0; color: inherit; opacity: .8; background: transparent; border: 0; cursor: pointer; border-radius: 6px; padding: 2px 6px; }
  .card h2 button:hover { background: rgba(255,255,255,.1); }
  /* Watched areas: read again on demand, the whole section or one row; the icon turns meanwhile. */
  .card h2 .acts { display: inline-flex; align-items: center; gap: 2px; }
  .card h2 .checkall { display: inline-grid; place-items: center; padding: 3px; }
  /* The section's button turns once per click; the rows being read shimmer behind their content,
     a band of the space's colour sweeping across the card (still tint when animations are off). */
  .card h2 .checkall.spun svg { animation: spin-once .6s cubic-bezier(.3,1.3,.5,1); }
  @keyframes spin-once { to { transform: rotate(360deg); } }
  .card h2 .checkall:disabled { cursor: default; opacity: .4; }
  .item.checking { isolation: isolate; overflow: hidden; border-color: color-mix(in srgb, var(--accent, #7c5cff) 35%, transparent); }
  .item.checking::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--accent, #7c5cff) 26%, transparent) 50%, transparent 80%);
    background-size: 220% 100%; animation: watch-shimmer 1.6s ease-in-out var(--sh, 0ms) infinite; }
  @keyframes watch-shimmer { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  body.noanim .item.checking::before { animation: none; background: color-mix(in srgb, var(--accent, #7c5cff) 12%, transparent); }
  @media (prefers-reduced-motion: reduce) { .item.checking::before { background: color-mix(in srgb, var(--accent, #7c5cff) 12%, transparent); } }
  .meta .s .missing { color: #ff9f6b; }
  .customize { display: flex; justify-content: center; }
  #customize { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: inherit; opacity: .55; background: transparent; border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #customize:hover, #customize:focus-visible { opacity: .9; background: rgba(255,255,255,.08); }
  .card h2 button.armed, .card h2 button.armed:hover { background: rgba(255,90,90,.9); color: #fff; opacity: 1; }
  #favorites.linkover { outline: 1px dashed var(--accent); outline-offset: 4px; }
  .fav.lifted { z-index: 2; transition: none !important; background: rgba(255,255,255,.12); box-shadow: 0 14px 30px -12px rgba(0,0,0,.7); cursor: grabbing; }
  .fav.arrive { animation: fav-arrive .62s cubic-bezier(.2,.9,.3,1.2) both; }
  .fav.arrive .tile { animation: fav-ring .9s ease-out .12s both; }
  @keyframes fav-arrive { from { opacity: 0; transform: scale(.3) rotate(-14deg); } 60% { opacity: 1; } }
  @keyframes fav-ring { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent, #7c5cff) 70%, transparent), 0 0 18px color-mix(in srgb, var(--accent, #7c5cff) 60%, transparent); } to { box-shadow: 0 0 0 16px transparent, 0 0 0 transparent; } }
  body.noanim .fav.arrive, body.noanim .fav.arrive .tile { animation: none; }
  @media (prefers-reduced-motion: reduce) { .fav.arrive, .fav.arrive .tile { animation: none; } }
  #favs { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  .fav { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 10px; border-radius: 12px; cursor: pointer; min-width: 0; }
  .fav, .item { position: relative; }
  .more { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border: 0; border-radius: 7px; background: transparent; color: inherit; display: grid; place-items: center; padding: 0; cursor: pointer; opacity: 0; transition: opacity .12s; }
  .fav:hover .more, .item:hover .more, .fav:focus-within .more, .item:focus-within .more { opacity: .7; } .more:hover, .more:focus-visible { background: rgba(255,255,255,.14); opacity: 1 !important; }
  /* Keyboard: tiles and rows are reached with Tab and show where the focus is. */
  .fav:focus-visible, .item:focus-visible, .more:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fav:focus-visible { background: rgba(255,255,255,.09); }
  .fav:hover, .item:hover { background: rgba(255,255,255,.09); }
  .tile img { width: 100%; height: 100%; object-fit: contain; border-radius: inherit; }
  .tile.ico { background: rgba(255,255,255,.1) !important; padding: 7px; box-sizing: border-box; }
  .tile { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; font-weight: 700; color: #fff; }
  .fav .name { font-size: 12px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer; min-width: 0; border: 1px solid rgba(255,255,255,.06); }
  .item .tile { width: 36px; height: 36px; border-radius: 10px; font-size: 15px; flex: none; }
  .meta { min-width: 0; flex: 1; }
  .meta .t, .meta .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .s { font-size: 12px; opacity: .5; }
  .empty { opacity: .5; font-size: 13px; }
  .news { background: linear-gradient(135deg, rgba(124,92,255,.22), rgba(255,255,255,.04)); border-color: rgba(124,92,255,.45); }
  .news[hidden] { display: none; }
  /* Now: the next meeting, the areas that changed, the tab sent from another device. */
  .now[hidden] { display: none; }
  #nowlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  /* Watched areas and downloads: one card a line, spaced like the other sections' cards. */
  #watchlist, #dllist { display: flex; flex-direction: column; gap: 10px; }
  .item.live { border-color: rgba(124,92,255,.45); background: rgba(124,92,255,.1); }
  .tile.glyph { background: rgba(124,92,255,.28) !important; color: #e6defe; }
  .news h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .news ul { margin: 0 0 12px 18px; padding: 0; }
  .news li { margin: 3px 0; }
  .news .ver + .ver { margin-top: 14px; }
  .news button { font: inherit; color: #fff; background: rgba(124,92,255,.85); border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  .news button:hover { background: rgb(124,92,255); }
  /* Launch splash: the stars fall to a point, a flash, the hole is born, the name comes letter by
     letter; then the backdrop fades and the hole lands on the page's logo (--lx, --ly, --ls are
     measured by splash()). Only transform and opacity move. */
  #splash { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; overflow: hidden; }
  body.splashing #splash { display: grid; }
  body.splashing .logo { visibility: hidden; }
  body.splashing .logo .ring, body.splashing .logo .mote { animation: none; }
  #splash .bgd { inset: 0; border-radius: 0; background: radial-gradient(900px 600px at 50% 45%, rgba(124,92,255,.28), transparent 70%), #07060c; }
  #splash .core { position: relative; width: 150px; height: 150px; }
  #splash .flash { inset: 0; background: radial-gradient(circle, #fff, #ffcd78 30%, transparent 68%); animation: flash .4s ease-out .55s both; }
  #splash .shock { inset: 0; border: 1.5px solid rgba(255,205,120,.9); animation: shock .7s cubic-bezier(.2,.85,.25,1) .6s both; }
  #splash .glow { animation: born .5s ease-out .6s both; }
  #splash .disc { animation: born .5s cubic-bezier(.2,1.3,.4,1) .6s both; }
  #splash .ring { border-width: 4px; animation: ring-in .9s cubic-bezier(.2,.85,.25,1) .65s both; }
  #splash .star { left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px; background: #fff; box-shadow: 0 0 6px 1px rgba(190,170,255,.9); opacity: 0;
    animation: fall var(--d) cubic-bezier(.5,0,.8,.6) var(--delay) both; }
  #splash .word { position: absolute; top: calc(50% + 120px); width: 100%; text-align: center; font-size: 22px; font-weight: 600;
    letter-spacing: .6em; text-indent: .6em; text-transform: uppercase; color: #eceaf5; opacity: .85; }
  #splash .word span { display: inline-block; animation: letter .35s cubic-bezier(.2,.85,.25,1) calc(.8s + var(--i) * 35ms) both; }
  #splash.land .bgd { animation: fade-out .45s ease-out both; }
  #splash.land .word { animation: fade-out .25s ease-out both; }
  #splash.land .core { animation: land .5s cubic-bezier(.2,.85,.25,1) both; }
  @keyframes fall { 0% { opacity: 0; transform: rotate(var(--a)) translateX(var(--r)) scale(1); } 15% { opacity: 1; } 100% { opacity: 0; transform: rotate(calc(var(--a) + 180deg)) translateX(30px) scale(.2); } }
  @keyframes flash { 0% { opacity: 0; transform: scale(.1); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.8); } }
  @keyframes shock { 0% { opacity: 0; transform: scale(.2); } 12% { opacity: .9; } 100% { opacity: 0; transform: scale(2.4); } }
  @keyframes born { from { opacity: 0; transform: scale(.2); } }
  @keyframes ring-in { from { opacity: 0; transform: rotate(-360deg) scale(.5); } }
  @keyframes letter { from { opacity: 0; transform: translateY(6px) scale(.8); } }
  @keyframes fade-out { to { opacity: 0; } }
  @keyframes mote-in { from { opacity: 0; transform: rotate(calc(var(--a) - 70deg)) translateX(.3em) scale(.3); } }
  @keyframes land { to { transform: translate(var(--lx), var(--ly)) scale(var(--ls)); } }
  /* Loading screen of a new tab */
  #wait { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(800px 500px at 50% 40%, rgba(124,92,255,.2), transparent 70%), #0c0b12; animation: wait-in .18s ease-out both; }
  body.waiting #wait { display: flex; }
  #wait .tile { width: 64px; height: 64px; border-radius: 18px; font-size: 28px; animation: wait-pulse 1.6s ease-in-out infinite; }
  #wait .site { font-size: 15px; font-weight: 600; letter-spacing: .01em; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #wait .track { width: 150px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  #wait .track i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #7c5cff, #ffb020); animation: wait-run 1.1s ease-in-out infinite; }
  @keyframes wait-in { from { opacity: 0; } }
  @keyframes wait-pulse { 50% { transform: scale(.94); opacity: .8; } }
  @keyframes wait-run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  /* Motion: tiles lift under the pointer and give when clicked. */
  .fav, .item { transition: background-color .18s ease, transform .22s cubic-bezier(.3,1.4,.5,1), border-color .2s ease, box-shadow .22s ease; }
  .fav:hover { transform: translateY(-2px); }
  .fav .tile { transition: transform .26s cubic-bezier(.3,1.6,.5,1), box-shadow .26s ease; }
  .fav:hover .tile { transform: scale(1.08); box-shadow: 0 10px 22px -10px rgba(0,0,0,.7); }
  .item:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.14); box-shadow: 0 10px 24px -16px rgba(124,92,255,.7); }
  /* Depth: a tile rises under the pointer and its icon stands out of it (depth.js); no turn. */
  .fav, .item { transform-style: preserve-3d; }
  .fav.bh-lean { transform: perspective(320px) translateZ(3px); }
  .fav.bh-lean .tile { transform: translateZ(12px) scale(1.03); }
  .fav.bh-lean .name { transform: translateZ(5px); }
  .item.bh-lean { transform: perspective(600px) translateZ(3px); }
  .item .tile, .item .meta, .fav .name { transition: transform .26s cubic-bezier(.3,1.4,.5,1), box-shadow .26s ease; }
  .item.bh-lean .tile { transform: translateZ(10px); }
  .item.bh-lean .meta { transform: translateZ(5px); }
  /* Relief (3D style, at rest too; shadows from depth.js): sections stand off the page, rows off
     their section, and a tile catches a little light from above; a raised one casts a longer shadow. */
  body:not(.flat) .card { background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04)); box-shadow: var(--bh-relief-panel); }
  body:not(.flat) .news { background: linear-gradient(135deg, rgba(124,92,255,.26), rgba(255,255,255,.04)); }
  body:not(.flat) .item { background-color: rgba(255,255,255,.045); box-shadow: var(--bh-relief-raised); }
  body:not(.flat) .item.live { background-color: rgba(124,92,255,.14); }
  body:not(.flat) .item:hover { background-color: rgba(255,255,255,.1); box-shadow: var(--bh-relief-raised), 0 10px 24px -16px rgba(124,92,255,.7); }
  body:not(.flat) .tile { position: relative; box-shadow: var(--bh-relief-key); }
  body:not(.flat) .tile::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: var(--bh-sheen); }
  body:not(.flat) .fav:hover:not(.bh-lean) .tile { box-shadow: var(--bh-relief-key); }
  body:not(.flat) .item .tile { box-shadow: var(--bh-relief-face), 0 1px 0 #00000052, 0 4px 8px -6px #00000099; }
  body:not(.flat) .bh-lean .tile { box-shadow: var(--bh-relief-face), 0 1px 0 #00000052, 0 10px 16px -8px #000000b3; }
  body:not(.flat) :is(.fav, .item):active .tile { box-shadow: var(--bh-relief-key-down); }
  body:not(.flat) #wait .tile { box-shadow: var(--bh-relief-key); }
  .fav:active, .item:active { transform: scale(.97); }
  .more { transition: opacity .15s ease, background-color .15s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.97); } }
  /* Sections are moved by their title: a grip shows under the pointer or the focus, the section
     lifts while it follows the pointer and the others make room (FLIP, transform only). */
  .card h2.grab { cursor: grab; touch-action: none; user-select: none; border-radius: 8px; margin: -4px -6px 10px; padding: 4px 6px; }
  .card h2.grab:focus-visible { outline: 2px solid var(--accent, #7c5cff); outline-offset: 1px; }
  .card h2 .grip { display: inline-grid; place-items: center; width: 16px; margin-left: -4px; margin-right: 2px; opacity: 0; transition: opacity .15s ease; vertical-align: -3px; }
  .card h2 .ttl { display: inline-flex; align-items: center; }
  .card:hover h2 .grip, .card h2:focus-visible .grip, .card.lifted h2 .grip { opacity: .7; }
  .card.lifted { position: relative; z-index: 5; cursor: grabbing; box-shadow: 0 24px 48px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.14); transition: box-shadow .2s ease; }
  .card.lifted h2 { cursor: grabbing; }
  .card.settle { transition: transform .26s cubic-bezier(.2,.9,.3,1.05), box-shadow .26s ease; }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  body.dragging .card:not(.lifted) { transition: transform .22s cubic-bezier(.2,.8,.3,1); }
  body.noanim *, body.noanim *::before, body.noanim *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="splash"><i class="bgd"></i><div class="core"><i class="flash"></i><i class="shock"></i><i class="glow"></i><i class="disc"></i><i class="ring"></i></div><div class="word">BlackHole</div></div>
<div id="wait"><div id="waittile"></div><div class="site" id="waitsite"></div><div class="track"><i></i></div></div>
<main>
  <div class="brand"><div class="logo"><i class="glow"></i><i class="disc"></i><i class="ring"></i><i class="ring fast"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i></div><h1>BlackHole</h1></div>
  <section class="card news" id="news" hidden></section>
  <div id="sections">
  <section class="card now" id="now" data-name="now" hidden><h2><span class="ttl" data-i18n="home.now">Now</span></h2><div id="nowlist"></div></section>
  <section class="card" id="favorites" data-name="favorites"><h2><span class="ttl" data-i18n="home.favorites">Favorites</span></h2><div id="favs"></div></section>
  <section class="card" id="watches" data-name="watches" hidden><h2><span class="ttl" data-i18n="home.watches">Watched areas</span> <span class="acts"><button class="checkall" id="checkall" data-i18n-title="home.check_all" data-i18n-aria="home.check_all"></button><button class="lib" data-section="watches" data-i18n="home.see_all">See all</button></span></h2><div id="watchlist"></div></section>
  <section class="card" id="downloads" data-name="downloads" hidden><h2><span class="ttl" data-i18n="home.downloads">Downloads</span> <button class="lib" data-section="downloads" data-i18n="home.see_all">See all</button></h2><div id="dllist"></div></section>
  <section class="card" id="recent-card" data-name="recent"><h2><span class="ttl" data-i18n="home.recent">Recent activity</span> <button id="clear" data-i18n-title="palette.clear_history" data-i18n="home.clear">Clear</button></h2><div id="recent"></div></section>
  </div>
  <div class="customize"><button id="customize"><span data-i18n="home.customize">Customize the start page</span></button></div>
</main>
<script>
const send = (m) => window.ipc.postMessage(JSON.stringify(m));
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return 'hsl(' + h + ',55%,48%)'; }
let favicons = {};
