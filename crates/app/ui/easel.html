<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>BlackHole Easel</title>
<style>
  :root { --accent: #7c5cff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #100f17; color: #eceaf5; font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 38px minmax(0, 1fr); }
  body.embedded { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); }
  body.embedded nav, body.embedded #top, body:not(.embedded) .only-tab { display: none; }
  /* Window top bar: the same height, tint and window buttons as the main window's (bar.html). */
  #top { grid-column: 1 / -1; display: flex; align-items: center; padding-left: 14px; user-select: none; -webkit-user-select: none; background: radial-gradient(700px 500px at 0% 0%, var(--glow, rgba(124,92,255,.35)), transparent 70%), var(--tint, #100f17); }
  body.macos #top { padding-left: 84px; }
  #top .brand { flex: 1; padding: 0; font-size: 13px; gap: 9px; }
  #top .logo { width: 18px; height: 18px; }
  .win { display: none; align-self: stretch; }
  body.windows .win { display: flex; }
  .win button { font: inherit; color: inherit; border: 0; background: transparent; cursor: pointer; width: 46px; height: 100%; display: grid; place-items: center; opacity: .8; }
  .win button:hover { background: rgba(255,255,255,.12); opacity: 1; }
  .win button.close:hover { background: #e81123; color: #fff; }
  .win svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; }
  #wmax .restore, body.maxed #wmax .square { display: none; }
  body.maxed #wmax .restore { display: block; }
  nav { padding: 18px 10px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.02); overflow-y: auto; user-select: none; -webkit-user-select: none; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 14px; font-weight: 600; font-size: 15px; }
  .logo { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle, #000 0 42%, rgba(255,170,60,.95) 48%, rgba(255,90,40,.5) 62%, transparent 74%); }
  .btn { font: inherit; font-size: 13px; color: inherit; border: 0; cursor: pointer; border-radius: 9px; padding: 7px 12px; background: rgba(255,255,255,.1); display: inline-flex; align-items: center; gap: 7px; }
  .btn.icon { padding: 7px; }
  .btn:hover { background: rgba(255,255,255,.18); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.danger:hover { background: #c2455b; }
  .easel { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; color: inherit; font: inherit; padding: 8px 10px; border-radius: 9px; cursor: pointer; opacity: .75; }
  .easel:hover { background: rgba(255,255,255,.07); opacity: 1; }
  .easel.on { background: color-mix(in srgb, var(--accent) 28%, transparent); opacity: 1; }
  .easel .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .easel .count { font-size: 11px; opacity: .6; }
  section { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
  #title { flex: 1; min-width: 0; font-family: inherit; font-size: 18px; font-weight: 600; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; }
  #title:hover, #title:focus { border-color: rgba(255,255,255,.18); outline: none; }
  #board { position: relative; overflow: auto; background-color: #14131c; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 24px 24px; }
  #surface { position: relative; min-width: 100%; min-height: 100%; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; opacity: .5; pointer-events: none; padding: 40px; }
  .card { position: absolute; display: flex; flex-direction: column; border-radius: 12px; box-shadow: 0 6px 22px rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.14); overflow: hidden; }
  .card .bar { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; background: rgba(0,0,0,.25); cursor: grab; user-select: none; -webkit-user-select: none; }
  .card.drag .bar { cursor: grabbing; }
  .card .kind { font-size: 11px; opacity: .65; text-transform: uppercase; letter-spacing: .07em; flex: 1; }
  .card .tool { font: inherit; color: inherit; border: 0; background: transparent; cursor: pointer; border-radius: 6px; width: 24px; height: 22px; padding: 0; display: grid; place-items: center; opacity: .7; }
  .card .tool:hover { background: rgba(255,255,255,.18); opacity: 1; }
  /* A live card that is also watched: told when its area changes. */
  .card .tool.on { opacity: 1; background: rgba(255,255,255,.22); }
  .card .link { display: block; padding: 8px 10px 0; font-weight: 600; color: #fff; text-decoration: none; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .link:hover { text-decoration: underline; }
  .card .host { padding: 0 10px 4px; font-size: 11.5px; opacity: .6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card textarea { flex: 1; min-height: 0; width: 100%; resize: none; border: 0; outline: none; background: transparent; color: inherit; font: inherit; padding: 8px 10px; }
  .card.live .bar { height: 30px; box-sizing: border-box; }
  .card .slot { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: 12px; opacity: .8; background: rgba(0,0,0,.18); overflow: hidden; }
  .card .foot { height: 14px; flex: none; display: flex; align-items: center; padding: 0 22px 0 10px; font-size: 10.5px; opacity: .6; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .card .grip { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,.4) 50%); }
  .colors { display: none; gap: 4px; padding: 0 4px; }
  .card.pick .colors { display: flex; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); cursor: pointer; padding: 0; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2b2a3a; border: 1px solid rgba(255,255,255,.14); padding: 8px 14px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo"></span>Easels</div>
  <div class="win">
    <button id="wmin" data-i18n-title="window.minimize"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
    <button id="wmax" data-i18n-title="window.maximize"><svg class="square" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg><svg class="restore" viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5v-2h7v7h-2"/></svg></button>
    <button id="wclose" class="close" data-i18n-title="window.close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
  </div>
</header>
<nav>
  <button class="btn primary" id="new" data-i18n="easel.new">+ New Easel</button>
  <div id="list"></div>
</nav>
<section>
  <header>
    <input id="title" data-i18n-aria="easel.name" maxlength="80" spellcheck="false">
    <button class="btn" id="note"><i data-icon="plus"></i><span data-i18n="easel.note">Note</span></button>
    <button class="btn" id="capture" data-i18n-title="easel.capture_hint"><i data-icon="camera"></i><span data-i18n="easel.capture">Capture page</span></button>
    <button class="btn danger" id="delete" data-i18n="easel.delete">Delete</button>
    <button class="btn only-tab" id="all" data-i18n-title="easel.all_hint"><i data-icon="window"></i><span data-i18n="easel.all">All Easels</span></button>
    <button class="btn only-tab icon" id="close" data-i18n-title="easel.close_tab" data-i18n-aria="easel.close_tab"><i data-icon="close"></i></button>
  </header>
  <div id="board"><div id="surface"></div><div id="empty"><div><span data-i18n="easel.empty">Nothing here yet.</span><br><span id="capkeys"></span></div></div></div>
</section>
<div id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const send = (m) => window.ipc.postMessage(JSON.stringify(m));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let state = { current: null, easels: [], colors: [] };
const pending = new Map();
let timer = null;

function flush() {
  clearTimeout(timer);
  for (const [item, text] of pending) send({ cmd: 'easel_set_text', item, text });
  pending.clear();
}
function queueText(item, text) {
  pending.set(item, text);
  clearTimeout(timer);
  timer = setTimeout(flush, 200);
}
const current = () => state.easels.find(e => e.id === state.current) || null;
const host = (url) => { try { return new URL(url).host; } catch (_) { return ''; } };

function drag(card, item, mode) {
  return (ev) => {
    if (ev.button !== 0 || ev.target.closest('.tool,.dot')) return;
    ev.preventDefault();
    const sx = ev.clientX, sy = ev.clientY, ox = item.x, oy = item.y, ow = item.w, oh = item.h;
    card.classList.add('drag');
    const move = (e) => {
      if (mode === 'move') {
        item.x = Math.max(0, Math.round(ox + e.clientX - sx));
        item.y = Math.max(0, Math.round(oy + e.clientY - sy));
      } else {
        item.w = Math.max(120, Math.round(ow + e.clientX - sx));
        item.h = Math.max(80, Math.round(oh + e.clientY - sy));
      }
      place(card, item);
      fit();
      layout();
    };
    const up = () => {
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', up);
      card.classList.remove('drag');
      send(mode === 'move' ? { cmd: 'easel_move', item: item.id, x: item.x, y: item.y }
                           : { cmd: 'easel_resize', item: item.id, w: item.w, h: item.h });
    };
    addEventListener('pointermove', move);
    addEventListener('pointerup', up);
  };
}
function place(card, item) {
  card.style.cssText = `left:${item.x}px;top:${item.y}px;width:${item.w}px;height:${item.h}px;background:${item.color}`;
}
// The surface always extends past the farthest card so the board can scroll to it.
function fit() {
  const e = current();
  const items = e ? e.items : [];
  $('surface').style.width = Math.max(0, ...items.map(i => i.x + i.w)) + 200 + 'px';
  $('surface').style.height = Math.max(0, ...items.map(i => i.y + i.h)) + 200 + 'px';
}
function card(item) {
  const c = el('div', 'card ' + item.kind);
  c.dataset.id = item.id;
  place(c, item);
  const bar = el('div', 'bar');
  const colors = el('div', 'colors');
  for (const col of state.colors) {
    const d = el('button', 'dot');
    d.style.background = col;
    d.title = col;
    d.onclick = () => send({ cmd: 'easel_color', item: item.id, color: col });
    colors.append(d);
  }
  const paint = el('button', 'tool');
  paint.append(bhIcon('paint', 'xs'));
  paint.title = bhT('easel.color');
  paint.onclick = () => c.classList.toggle('pick');
  const remove = el('button', 'tool remove');
  remove.append(bhIcon('close', 'xs'));
  remove.title = bhT('easel.remove');
  remove.onclick = () => { pending.delete(item.id); send({ cmd: 'easel_remove', item: item.id }); };
  const label = bhT({ clip: 'easel.kind_clip', live: 'easel.kind_live' }[item.kind] || 'easel.note');
  const play = el('button', 'tool play');
  play.append(bhIcon(item.playing ? 'pause' : 'play', 'xs'));
  play.title = bhT(item.playing ? 'easel.pause' : 'easel.play');
  play.onclick = () => send({ cmd: item.playing ? 'easel_live_stop' : 'easel_live_play', item: item.id });
  // The area of a live card can also be watched: a card of the sidebar tells when it changes.
  const watch = el('button', 'tool watch' + (item.watched ? ' on' : ''));
  watch.append(bhIcon('watch', 'xs'));
  watch.title = bhT(item.watched ? 'easel.unwatch' : 'easel.watch');
  watch.setAttribute('aria-pressed', item.watched ? 'true' : 'false');
  watch.onclick = () => send({ cmd: 'easel_watch', item: item.id, on: !item.watched });
  bar.append(el('span', 'kind', label), ...(item.kind === 'live' ? [play, watch] : []), colors, paint, remove);
  bar.onpointerdown = drag(c, item, 'move');
  c.append(bar);
  if (item.kind === 'clip') {
    const link = el('a', 'link', item.title);
    link.title = item.url;
    link.onclick = (e) => { e.preventDefault(); send({ cmd: 'easel_open_link', item: item.id }); };
    c.append(link, el('div', 'host', host(item.url)));
  }
  if (item.kind === 'live') {
    const slot = el('div', 'slot', bhT(item.playing ? 'easel.loading' : 'easel.paused'));
    const foot = el('div', 'foot', item.title + ' · ' + host(item.url));
    foot.title = item.url;
    foot.style.cursor = 'pointer';
    foot.onclick = () => send({ cmd: 'easel_open_link', item: item.id });
    c.append(slot, foot);
    const grip = el('div', 'grip');
    grip.onpointerdown = drag(c, item, 'resize');
    c.append(grip);
    return c;
  }
  const area = el('textarea');
  area.value = item.text;
  area.placeholder = bhT(item.kind === 'clip' ? 'easel.comment' : 'easel.write');
  area.oninput = () => { item.text = area.value; queueText(item.id, area.value); };
  area.onblur = flush;
  c.append(area);
  const grip = el('div', 'grip');
  grip.onpointerdown = drag(c, item, 'resize');
  c.append(grip);
  return c;
}

// Native live views float above this page: tell the shell where each card's slot is, and hide
// the view of a card that is not fully inside the board. A timer backs up the animation frame:
// WebKit pauses frames while the window is covered, and the live view would stay 1×1 till then.
let framed = false, last = '';
function layout() {
  if (framed) return;
  framed = true;
  const run = () => {
    if (!framed) return;
    framed = false;
    const b = $('board').getBoundingClientRect();
    const slots = [...document.querySelectorAll('.card.live .slot')].map((s) => {
      const r = s.getBoundingClientRect();
      const visible = r.left >= b.left - 1 && r.top >= b.top - 1 && r.right <= b.right + 1 && r.bottom <= b.bottom + 1;
      return { item: +s.parentElement.dataset.id, x: r.left, y: r.top, w: r.width, h: r.height, visible };
    });
    const key = JSON.stringify(slots);
    if (key !== last) { last = key; send({ cmd: 'easel_layout', slots, embedded: !!state.embedded }); }
  };
  requestAnimationFrame(run);
  setTimeout(run, 100);
}
$('board').addEventListener('scroll', layout);
addEventListener('resize', layout);

// The window's own top bar (hidden when the Easel is shown as a tab).
const mix = (hex, r) => {
  const n = parseInt(hex.slice(1), 16), b = [16, 15, 23];
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map((c, i) => Math.round(b[i] + (c - b[i]) * r).toString(16).padStart(2, '0')).join('');
};
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
const win = (action) => send({ cmd: 'panel_window', window: 'easel', action });
$('wmin').onclick = () => win('minimize');
$('wmax').onclick = () => win('maximize');
$('wclose').onclick = () => { flush(); win('close'); };
$('top').addEventListener('mousedown', (e) => { if (e.button === 0 && !e.target.closest('button')) win('drag'); });
$('top').addEventListener('dblclick', (e) => { if (!e.target.closest('button')) win('maximize'); });

window.bh = {
  render(s) {
    for (const e of s.easels) for (const i of e.items) if (pending.has(i.id) && e.id === s.current) i.text = pending.get(i.id);
    flush();
    if (s.spaceColor && !s.embedded) {
      const root = document.documentElement.style;
      root.setProperty('--accent', s.spaceColor);
      root.setProperty('--glow', rgba(s.spaceColor, .5));
      root.setProperty('--tint', mix(s.spaceColor, .3));
    }
    document.body.classList.toggle('macos', s.os === 'macos');
    document.body.classList.toggle('windows', s.os === 'windows');
    document.body.classList.toggle('maxed', !!s.maximized);
    state = s;
    document.body.classList.toggle('embedded', !!s.embedded);
    const e = current();
    $('list').replaceChildren(...s.easels.map(x => {
      const b = el('button', 'easel' + (x.id === s.current ? ' on' : ''));
      b.append(el('span', 'name', x.name), el('span', 'count', x.items.length));
      b.onclick = () => send({ cmd: 'select_easel', id: x.id });
      return b;
    }));
    if (document.activeElement !== $('title')) $('title').value = e ? e.name : '';
    $('title').disabled = $('note').disabled = $('capture').disabled = $('delete').disabled = !e;
    $('surface').replaceChildren(...(e ? e.items.map(card) : []));
    $('empty').style.display = e && e.items.length ? 'none' : '';
    fit();
    last = '';
    layout();
  },
  toast(msg) {
    $('toast').textContent = msg;
    $('toast').classList.add('on');
    clearTimeout(bh.t);
    bh.t = setTimeout(() => $('toast').classList.remove('on'), 2200);
  },
};

$('new').onclick = () => send({ cmd: 'new_easel', name: '' });
$('note').onclick = () => send({ cmd: 'easel_add_note' });
$('all').onclick = () => send({ cmd: 'open_easel', id: state.current });
$('close').onclick = () => { flush(); send({ cmd: 'close_easel_tab' }); };
$('capture').onclick = () => send({ cmd: 'capture_to_easel' });
const hint = () => { $('capkeys').textContent = bhT('easel.empty_hint', { keys: bhKeys('mod+shift+s') }); };
hint();
addEventListener('bhlang', () => { hint(); if (!arm) $('delete').textContent = bhT('easel.delete'); bh.render(state); });
// Native webviews do not show confirm(): a second click within 3 s confirms.
let arm = null;
$('delete').onclick = () => {
  const e = current();
  if (!e) return;
  if (arm) { clearTimeout(arm); arm = null; $('delete').textContent = bhT('easel.delete'); send({ cmd: 'delete_easel', id: e.id }); return; }
  $('delete').textContent = bhT('easel.delete_confirm');
  arm = setTimeout(() => { arm = null; $('delete').textContent = bhT('easel.delete'); }, 3000);
};
$('title').onchange = () => { const e = current(); if (e) send({ cmd: 'rename_easel', id: e.id, name: $('title').value }); };
$('title').onkeydown = (ev) => { if (ev.key === 'Enter') ev.target.blur(); };
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'w')) { e.preventDefault(); flush(); send({ cmd: state.embedded ? 'close_easel_tab' : 'close_easel' }); }
});
send({ cmd: 'ready' });
</script>
</body>
</html>
