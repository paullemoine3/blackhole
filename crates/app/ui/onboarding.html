<!-- Welcome tour of the start page (domain::onboarding), appended to home.html at build time
     (HOME_HTML in main.rs): at the first launch of a profile, once the launch splash has landed,
     the start page is veiled and a dialog walks through the main features, then offers to import
     bookmarks, make BlackHole the default browser, install a few extensions and pick the look of
     the first space. Settings > General replays the features alone (`mode` "tour").
     Between two steps the hole of the launch splash comes back, alone and pure black: it is born
     in the middle of the card, grows until it swallows it, and the next step comes out of the dark
     (0.7 s + 0.25 s). The last step lets the whole start page fall into it. Only transform and
     opacity move; with animations off the steps simply swap.
     Every class is prefixed `ob-` so the start page's own rules (.tile, .more, .item…) stay out. -->
<style>
  #ob-veil { position: fixed; inset: 0; z-index: 20; background: rgba(6,5,12,.62); -webkit-backdrop-filter: blur(7px) saturate(.8); backdrop-filter: blur(7px) saturate(.8);
    opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s .5s; }
  #ob-veil.on { opacity: 1; visibility: visible; transition: opacity .5s ease; }
  #ob { --ob-accent: #7c5cff; --ob-rgb: 124,92,255; --ob-k: 1; position: fixed; z-index: 21; left: 50%; top: 50%; width: 740px; height: 580px; display: grid;
    border-radius: 18px; overflow: hidden; visibility: hidden; color: #eceaf5; font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(520px 300px at 50% -12%, rgba(var(--ob-rgb),.2), transparent 70%), #100f17;
    box-shadow: 0 0 0 1px rgba(255,255,255,.09), 0 30px 80px rgba(0,0,0,.6), 0 0 120px rgba(var(--ob-rgb),.18);
    transform: translate(-50%, -50%) scale(var(--ob-k)); }
  #ob.on { visibility: visible; animation: ob-rise .6s cubic-bezier(.2,1.3,.4,1) both; }
  #ob.off { visibility: visible; animation: ob-gone .01s .7s both; }
  @keyframes ob-rise { from { opacity: 0; transform: translate(-50%, calc(-50% + 22px)) scale(calc(var(--ob-k) * .96)); } }
  @keyframes ob-gone { to { opacity: 0; visibility: hidden; } }
  #ob button { font: inherit; color: inherit; }
  .ob-pane { position: relative; overflow: hidden; display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  .ob-stage { position: relative; overflow: hidden; min-height: 0; }
  .ob-step { position: absolute; inset: 0; display: grid; grid-template-rows: 250px auto 1fr; }
  .ob-step.form { grid-template-rows: 0 auto 1fr; }
  .ob-step.form .ob-vis { visibility: hidden; }
  .ob-step.slim { grid-template-rows: 150px auto 1fr; }
  .ob-step.slim .ob-vis { visibility: visible; }
  .ob-step.ready { grid-template-rows: 186px auto 1fr; }
  .ob-step.leaving { animation: ob-suck .7s cubic-bezier(.5,0,.9,.5) both; }
  .ob-step.entering { animation: ob-emerge .5s cubic-bezier(.2,.85,.25,1) both; }
  @keyframes ob-suck { 0%, 40% { transform: none; filter: none; } 100% { transform: scale(.9); filter: blur(3px); opacity: .4; } }
  @keyframes ob-emerge { from { opacity: 0; transform: scale(1.08); } }

  /* The hole between two steps: pure black, no accretion and no ring. Born with a bounce, it
     grows until it covers the card (or the whole start page, for the last step). */
  .ob-warp { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; pointer-events: none; visibility: hidden; }
  .ob-warp.all { position: fixed; z-index: 30; }
  .ob-warp .void { width: 64px; height: 64px; border-radius: 50%; background: #000; box-shadow: 0 0 24px 6px rgba(0,0,0,.55); transform: scale(0); }
  .ob-warp.go { visibility: visible; animation: ob-out .25s ease-out .7s both; }
  .ob-warp.go .void { animation: ob-swallow .7s both; }
  .ob-warp .void { --dive: 17; } .ob-warp.all .void { --dive: 40; }
  @keyframes ob-swallow { 0% { transform: scale(0); animation-timing-function: cubic-bezier(.2,1.3,.4,1); } 40% { transform: scale(1); animation-timing-function: cubic-bezier(.6,0,.9,.4); } 100% { transform: scale(var(--dive)); } }
  @keyframes ob-out { to { opacity: 0; visibility: hidden; } }
  main.ob-emerge { animation: ob-emerge .5s cubic-bezier(.2,.85,.25,1) both; }

  .ob-foot { display: flex; align-items: center; gap: 10px; padding: 14px 22px 18px; position: relative; z-index: 6; }
  .ob-prog { display: flex; gap: 6px; align-items: center; margin-right: auto; }
  .ob-prog i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.18); transition: all .4s cubic-bezier(.2,.85,.25,1); }
  .ob-prog i.done { background: rgba(var(--ob-rgb),.55); }
  .ob-prog i.cur { width: 22px; border-radius: 3px; background: var(--ob-accent); box-shadow: 0 0 10px rgba(var(--ob-rgb),.5); }
  .ob-prog b { width: 1px; height: 10px; background: rgba(255,255,255,.12); margin: 0 3px; }
  .ob-btn { font-size: 13.5px; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; background: rgba(255,255,255,.07); transition: background .2s, transform .2s cubic-bezier(.3,1.4,.5,1); white-space: nowrap; }
  .ob-btn:hover { background: rgba(255,255,255,.12); }
  .ob-btn:active { transform: scale(.96); }
  .ob-btn:focus-visible { outline: 2px solid var(--ob-accent); outline-offset: 2px; }
  .ob-btn.pri { background: var(--ob-accent); color: #fff; font-weight: 600; box-shadow: 0 4px 18px rgba(var(--ob-rgb),.35); }
  .ob-btn.pri:hover { filter: brightness(1.1); }
  .ob-btn.ghost { background: transparent; opacity: .6; }
  .ob-btn.ghost:hover { opacity: 1; background: rgba(255,255,255,.06); }
  .ob-btn[hidden] { display: none; }
  .ob-btn .k { margin-left: 8px; opacity: .65; font-size: 11px; }

  .ob-vis { position: relative; overflow: hidden; display: grid; place-items: center; -webkit-mask: linear-gradient(#000 75%, transparent); mask: linear-gradient(#000 75%, transparent); }
  .ob-step.slim .ob-vis > * { transform: scale(.88); }
  .ob-stars { position: absolute; left: 0; top: 0; width: 1px; height: 1px; border-radius: 50%; opacity: .7; animation: ob-twinkle 5s ease-in-out infinite alternate; }
  @keyframes ob-twinkle { to { opacity: .35; } }
  .ob-txt { padding: 18px 34px 0; text-align: center; }
  .ob-step.form .ob-txt { padding-top: 30px; text-align: left; }
  .ob-step.slim .ob-txt { padding-top: 0; }
  .ob-step.ready .ob-txt { padding-top: 6px; }
  .ob-eye { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ob-accent); filter: brightness(1.35); }
  .ob-txt h2 { font-size: 26px; font-weight: 600; letter-spacing: -.015em; margin: 4px 0 6px; line-height: 1.2; }
  .ob-txt p { opacity: .7; max-width: 560px; margin: 0 auto; }
  .ob-step.form .ob-txt p { margin: 0; }
  .ob-body { padding: 14px 34px 0; min-height: 0; }
  .ob-step:not(.form) .ob-body { text-align: center; }
  .entering .ob-eye, .entering .ob-txt h2, .entering .ob-txt p, .entering .ob-body > * { animation: ob-up .55s cubic-bezier(.2,.85,.25,1) both; }
  .entering .ob-txt h2 { animation-delay: .05s; } .entering .ob-txt p { animation-delay: .1s; } .entering .ob-body > * { animation-delay: .16s; } .entering .ob-body > * + * { animation-delay: .22s; }
  @keyframes ob-up { from { opacity: 0; transform: translateY(10px); } }
  .ob-kbd { font: 11px ui-monospace, Menlo, Consolas, monospace; padding: 2px 6px; border-radius: 6px; background: rgba(255,255,255,.1); box-shadow: inset 0 -1px 0 rgba(255,255,255,.12); }

  /* The logo, sized by --s, as on the start page. */
  .ob-bh { position: relative; width: 1em; height: 1em; font-size: var(--s, 84px); flex: none; }
  .ob-bh i { position: absolute; border-radius: 50%; }
  .ob-bh .disc { inset: 0; background: radial-gradient(circle, #000 0 34%, rgba(255,170,60,.95) 38%, rgba(255,90,40,.5) 52%, rgba(124,92,255,.3) 64%, transparent 76%);
    box-shadow: 0 0 .48em rgba(255,120,40,.3), 0 0 1.07em rgba(124,92,255,.25); animation: ob-breathe 5s ease-in-out infinite; }
  .ob-bh .ring { inset: -11%; border: max(1.5px, .024em) solid transparent; border-top-color: rgba(255,205,120,.9); border-right-color: rgba(124,92,255,.8); animation: ob-spin 6s linear infinite; }
  .ob-bh .glow { inset: -45%; background: radial-gradient(circle, rgba(255,120,40,.3), rgba(124,92,255,.16) 45%, transparent 70%); animation: ob-breathe 6s ease-in-out infinite; }
  @keyframes ob-breathe { 50% { transform: scale(1.06); } }
  @keyframes ob-spin { to { transform: rotate(360deg); } }
  .ob-orbit { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 1px dashed rgba(255,255,255,.08); animation: ob-orbit var(--t) linear infinite; }
  .ob-orbit i { position: absolute; left: 50%; top: -3px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--c, #fff); box-shadow: 0 0 6px 1px #beaaffe6; }
  @keyframes ob-orbit { from { transform: translate(-50%, -50%) rotate(0); } to { transform: translate(-50%, -50%) rotate(360deg); } }
  .ob-lang { display: inline-flex; margin-top: 16px; background: rgba(255,255,255,.06); border-radius: 999px; padding: 3px; font-size: 12px; }
  .ob-lang button { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; cursor: pointer; opacity: .6; }
  .ob-lang button[aria-pressed="true"] { background: rgba(255,255,255,.12); opacity: 1; }

  /* Spaces: the mini sidebar changes space, color and tabs. */
  .ob-mw { position: relative; width: 340px; height: 190px; border-radius: 12px; overflow: hidden; display: flex; box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 20px 50px rgba(0,0,0,.5); background: #100f17; }
  .ob-ms { position: relative; width: 112px; padding: 26px 8px 8px; display: flex; flex-direction: column; gap: 5px; }
  .ob-tint { position: absolute; inset: 0; opacity: .3; transition: background-color .6s ease; }
  .ob-lbl { position: relative; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .8; margin: 0 4px 2px; height: 14px; overflow: hidden; }
  .ob-lbl span { display: block; height: 14px; line-height: 14px; transition: transform .5s cubic-bezier(.2,.85,.25,1); }
  .ob-tabs { position: relative; overflow: hidden; flex: 1; }
  .ob-track { display: flex; width: 300%; height: 100%; transition: transform .55s cubic-bezier(.2,.85,.25,1); }
  .ob-col { width: 33.333%; display: flex; flex-direction: column; gap: 5px; }
  .ob-col i { height: 17px; border-radius: 5px; background: rgba(255,255,255,.08); display: flex; align-items: center; gap: 5px; padding: 0 5px; }
  .ob-col i::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--c, rgba(255,255,255,.35)); }
  .ob-col i::after { content: ""; height: 3px; width: var(--w, 50%); border-radius: 2px; background: rgba(255,255,255,.25); }
  .ob-sd { position: relative; display: flex; gap: 7px; justify-content: center; padding-top: 6px; }
  .ob-sd i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); opacity: .35; transition: all .4s; }
  .ob-sd i.on { opacity: 1; transform: scale(1.35); box-shadow: 0 0 6px var(--c); }
  .ob-mp { flex: 1; margin: 6px 6px 6px 0; border-radius: 8px; background: #0c0b12; box-shadow: 0 0 0 1px rgba(255,255,255,.06); padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .ob-mp b { height: 10px; width: 60%; border-radius: 3px; background: rgba(255,255,255,.18); }
  .ob-mp s { height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); }
  .ob-mp u { margin-top: auto; height: 50px; border-radius: 7px; transition: background-color .6s; opacity: .35; }

  /* Command bar: a few letters, the rows come. */
  .ob-pal { width: 380px; border-radius: 16px; background: rgba(22,20,32,.92); box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 24px 60px rgba(0,0,0,.6), 0 0 40px rgba(var(--ob-rgb),.25); overflow: hidden; text-align: left; }
  .ob-in { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 15px; }
  .ob-in .bh-i { opacity: .5; }
  .ob-typed::after { content: ""; display: inline-block; width: 1.5px; height: 16px; background: var(--ob-accent); margin-left: 1px; vertical-align: -3px; animation: ob-caret 1s steps(1) infinite; }
  @keyframes ob-caret { 50% { opacity: 0; } }
  .ob-in .ob-keys { margin-left: auto; display: flex; gap: 4px; }
  .ob-res { list-style: none; padding: 6px; margin: 0; }
  .ob-res li { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 8px; font-size: 12.5px; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .35s cubic-bezier(.2,.85,.25,1); }
  .ob-res li.show { opacity: 1; transform: none; }
  .ob-res li.sel { background: rgba(var(--ob-rgb),.85); }
  .ob-res .ic { width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,.1); display: grid; place-items: center; flex: none; }
  .ob-res em { margin-left: auto; font-style: normal; font-size: 11px; opacity: .55; }

  /* Shields: what comes near the hole never comes out, light included. */
  .ob-shield { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
  .ob-shield .ob-bh { --s: 78px; }
  .ob-tr { position: absolute; left: 50%; top: 50%; font: 10.5px ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; padding: 2px 7px; border-radius: 999px; background: rgba(255,90,40,.14); color: #ffb79c; border: 1px solid rgba(255,90,40,.3);
    opacity: 0; animation: ob-sucked var(--d) cubic-bezier(.5,0,.85,.55) var(--delay) infinite; }
  .ob-ray { position: absolute; left: 50%; top: 50%; width: 46px; height: 2px; margin-top: -1px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(255,235,200,.9)); opacity: 0;
    animation: ob-sucked var(--d) cubic-bezier(.55,0,.9,.6) var(--delay) infinite; }
  @keyframes ob-sucked { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a))) scale(1); } 12% { opacity: 1; } 80% { opacity: .9; }
    100% { opacity: 0; transform: translate(-50%, -50%) rotate(calc(var(--a) + 200deg)) translateX(6px) rotate(calc(-1 * var(--a) - 200deg)) scale(.15); } }
  .ob-count { position: absolute; left: 26px; bottom: 34px; text-align: left; }
  .ob-count b { display: block; font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .ob-count span { font-size: 11.5px; opacity: .6; }
  /* Pulsars: the star beats, a signal crosses to the folder, its line appears; a line opened leaves. */
  .ob-pu { position: relative; width: 100%; height: 100%; }
  .ob-star { position: absolute; left: 196px; top: 104px; width: 0; height: 0; }
  .ob-star > * { position: absolute; left: 0; top: 0; }
  .ob-star .core { width: 30px; height: 30px; margin: -15px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #d9ccff 35%, var(--ob-accent) 100%); box-shadow: 0 0 26px 6px rgba(var(--ob-rgb),.75); }
  .ob-star .beams { width: 300px; height: 26px; margin: -13px -150px; animation: ob-spin 3.6s linear infinite;
    background: linear-gradient(90deg, transparent, rgba(var(--ob-rgb),.55) 38%, rgba(255,255,255,.9) 50%, rgba(var(--ob-rgb),.55) 62%, transparent); clip-path: polygon(0 0, 50% 46%, 100% 0, 100% 100%, 50% 54%, 0 100%); }
  .ob-star .halo { width: 104px; height: 40px; margin: -20px -52px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.4); transform: rotate(-20deg); }
  .ob-star .wave { width: 34px; height: 34px; margin: -17px; border-radius: 50%; border: 2px solid rgba(var(--ob-rgb),.9); opacity: 0; }
  .ob-star.beat .wave { animation: ob-wave 1.3s ease-out; }
  .ob-star.beat .wave + .wave { animation-delay: .16s; }
  .ob-star.beat .core { animation: ob-kick .5s ease-out; }
  @keyframes ob-wave { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(5.2); } }
  .ob-sig { position: absolute; left: 0; top: 0; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; color: #fff; background: var(--c); box-shadow: 0 0 16px var(--c); opacity: 0;
    offset-path: path('M 214 104 C 270 40 330 40 420 88'); offset-rotate: 0deg; }
  .ob-sig.fly { animation: ob-sig .85s cubic-bezier(.45,.05,.4,1) both; }
  @keyframes ob-sig { 0% { offset-distance: 0%; opacity: 0; transform: scale(.3); } 20% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; transform: scale(.6); } }
  .ob-pf { position: absolute; left: 412px; top: 20px; width: 236px; padding: 8px; border-radius: 14px; text-align: left; background: rgba(22,20,32,.92); box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 20px 50px rgba(0,0,0,.55), 0 0 34px rgba(var(--ob-rgb),.22); }
  .ob-pf .hd { display: flex; align-items: center; gap: 8px; padding: 5px 6px; font-weight: 600; font-size: 13px; }
  .ob-pf .hd b { flex: 1; }
  .ob-pf .hd em { min-width: 20px; padding: 0 6px; border-radius: 10px; font: 600 11px/20px inherit; font-style: normal; font-size: 11px; line-height: 20px; text-align: center; background: var(--ob-accent); }
  .ob-pf ul { list-style: none; margin: 2px 0 0 14px; padding: 0 0 0 8px; border-left: 1px dashed rgba(255,255,255,.25); }
  .ob-pf li { display: flex; align-items: center; gap: 8px; height: 0; padding: 0 6px; overflow: hidden; border-radius: 8px; font-size: 12px; opacity: 0; transform: translateX(-10px); transition: height .3s ease, opacity .3s ease, transform .3s cubic-bezier(.2,1.2,.4,1), background-color .2s; }
  .ob-pf li.show { height: 26px; opacity: 1; transform: none; }
  .ob-pf li.sel { background: rgba(var(--ob-rgb),.5); }
  .ob-pf li i { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--c); }
  .ob-pf li span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ob-pf li small { opacity: .55; }
  .ob-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .ob-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; font-size: 12.5px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); }
  .ob-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #2fd4a0; box-shadow: 0 0 6px #2fd4a0; }

  /* And also: small feature tiles. */
  .ob-more { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ob-tile { padding: 13px 14px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); transition: transform .35s cubic-bezier(.3,1.4,.5,1), background .3s, border-color .3s; }
  .ob-tile:hover { transform: translateY(-3px); background: rgba(255,255,255,.06); border-color: rgba(var(--ob-rgb),.4); }
  .ob-tile .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: rgba(var(--ob-rgb),.16); color: var(--ob-accent); margin-bottom: 9px; filter: brightness(1.3); }
  .ob-tile b { display: block; font-size: 13.5px; font-weight: 600; }
  .ob-tile span { font-size: 12px; opacity: .6; line-height: 1.35; display: block; margin-top: 2px; }
  .entering .ob-more .ob-tile { animation: ob-up .5s cubic-bezier(.2,.85,.25,1) calc(.15s + var(--i) * 50ms) both; }

  /* Import: the bookmarks fly into the hole. */
  .ob-imp { position: relative; width: 310px; height: 170px; }
  .ob-src { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
  .ob-mono { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); flex: none; }
  .ob-imp .ob-bh { position: absolute; right: 18px; top: 50%; margin-top: -32px; --s: 64px; }
  .ob-fly { position: absolute; left: 30px; top: 50%; padding: 3px 8px; font-size: 10.5px; border-radius: 6px; background: rgba(255,255,255,.1); white-space: nowrap; opacity: 0; offset-path: path("M 0 0 C 100 -70 180 60 250 0"); offset-rotate: 0deg; }
  .ob-imp.run .ob-fly { animation: ob-intake 1.1s cubic-bezier(.5,0,.8,.6) var(--delay) infinite; }
  @keyframes ob-intake { 0% { offset-distance: 0%; opacity: 0; transform: scale(1); } 15% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; transform: scale(.2); } }
  .ob-srcs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-height: 112px; overflow-y: auto; }
  .ob-opt { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-radius: 10px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); cursor: pointer; text-align: left; transition: background .2s, border-color .2s; min-width: 0; }
  .ob-opt:hover { background: rgba(255,255,255,.06); }
  .ob-opt[aria-checked="true"] { border-color: rgba(var(--ob-rgb),.7); background: rgba(var(--ob-rgb),.16); }
  .ob-rad { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.35); flex: none; display: grid; place-items: center; }
  .ob-opt[aria-checked="true"] .ob-rad { border-color: var(--ob-accent); }
  .ob-opt[aria-checked="true"] .ob-rad::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ob-accent); }
  .ob-opt .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ob-opt b { font-weight: 500; font-size: 13.5px; } .ob-opt small { font-size: 12px; opacity: .55; }

// ---- Steps ---------------------------------------------------------------------------------
// `g` groups the progress dots; `form` folds the illustration away, `slim` keeps a short one.
const STEPS = {

  spaces: { g: 'tour', vis: visSpaces, eye: 'spaces_eyebrow', title: 'spaces_title', text: 'spaces_text' },

  shields: { g: 'tour', vis: visShields, eye: 'shields_eyebrow', title: 'shields_title', text: 'shields_text', body: bodyShields },
  pulsars: { g: 'tour', vis: visPulsars, eye: 'pulsars_eyebrow', title: 'pulsars_title', text: 'pulsars_text', body: bodyPulsars },
  more: { g: 'tour', form: true, eye: 'more_eyebrow', title: 'more_title', text: 'more_text', body: bodyMore, next: () => (S.mode === 'tour' ? 'finish_tour' : 'next') },
  import: { g: 'import', form: true, slim: true, vis: visImport, eye: 'import_eyebrow', title: 'import_title', text: 'import_text', body: bodyImport,
    next: () => (S.src && !S.done[S.src] ? 'import_go' : 'next'), skip: 'later',
    sig: () => [S.d.sources.length, S.d.imports, S.d.importMsg, S.importing, S.src, Object.keys(S.done)] },
  default: { g: 'default', form: true, slim: true, vis: visDefault, eye: 'default_eyebrow', title: 'default_title', text: 'default_text', body: bodyDefault,
    next: () => (S.d.defaultBrowser.is || !S.d.defaultBrowser.can ? 'next' : S.d.os === 'windows' ? 'default_open' : 'default_set'), skip: 'not_now',
    sig: () => [S.d.defaultBrowser.is, S.d.defaultBrowser.asked, S.d.defaultBrowser.can], visSig: () => S.d.defaultBrowser.is },
  ext: { g: 'ext', form: true, eye: 'ext_eyebrow', title: 'ext_title', text: 'ext_text', body: bodyExt, skip: 'later',
    next: () => { if (installing()) return 'ext_installing'; const n = wanted().length; return n ? ['ext_install', n] : 'next'; },
    sig: () => [JSON.stringify(S.d.extensions), JSON.stringify(S.ext)] },
  style: { g: 'style', form: true, eye: 'style_eyebrow', title: 'style_title', text: 'style_text', body: bodyStyle,
    sig: () => [S.d.color, S.d.engine, S.d.recall, S.depth] },
  ready: { g: 'ready', ready: true, vis: () => visHello(false), eye: 'ready_eyebrow', title: 'ready_title', body: bodyReady, next: () => 'go' },
};
function order() {
  const tour = ['hello', 'spaces', 'command', 'shields', 'pulsars', 'more'];
  if (S.mode !== 'welcome') return tour;
  const list = [...tour, 'import'];
  if (S.d.os !== 'linux') list.push('default');
  if (S.d.extensions.length) list.push('ext');
  return [...list, 'style', 'ready'];
}
// Profiles imported during the tour (one import each); extensions ticked and not there yet.
const imported = () => Object.keys(S.done).length > 0;
const wanted = () => S.d.extensions.filter((e) => S.ext[e.id] && !e.installed && !e.installing);

let S = null;
let life = [];
const stopLife = () => { life.forEach(clearInterval); life = []; };
const val = (v) => (typeof v === 'function' ? v() : v);

function build(id) {
  const st = STEPS[id], el = h('div', 'ob-step' + (st.form ? ' form' : '') + (st.slim ? ' slim' : '') + (st.ready ? ' ready' : ''));
  const vis = h('div', 'ob-vis'); if (st.vis) vis.append(st.vis());

  txt.append(h('div', 'ob-eye', T(st.eye)), h('h2', null, title, { id: 'ob-title' }));

}
function chrome() {

  const label = Array.isArray(next) ? bhTn('onboarding.' + next[0], next[1]) : T(next);

  $('ob-back').hidden = S.i === 0;

  // later; the style and the last step have nothing to skip.

  skip.hidden = S.i === ids.length - 1 || (choices && !st.skip);
  skip.textContent = st.skip ? T(st.skip) : S.mode === 'tour' ? T('close') : T('skip_tour');
  const prog = $('ob-prog'); prog.replaceChildren();
  ids.forEach((x, k) => {

function mount(i, entering) {

}
const sigOf = () => { const s = STEPS[order()[S.i]]; return JSON.stringify(s.sig ? s.sig() : null); };
const visSigOf = () => { const s = STEPS[order()[S.i]]; return JSON.stringify(s.visSig ? s.visSig() : S.importing); };
// New data from the shell: only the parts of the current step that depend on it are rebuilt

function refresh(force) {

  const sig = sigOf(), visSig = visSigOf(), st = STEPS[order()[S.i]];

function go(i) {

  if (calm()) { mount(i, false); focusNext(); return; }
  S.busy = true;
  const w = $('ob-warp'), old = $('ob-stage').firstElementChild;
  if (old) old.classList.add('leaving');
  w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');

  setTimeout(() => { w.classList.remove('go'); S.busy = false; focusNext(); }, 960);

function finish() {

// The primary button acts on the step's choice before moving on.
function next() {
  if (!S || S.busy) return;

    refresh(true); return;
  }
  if (id === 'default' && !S.d.defaultBrowser.is && S.d.defaultBrowser.can && !S.d.defaultBrowser.asked) { askDefault(); return; }
  if (id === 'ext' && installing()) return;
  if (id === 'ext' && wanted().length) {

    for (const e of wanted()) send({ cmd: 'install_catalog', id: e.id });
    return;

function keys(e) {

  else if (e.key === 'Enter' && !onControl) { e.preventDefault(); e.stopPropagation(); next(); }
  else if (e.key === 'ArrowRight' && !onControl) { e.preventDefault(); go(S.i + 1); }
  else if (e.key === 'ArrowLeft' && !onControl) { e.preventDefault(); go(S.i - 1); }
  else if (e.key === 'Tab') {
    // Focus stays in the dialog.
    const all = [...$('ob').querySelectorAll('button:not([hidden])')].filter((b) => b.offsetParent);
    if (!all.length) return;
    const at = all.indexOf(document.activeElement);
    if (e.shiftKey && at <= 0) { e.preventDefault(); all[all.length - 1].focus(); }

$('ob-next').onclick = next;
$('ob-back').onclick = () => go(S && S.i - 1);
$('ob-skip').onclick = skip;

addEventListener('resize', fit);

function open() {

// Called by the start page's render with the shell's state (`onboarding`, null once closed).
window.bhOnboard = {
  update(d, s) {
    if (!d) {
      if (S && S.shown && !S.busy) { stopLife(); $('ob').hidden = true; $('ob').classList.remove('on'); $('ob-veil').classList.remove('on'); removeEventListener('keydown', keys, true); S = null; }
      return;

    if (S && S.mode !== d.mode) { stopLife(); S = null; $('ob').hidden = true; }
    $('ob').style.setProperty('--ob-accent', data.color || '#7c5cff');
    $('ob').style.setProperty('--ob-rgb', rgb(data.color));
    if (!S) {
      S = { mode: d.mode, d: data, i: 0, busy: false, shown: false, ext: {}, src: data.sources.length ? data.sources[0].id : null,
        importing: false, done: {}, importBase: 0, depth: s.depth !== false };
      for (const e of data.extensions) S.ext[e.id] = e.on || e.installed;

      setTimeout(open, wait ? wait + 350 : 120);

    S.depth = s.depth !== false;

};
