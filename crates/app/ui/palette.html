<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --accent: #7c5cff; --sel: rgba(124,92,255,.85); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; color: #eceaf5; user-select: none; -webkit-user-select: none; }
  #scrim { position: fixed; inset: 0; background: rgba(6,5,12,.46); display: none; }
  body.open #scrim { display: block; animation: fade .14s ease-out both; }
  /* Opening is a soft spring: the panel grows out of a blob (squash, overshoot, settle) while
     a warm glow blooms behind it and ripples fade outwards. Rows rise in one after another. */
  #hole { position: absolute; inset: 0; display: none; place-items: center; pointer-events: none; overflow: hidden; }
  #hole i { position: relative; width: min(62vmin, 470px); aspect-ratio: 1; border-radius: 52% 48% 55% 45% / 48% 56% 44% 52%;
    background: radial-gradient(circle, #000 0 26%, rgba(255,150,50,.8) 31%, rgba(124,92,255,.32) 46%, transparent 66%); }
  #hole i::before { content: ""; position: absolute; inset: 15%; border-radius: 50%; border: 3px solid transparent;
    border-top-color: rgba(255,200,110,.85); border-right-color: rgba(124,92,255,.65); }
  #hole::before, #hole::after { content: ""; position: absolute; left: 50%; top: 19vh; width: 360px; height: 120px; margin-left: -180px; border-radius: 50%;
    border: 1.5px solid rgba(167,139,255,.55); opacity: 0; }
  body.intro #hole { display: grid; }
  body.intro #hole i { animation: bloom .6s cubic-bezier(.3,.1,.2,1) both; }
  body.intro #hole i::before { animation: swirl .6s cubic-bezier(.3,.1,.3,1) both; }
  body.intro #hole::before { animation: ripple .55s cubic-bezier(.2,.6,.3,1) .04s both; }
  body.intro #hole::after { animation: ripple .6s cubic-bezier(.2,.6,.3,1) .14s both; }
  @keyframes bloom {
    0%   { transform: scale(.12) rotate(0); opacity: 0; filter: blur(8px); border-radius: 50%; }
    30%  { transform: scale(.9) rotate(50deg); opacity: 1; filter: blur(0); border-radius: 56% 44% 48% 52% / 46% 58% 42% 54%; }
    55%  { transform: scale(1.04) rotate(95deg); opacity: .95; border-radius: 47% 53% 57% 43% / 55% 45% 55% 45%; }
    100% { transform: scale(1.9) rotate(150deg); opacity: 0; filter: blur(16px); border-radius: 50%; }
  }
  @keyframes swirl { to { transform: rotate(400deg); } }
  @keyframes ripple { 0% { transform: scale(.35); opacity: 0; } 20% { opacity: .8; } 100% { transform: scale(2.6); opacity: 0; } }
  #panel { position: absolute; left: 50%; top: 19vh; width: min(640px, calc(100vw - 48px)); transform: translateX(-50%); transform-origin: 50% 0;
    background: rgba(27,26,38,.96); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4), 0 0 70px -20px var(--accent); }
  body.pre #panel { opacity: 0; }
  body.pop #panel { animation: spring .38s linear both; animation-timing-function: cubic-bezier(.22,.9,.28,1); }
  body.pop .row { animation: rowin .26s cubic-bezier(.2,.9,.3,1) both; animation-delay: calc(var(--i, 0) * 14ms + 50ms); }
  body.pop .search svg { animation: pulse .4s cubic-bezier(.3,1.6,.5,1) .06s both; }
  @keyframes fade { from { opacity: 0 } }
  @keyframes spring {
    0%   { opacity: 0; transform: translateX(-50%) translateY(-16px) scale(.84, .62); border-radius: 46px; filter: blur(10px); }
    38%  { opacity: 1; transform: translateX(-50%) translateY(4px) scale(1.028, 1.04); border-radius: 24px; filter: blur(0); }
    62%  { transform: translateX(-50%) translateY(-2px) scale(.993, .988); border-radius: 17px; }
    82%  { transform: translateX(-50%) translateY(.6px) scale(1.002, 1.002); border-radius: 18px; }
    100% { opacity: 1; transform: translateX(-50%); border-radius: 18px; filter: none; }
  }
  @keyframes rowin { from { opacity: 0; transform: translateY(10px) scale(.97); } }
  @keyframes pulse { 0% { transform: scale(.4) rotate(-40deg); opacity: 0; } 100% { transform: none; opacity: .7; } }
  .search { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .search svg { flex: none; opacity: .7; }
  #q { flex: 1; min-width: 0; font: inherit; font-size: 18px; color: inherit; background: transparent; border: 0; outline: none; user-select: text; -webkit-user-select: text; }
  #q::placeholder { color: rgba(236,234,245,.4); }
  #list { padding: 8px; max-height: 52vh; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; cursor: pointer; min-width: 0; }
  .row.sel { background: var(--sel); color: #fff; }
  .ico { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
  .ico.glyph { background: color-mix(in srgb, var(--accent, #7c5cff) 22%, transparent); color: #c9bcff; }
  .row.sel .ico.glyph { background: rgba(255,255,255,.22); color: #fff; }
  .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { opacity: .55; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .row.sel .s { opacity: .8; }
  .row.armed .s, .row.armed.sel .s { color: #ffb3b3; opacity: 1; }
  .grow { flex: 1; }
  .hint { flex: none; font-size: 12.5px; opacity: .6; display: flex; align-items: center; gap: 8px; }
  .row.sel .hint { opacity: .95; }
  .chip { width: 24px; height: 24px; border-radius: 7px; display: none; place-items: center; background: rgba(255,255,255,.2); }
  .row.sel .chip { display: grid; }
  .none { padding: 18px; text-align: center; opacity: .5; }
  .foot { display: flex; gap: 16px; padding: 9px 18px; border-top: 1px solid rgba(255,255,255,.07); font-size: 12px; opacity: .5; }
  kbd { font: inherit; padding: 0 5px; border-radius: 5px; background: rgba(255,255,255,.12); }

  /* Context menu (anchored at the click, clamped inside the window) */
  #menu { display: none; position: absolute; min-width: 190px; max-width: 280px; padding: 5px; border-radius: 13px; transform-origin: var(--ox, 0) var(--oy, 0);
    background: rgba(30,29,42,.97); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.35); }
  body.menuing #menu { display: block; animation: menuin .22s cubic-bezier(.2,1.2,.35,1) both; }
  body.menuing #panel { display: none; }
  body.menuing #scrim { background: transparent; animation: none; }
  @keyframes menuin { from { opacity: 0; transform: scale(.88); } }
  #menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 7px 10px; border: 0; border-radius: 8px; background: transparent; color: inherit; font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  #menu button:hover { background: var(--sel); color: #fff; }
  #menu button.danger { color: #ff8a8a; }
  #menu button.danger:hover { background: rgba(255,90,90,.85); color: #fff; }
  #menu button .mi { width: 18px; height: 18px; display: grid; place-items: center; flex: none; opacity: .85; }
  #menu button.armed { background: rgba(255,90,90,.85); color: #fff; }
  #menu button .mi.sw { width: 16px; height: 16px; margin: 0 1px; border-radius: 50%; background: var(--sw); color: #fff; opacity: 1; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  #menu button .mi.sw svg { --bh-icon-stroke: 2px; }
  #menu .msep { height: 1px; margin: 4px 6px; background: rgba(255,255,255,.1); }
  #menu .mhead { padding: 5px 10px 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .45; }

  /* Boost editor */
  #boost { display: none; padding: 18px 20px 14px; }
  body.boosting #boost { display: block; }
  body.boosting .search, body.boosting #list, body.boosting .foot { display: none; }
  #boost h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  #boost p { font-size: 12.5px; opacity: .55; margin-bottom: 12px; }
  #css { width: 100%; height: 170px; resize: none; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; color: inherit; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 10px 12px; outline: none; user-select: text; -webkit-user-select: text; }
  #css:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .btn { font: inherit; font-size: 13px; color: inherit; border: 0; cursor: pointer; border-radius: 9px; padding: 6px 12px; background: rgba(255,255,255,.1); }
  .btn:hover { background: rgba(255,255,255,.18); }
  .btn.primary { background: var(--accent); color: #fff; }
  /* Tab comparator: the products of the open tabs side by side. */
  #compare { display: none; padding: 16px 18px 14px; }
  body.comparing #compare { display: block; }
  body.comparing .search, body.comparing #list, body.comparing .foot { display: none; }
  body.comparing #panel { width: min(1000px, calc(100vw - 48px)); top: 10vh; }
  #compare h2 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
  #cpick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  #cpick label { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,.07); font-size: 12.5px; cursor: pointer; max-width: 260px; }
  #cpick label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cwrap { max-height: 62vh; overflow: auto; }
  #ctable { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  #ctable th, #ctable td { text-align: left; padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; overflow-wrap: anywhere; }
  #ctable th { font-weight: 600; cursor: pointer; }
  #ctable th:hover { color: #fff; text-decoration: underline; }
  #ctable td:first-child, #ctable th:first-child { width: 150px; opacity: .6; font-weight: 500; cursor: default; text-decoration: none; }
  #ctable .best { color: #6ee7a8; font-weight: 600; }
  #ctable small { display: block; opacity: .55; font-weight: 400; }
  /* HTTP authentication (a NAS, a router): the server asks for a user name and password. */
  #auth { display: none; padding: 18px 20px 16px; }
  body.authing #auth { display: block; }
  body.authing .search, body.authing #list, body.authing .foot { display: none; }
  #auth h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; overflow-wrap: anywhere; }
  #auth p { font-size: 12.5px; opacity: .6; overflow-wrap: anywhere; }
  #auth p.warn { opacity: 1; color: #ffb86b; margin-top: 6px; }
  #auth p:empty { display: none; }
  #auth label { display: block; font-size: 12.5px; opacity: .7; margin: 12px 0 5px; }
  #auth input { width: 100%; font: inherit; font-size: 14px; color: inherit; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 9px; padding: 7px 10px; outline: none; user-select: text; -webkit-user-select: text; }
  #auth input:focus { border-color: var(--accent); }
  /* Emoji picker */
  #emoji { display: none; padding: 18px 20px 16px; }
  body.picking #emoji { display: block; }
  body.picking .search, body.picking #list, body.picking .foot { display: none; }
  #emoji h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  #grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-bottom: 12px; }
  #grid button { font-size: 22px; line-height: 1; padding: 7px 0; border: 0; border-radius: 9px; background: transparent; cursor: pointer; }
  #grid button:hover, #grid button.cur { background: rgba(255,255,255,.14); }
  #eq { flex: 1; min-width: 0; font: inherit; font-size: 15px; color: inherit; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 9px; padding: 6px 10px; outline: none; user-select: text; -webkit-user-select: text; }
  #eq:focus { border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
</style>
</head>
<body>
<div id="scrim">
  <div id="menu"></div>
  <div id="hole"><i></i></div>
  <div id="panel">
    <div class="search">
      <i data-icon="search" data-size="md"></i>
      <input id="q" placeholder="Search or enter URL…" spellcheck="false" autocomplete="off">
    </div>
    <div id="list"></div>
    <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
    <div id="emoji">
      <h2>Icon · <span id="ename"></span></h2>
      <div id="grid"></div>
      <div class="actions" style="margin-top:0"><input id="eq" placeholder="Type or paste an emoji" spellcheck="false" autocomplete="off"><button class="btn" id="eclear">Remove</button><button class="btn primary" id="eok">Apply</button></div>
    </div>
    <div id="compare">
      <h2>Compare tabs</h2>
      <div id="cpick"></div>
      <div id="cwrap"><table id="ctable"></table></div>
    </div>
    <form id="auth" autocomplete="off">
      <h2>Sign in · <span id="ahost"></span></h2>
      <p id="arealm"></p>
      <p id="awarn" class="warn"></p>
      <label for="auser">User name</label>
      <input id="auser" spellcheck="false" autocomplete="off" autocapitalize="off">
      <label for="apass">Password</label>
      <input id="apass" type="password" autocomplete="off">
      <div class="actions"><button type="button" class="btn" id="acancel">Cancel</button><button type="submit" class="btn primary" id="aok">Sign in</button></div>
    </form>
    <div id="boost">
      <h2>Boost · <span id="bhost"></span></h2>
      <p>CSS applied to every page of this site. Leave empty to remove the Boost.</p>
      <div class="chips" id="presets"></div>
      <textarea id="css" spellcheck="false" placeholder="body { font-size: 18px; }"></textarea>
      <div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Save</button></div>
    </div>
  </div>
</div>
<script>
// The list navigation below uses Ctrl+N, so it must not open a window from here.
window.keepCtrlN = true;
const $ = (id) => document.getElementById(id);
const send = (m) => window.ipc.postMessage(JSON.stringify(m));
const PRESETS = {
  'Dark mode': 'html { filter: invert(1) hue-rotate(180deg); }\nimg, video, picture, canvas, svg { filter: invert(1) hue-rotate(180deg); }',
  'Bigger text': 'html { zoom: 1.15; }',
  'Narrow column': 'body { max-width: 860px; margin: 0 auto !important; }',
  'Hide sticky bars': '[style*="position: fixed"], [style*="position:fixed"] { display: none !important; }',
};
let S = { mode: 'new', tabs: [], favorites: [], bookmarks: [], recent: [], actions: [] };
let items = [], sel = 0, pristine = true, target = null;
const EMOJIS = ['🏠','💼','🎮','📚','🎓','🛒','💰','🎵','🎬','📷','✈️','🍳','🧪','💻','🛠️','🎨','📰','🔒','❤️','⭐','🚀','🌍','🔥','🌱','☕','🧠','📁','📌','🗂️','🧩','🎯','💡','🧳','🏋️','🐱','🐶','🌙','☀️','🍀','🎁'];

const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return 'hsl(' + h + ',60%,50%)'; };
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const looksLikeUrl = (q) => /^https?:\/\//i.test(q) || (!/\s/.test(q) && /\./.test(q) && !q.startsWith('.') && !q.endsWith('.'));

function site(url, title, hint, run) {
  const h = host(url);
  return { letter: (h[0] || '•').toUpperCase(), color: hue(h), title, sub: h, hint, run };
}

function build() {
  const raw = $('q').value.trim();
  const q = pristine ? '' : raw;
  const ql = q.toLowerCase();
  const out = [];
  const enter = (input) => send({ cmd: S.mode === 'url' ? 'navigate' : 'open', input });
  if (q) {
    out.push(looksLikeUrl(q)
      ? { glyph: 'go', title: q, sub: 'Go to site', hint: 'Open', run: () => enter(q) }
      : { glyph: 'search', title: q, sub: 'Search with ' + S.engine, hint: 'Search', run: () => enter(q) });
  }
  const match = (...f) => !q || f.some(v => (v || '').toLowerCase().includes(ql));
  const seen = new Set();
  for (const t of S.tabs) {
    if (!match(t.title, t.url)) continue;
    seen.add(t.url);
    out.push(site(t.url, t.title || host(t.url), 'Switch to tab', () => send({ cmd: 'activate', id: t.id })));
  }
  const pool = q ? [...S.favorites, ...(S.bookmarks || []), ...S.recent] : S.favorites;
  for (const e of pool) {
    if (seen.has(e.url) || !match(e.title, e.name, e.url)) continue;
    seen.add(e.url);
    out.push(site(e.url, e.title || e.name || host(e.url), host(e.url), () => enter(e.url)));
  }
  for (const a of S.actions) {
    if (!match(a.label)) continue;
    out.push({
      glyph: 'bolt', title: a.label, sub: '', hint: a.keys ? bhKeys(a.keys) : a.hint || 'Action',
      confirm: a.confirm, id: 'action:' + a.id, run: () => send({ cmd: 'action', id: a.id }),
    });
  }
  return out.slice(0, q ? 9 : 10);
}
// An action that cannot be undone asks for a second Enter / click; it shows what will happen.
let armed = null;

function draw() {
  items = build();
  sel = Math.min(sel, Math.max(0, items.length - 1));
  const rows = items.map((it, i) => {
    const r = document.createElement('div');
    r.className = 'row' + (i === sel ? ' sel' : '');
    r.style.setProperty('--i', i);
    const ico = document.createElement('span');
    if (it.glyph) { ico.className = 'ico glyph'; ico.append(bhIcon(it.glyph)); }
    else { ico.className = 'ico'; ico.textContent = it.letter; ico.style.background = it.color; }
    const t = document.createElement('span'); t.className = 't'; t.textContent = it.title;
    const s = document.createElement('span'); s.className = 's'; s.textContent = armed && armed === it.id ? it.confirm : it.sub;
    if (armed && armed === it.id) r.classList.add('armed');
    const g = document.createElement('span'); g.className = 'grow';
    const h = document.createElement('span'); h.className = 'hint';
    h.append(it.hint);
    const chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = '→';
    h.append(chip);
    r.append(ico, t, s, g, h);
    r.onmousemove = () => { if (sel !== i) { sel = i; mark(); } };
    r.onclick = () => run(i);
    return r;
  });
  if (!rows.length) { const n = document.createElement('div'); n.className = 'none'; n.textContent = 'No results'; rows.push(n); }
  $('list').replaceChildren(...rows);
}

function mark() {
  [...$('list').children].forEach((r, i) => r.classList.toggle('sel', i === sel));
  const cur = $('list').children[sel];
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
}

function run(i) {
  const it = items[i];
  if (!it) return;
  if (it.confirm && armed !== it.id) { armed = it.id; draw(); return; }
  armed = null;
  it.run();
}
const close = () => send({ cmd: 'palette_close' });

function applyIcon(icon) {
  if (!target) return;
  send({ cmd: target.kind === 'space' ? 'set_space_icon' : 'set_folder_icon', id: target.id, icon });
  close();
}

// Menu icons: a menu item names one of ui/icons.js (`icon: 'trash'`), drawn the same on every
// system (emoji are not); anything else (a space's emoji) is shown as text.
// `color` draws a swatch (space colors), with the icon (a check mark) on top of it.
function menuIcon(name, color) {
  const ic = document.createElement('span');
  ic.className = 'mi' + (color ? ' sw' : '');
  if (color) ic.style.setProperty('--sw', color);
  if (bhIcons.has(name)) ic.append(bhIcon(name, color ? 'xs' : 'sm'));
  else ic.textContent = name || '';
  return ic;
}
// Shell pages have no secure origin for navigator.clipboard: the copy command still works.
function copyText(text) {
  const area = document.createElement('textarea');
  area.value = text;
  area.style.cssText = 'position:fixed;opacity:0';
  document.body.append(area);
  area.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  area.remove();
  return ok;
}

function showMenu(m) {
  const box = $('menu');
  box.replaceChildren(...m.items.map(it => {
    if (it.sep) return Object.assign(document.createElement('div'), { className: 'msep' });
    if (it.head) return Object.assign(document.createElement('div'), { className: 'mhead', textContent: it.head });
    const b = document.createElement('button');
    if (it.danger) b.className = 'danger';
    const label = document.createElement('span');
    label.textContent = it.label;
    b.append(menuIcon(it.icon, it.color), label);
    // `confirm`: the first click only arms the item and says what will be lost.
    // `background`: what Ctrl/Cmd+click or a middle click runs instead (a tab behind, like a link).
    if (it.background) {
      b.onmousedown = (e) => { if (e.button === 1) e.preventDefault(); };
      b.onauxclick = (e) => { if (e.button === 1) { e.preventDefault(); close(); send(it.background); } };
    }
    b.onclick = (e) => {
      if (it.copy != null) {
        label.textContent = copyText(it.copy) ? 'Copied' : 'Could not copy';
        setTimeout(close, 450);
        return;
      }
      if (it.background && (bhMac ? e.metaKey : e.ctrlKey)) {
        close();
        send(it.background);
        return;
      }
      if (it.confirm && !b.classList.contains('armed')) {
        b.classList.add('armed');
        label.textContent = it.confirm;
        return;
      }
      close();
      if (it.run) send(it.run);
    };
    return b;
  }));
  box.style.left = '0px'; box.style.top = '0px';
  const w = box.offsetWidth, h = box.offsetHeight;
  const x = Math.max(8, Math.min(m.x, innerWidth - w - 8)), y = Math.max(8, Math.min(m.y, innerHeight - h - 8));
  box.style.left = x + 'px'; box.style.top = y + 'px';
  box.style.setProperty('--ox', (m.x > x ? '100%' : '0'));
  box.style.setProperty('--oy', (m.y > y ? '100%' : '0'));
}

// The tab comparator: pick the pages (products found are picked first, five at most), then
// one column per page and one row per field; the lowest price and the best rating stand out.
// Page data only ever goes in through textContent.
let cmpItems = [], cmpPicked = new Set();
const cmpNum = (v) => { const n = parseFloat(String(v || '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };
function showCompare(c) {
  cmpItems = (c && c.items) || [];
  const products = cmpItems.filter(i => i.price || i.rating);
  cmpPicked = new Set((products.length >= 2 ? products : cmpItems).slice(0, 5).map(i => i.id));
  $('cpick').replaceChildren(...cmpItems.map(i => {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = cmpPicked.has(i.id);
    box.onchange = () => { box.checked ? cmpPicked.add(i.id) : cmpPicked.delete(i.id); drawCompare(); };
    const name = document.createElement('span');
    name.textContent = i.name || i.title || host(i.url);
    label.append(box, name);
    return label;
  }));
  drawCompare();
}
function drawCompare() {
  const cols = cmpItems.filter(i => cmpPicked.has(i.id));
  const cell = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text || '—'; if (cls) e.className = cls; return e; };
  const head = document.createElement('tr');
  head.append(cell('th', ''));
  for (const i of cols) {
    const th = cell('th', i.name || i.title || host(i.url));
    const sub = document.createElement('small');
    sub.textContent = host(i.url);
    th.append(sub);
    th.title = 'Show this tab';
    th.onclick = () => { send({ cmd: 'activate', id: i.id }); close(); };
    head.append(th);
  }
  const prices = cols.map(i => cmpNum(i.price)), ratings = cols.map(i => cmpNum(i.rating));
  const low = Math.min(...prices.filter(n => n != null)), high = Math.max(...ratings.filter(n => n != null));
  const rows = [
    ['Price', (i) => i.price ? `${i.price} ${i.currency || ''}`.trim() : '', (i, k) => prices[k] === low && cols.length > 1],
    ['Rating', (i) => i.rating, (i, k) => ratings[k] === high && cols.length > 1],
    ['Reviews', (i) => i.reviews],
    ['Brand', (i) => i.brand],
    ['Availability', (i) => i.availability],
  ];
  // Specifications shared by at least two pages (or all of them when only one has some).
  const counts = new Map();
  for (const i of cols) for (const k of Object.keys(i.specs || {})) counts.set(k, (counts.get(k) || 0) + 1);
  const shared = [...counts].filter(([, n]) => n >= Math.min(2, cols.length)).sort((a, b) => b[1] - a[1]).slice(0, 15);
  for (const [k] of shared) rows.push([k, (i) => (i.specs || {})[k]]);
  const body = rows
    .filter(([, get]) => cols.some(i => get(i)))
    .map(([name, get, best]) => {
      const tr = document.createElement('tr');
      tr.append(cell('td', name));
      cols.forEach((i, k) => tr.append(cell('td', get(i), best && best(i, k) ? 'best' : '')));
      return tr;
    });
  if (!cols.length) {
    const tr = document.createElement('tr');
    tr.append(cell('td', 'Pick the tabs to compare'));
    body.push(tr);
  }
  $('ctable').replaceChildren(head, ...body);
}

function saveBoost() { send({ cmd: 'save_boost', css: $('css').value }); }

// The server's text (host, realm) is shown with textContent only. The password is cleared as
// soon as it is sent and never kept by this page.
let authId = null;
function showAuth(a) {
  const fresh = authId !== a.id;
  authId = a.id;
  $('ahost').textContent = a.host;
  $('arealm').textContent = a.realm ? 'The site says: “' + a.realm + '”' : '';
  const warn = [];
  if (a.retry) warn.push('Wrong user name or password. Try again.');
  if (!a.secure) warn.push('This connection is not secure: the password is sent in clear text.');
  $('awarn').textContent = warn.join(' ');
  $('apass').value = '';
  if (fresh && !a.retry) $('auser').value = '';
  ($('auser').value ? $('apass') : $('auser')).focus();
}
function clearAuth() { $('apass').value = ''; $('apass').blur(); $('auser').blur(); }

window.bh = {
  save: saveBoost,
  open(s) {
    S = s;
    armed = null;
    const root = document.documentElement.style;
    root.setProperty('--accent', s.color);
    root.setProperty('--sel', rgba(s.color, .85));
    document.body.classList.add('open');
    const authing = s.mode === 'auth' && !!s.auth;
    document.body.classList.toggle('authing', authing);
    if (authing) {
      document.body.classList.remove('menuing', 'comparing', 'boosting', 'picking', 'intro', 'pop', 'pre');
      showAuth(s.auth);
      return;
    }
    const menuing = s.mode === 'menu';
    document.body.classList.toggle('menuing', menuing);
    if (menuing) { showMenu(s.menu); return; }
    const comparing = s.mode === 'compare';
    document.body.classList.toggle('comparing', comparing);
    if (comparing) { showCompare(s.compare); return; }
    const boosting = s.mode === 'boost';
    const picking = s.mode === 'emoji';
    document.body.classList.toggle('boosting', boosting);
    document.body.classList.toggle('picking', picking);
    if (picking) {
      target = s.target;
      $('ename').textContent = (target.kind === 'space' ? 'Space ' : 'Folder ') + target.name;
      $('eq').value = target.icon || '';
      [...$('grid').children].forEach(b => b.classList.toggle('cur', b.textContent === target.icon));
      $('eq').focus();
      return;
    }
    if (boosting) {
      $('bhost').textContent = s.boostHost;
      $('css').value = s.boost || '';
      $('css').focus();
      return;
    }
    document.body.classList.remove('intro', 'pop');
    document.body.classList.toggle('pre', !!s.animations);
    if (s.animations) {
      // Two frames so the animation clock is fresh after the view was hidden.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        document.body.classList.remove('pre');
        document.body.classList.add('pop');
        if (s.mode === 'new') document.body.classList.add('intro');
        setTimeout(() => document.body.classList.remove('intro', 'pop'), 800);
      }));
    }
    pristine = s.mode === 'url';
    $('q').value = s.mode === 'url' ? s.url : '';
    sel = 0;
    draw();
    $('q').focus();
    if (pristine) $('q').select();
  },
  hide() { document.body.classList.remove('open', 'boosting', 'picking', 'intro', 'pop', 'pre', 'menuing', 'comparing', 'authing'); $('q').blur(); $('eq').blur(); clearAuth(); },
};

$('q').addEventListener('input', () => { pristine = false; sel = 0; armed = null; draw(); });
document.addEventListener('keydown', (e) => {
  if (!document.body.classList.contains('open')) return;
  if (e.key === 'Escape') { e.preventDefault(); close(); return; }
  if (document.body.classList.contains('menuing') || document.body.classList.contains('comparing')) return;
  if (document.body.classList.contains('authing')) return;
  if (document.body.classList.contains('picking')) {
    if (e.key === 'Enter') { e.preventDefault(); applyIcon($('eq').value); }
    return;
  }
  if (document.body.classList.contains('boosting')) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveBoost(); }
    return;
  }
  if (e.key === 'ArrowDown' || (e.ctrlKey && e.key === 'n')) { e.preventDefault(); sel = (sel + 1) % Math.max(1, items.length); mark(); }
  else if (e.key === 'ArrowUp' || (e.ctrlKey && e.key === 'p')) { e.preventDefault(); sel = (sel - 1 + items.length) % Math.max(1, items.length); mark(); }
  else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
});
$('scrim').addEventListener('mousedown', (e) => { if (e.target === $('scrim')) close(); });
$('cancel').onclick = close;
$('auth').addEventListener('submit', (e) => {
  e.preventDefault();
  if (authId == null) return;
  send({ cmd: 'auth_answer', id: authId, user: $('auser').value, password: $('apass').value });
  clearAuth();
});
$('acancel').onclick = () => { if (authId != null) send({ cmd: 'auth_cancel', id: authId }); clearAuth(); };
$('eok').onclick = () => applyIcon($('eq').value);
$('eclear').onclick = () => applyIcon('');
$('grid').replaceChildren(...EMOJIS.map(em => {
  const b = document.createElement('button'); b.textContent = em; b.onclick = () => applyIcon(em); return b;
}));
$('save').onclick = saveBoost;
$('save').textContent = 'Save  ' + bhKeys('mod+enter');
$('eq').placeholder = 'Type or paste an emoji (' + (bhMac ? '⌃⌘Space' : 'Win+.') + ')';
$('presets').replaceChildren(...Object.entries(PRESETS).map(([name, css]) => {
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = name;
  b.onclick = () => { const cur = $('css').value.trim(); $('css').value = cur ? cur + '\n' + css : css; };
  return b;
}));
send({ cmd: 'palette_ready' });
</script>
