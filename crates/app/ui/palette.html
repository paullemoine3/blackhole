<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --accent: #7c5cff; --sel: rgba(124,92,255,.85); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; color: #eceaf5; user-select: none; -webkit-user-select: none; }
  #scrim { position: fixed; inset: 0; background: var(--bh-scrim); display: none; }
  body.open #scrim { display: block; animation: scrim-in var(--bh-duration-quick) var(--bh-ease-standard) both; }
  /* Opening is one movement, on the tokens of the design system: the panel glides down into
     place (`duration-panel`, `ease-glide`) and its rows rise after it, 14 ms apart. A new tab
     adds the black hole's own light, once: an accretion glow that swells behind the panel and
     is gone (`duration-bloom`). Nothing squashes, spins or blurs. */
  #hole { position: absolute; left: 50%; top: 19vh; width: min(calc(var(--bh-size-palette) + 180px), 100vw); height: 240px; margin-top: -92px;
    transform: translateX(-50%); display: none; pointer-events: none; }
  #hole i { position: absolute; inset: 0; border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--bh-accretion-hot) 50%, transparent), var(--bh-accent-halo) 46%, transparent); }
  body.intro #hole { display: block; }
  body.intro #hole i { animation: accretion var(--bh-duration-bloom) var(--bh-ease-glide) both; }
  @keyframes accretion {
    0%   { opacity: 0; transform: scale(.62, .4); }
    30%  { opacity: .8; }
    100% { opacity: 0; transform: scale(1.08, 1); }
  }
  #panel { position: absolute; left: 50%; top: 19vh; width: min(var(--bh-size-palette), calc(100vw - 48px)); transform: translateX(-50%); transform-origin: 50% 0;
    background: var(--bh-surface-panel); border: 1px solid var(--bh-border-default); border-radius: var(--bh-radius-dialog); overflow: hidden;
    box-shadow: var(--bh-shadow-palette); }
  body.pre #panel { opacity: 0; }
  body.pop #panel { animation: palette-in var(--bh-duration-panel) var(--bh-ease-glide) both; }
  body.pop .row { animation: row-in var(--bh-duration-quick) var(--bh-ease-glide) both; animation-delay: calc(var(--i, 0) * 14ms + 80ms); }
  @keyframes scrim-in { from { opacity: 0; } }
  @keyframes palette-in { from { opacity: 0; transform: translateX(-50%) translateY(-12px) scale(.97); } }
  @keyframes row-in { from { opacity: 0; transform: translateY(6px); } }
  /* The "animations" setting and the system's reduced motion stop all of it. */
  body.noanim *, body.noanim *::before, body.noanim *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .search { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .search svg { flex: none; opacity: .7; }
  #q { flex: 1; min-width: 0; font: inherit; font-size: 18px; color: inherit; background: transparent; border: 0; outline: none; user-select: text; -webkit-user-select: text; }
  #q::placeholder { color: rgba(236,234,245,.4); }
  #list { padding: 8px; max-height: 52vh; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; cursor: pointer; min-width: 0; }
  .row.sel { background: var(--sel); color: #fff; }
  /* Recall: the excerpt takes the room the hint leaves. */
  .row.wide .t { flex: none; max-width: 38%; }
  .row.wide .s { flex: 1; min-width: 0; }
  .row.wide .grow { display: none; }
  .ico { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
  .ico.glyph { background: color-mix(in srgb, var(--accent, #7c5cff) 22%, transparent); color: #c9bcff; }
  .row.sel .ico.glyph { background: rgba(255,255,255,.22); color: #fff; }
  .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { opacity: .55; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .row.sel .s { opacity: .8; }
  .row.armed .s, .row.armed.sel .s { color: #ffb3b3; opacity: 1; }
  .grow { flex: 1; }
  .hint { flex: none; font-size: 12.5px; opacity: .6; display: flex; align-items: center; gap: 8px; }
  .row.sel .hint { opacity: .95; }
  .chip { width: 24px; height: 24px; border-radius: 7px; display: none; place-items: center; background: rgba(255,255,255,.2); }
  .row.sel .chip { display: grid; }
  .none { padding: 18px; text-align: center; opacity: .5; }
  /* Grouped results (highlights, watched areas, Recall, archive, downloads): a quiet head per
     group, never selected. */
  .ghead { padding: 9px 10px 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .45; }
  body.pop .ghead { animation: row-in var(--bh-duration-quick) var(--bh-ease-glide) both; animation-delay: calc(var(--i, 0) * 14ms + 80ms); }
  #fkeep[hidden] { display: none; }
  .foot { display: flex; gap: 16px; padding: 9px 18px; border-top: 1px solid rgba(255,255,255,.07); font-size: 12px; opacity: .5; }
  kbd { font: inherit; padding: 0 5px; border-radius: 5px; background: rgba(255,255,255,.12); }

  /* Context menu (anchored at the click, clamped inside the window) */
  #menu { display: none; position: absolute; min-width: 190px; max-width: 280px; padding: 5px; border-radius: 13px; transform-origin: var(--ox, 0) var(--oy, 0);
    background: rgba(30,29,42,.97); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.35); }
  body.menuing #menu { display: block; animation: menuin .22s cubic-bezier(.2,1.2,.35,1) both; }
  body.menuing #panel { display: none; }
  body.menuing #scrim { background: transparent; animation: none; }
  @keyframes menuin { from { opacity: 0; transform: scale(.88); } }
  /* The rows rise one after the other behind the panel; closing fades the menu out instead of
     cutting it (`close` waits for it before the shell hides the view). */
  body.menuing #menu > * { animation: menurow .22s var(--bh-ease-glide) both; animation-delay: calc(40ms + var(--i, 0) * 28ms); }
  @keyframes menurow { from { opacity: 0; transform: translateY(6px); } }
  body.menuing.leaving #menu { animation: menuout .12s ease-in both; }
  body.menuing.leaving #menu > * { animation: none; }
  @keyframes menuout { to { opacity: 0; transform: scale(.96); } }
  #menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 7px 10px; border: 0; border-radius: 8px; background: transparent; color: inherit; font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  #menu button:hover { background: var(--sel); color: #fff; }
  #menu button.danger { color: #ff8a8a; }
  #menu button.danger:hover { background: rgba(255,90,90,.85); color: #fff; }
  #menu button .mi { width: 18px; height: 18px; display: grid; place-items: center; flex: none; opacity: .85; }
  #menu button.armed { background: rgba(255,90,90,.85); color: #fff; }
  #menu button .mi.sw { width: 16px; height: 16px; margin: 0 1px; border-radius: 50%; background: var(--sw); color: #fff; opacity: 1; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  #menu button .mi.sw svg { --bh-icon-stroke: 2px; }
  #menu .msep { height: 1px; margin: 4px 6px; background: rgba(255,255,255,.1); }
  #menu .mhead { padding: 5px 10px 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .45; }

  /* Boost editor */
  #boost { display: none; padding: 18px 20px 14px; }
  body.boosting #boost { display: block; }
  body.boosting .search, body.boosting #list, body.boosting .foot { display: none; }
  #boost h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  #boost p { font-size: 12.5px; opacity: .55; margin-bottom: 12px; }
  #css { width: 100%; height: 170px; resize: none; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; color: inherit; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 10px 12px; outline: none; user-select: text; -webkit-user-select: text; }
  #css:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .btn { font: inherit; font-size: 13px; color: inherit; border: 0; cursor: pointer; border-radius: 9px; padding: 6px 12px; background: rgba(255,255,255,.1); }
  .btn:hover { background: rgba(255,255,255,.18); }
  .btn.primary { background: var(--accent); color: #fff; }
  /* Tab comparator: the products of the open tabs side by side. */
  #compare { display: none; padding: 16px 18px 14px; }
  body.comparing #compare { display: block; }
  body.comparing .search, body.comparing #list, body.comparing .foot { display: none; }
  body.comparing #panel { width: min(1000px, calc(100vw - 48px)); top: 10vh; }
  #compare h2 { font-size: 16px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  #compare h2 span { flex: 1; }
  #cpick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  #cpick label { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,.07); font-size: 12.5px; cursor: pointer; max-width: 260px; }
  #cpick label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cwrap { max-height: 62vh; overflow: auto; }
  #ctable { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  #ctable th, #ctable td { text-align: left; padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; overflow-wrap: anywhere; }
  #ctable th { font-weight: 600; cursor: pointer; }
  #ctable th:hover { color: #fff; text-decoration: underline; }
  #ctable td:first-child, #ctable th:first-child { width: 150px; opacity: .6; font-weight: 500; cursor: default; text-decoration: none; }
  #ctable .best { color: #6ee7a8; font-weight: 600; }
  #ctable small { display: block; opacity: .55; font-weight: 400; }
  /* HTTP authentication (a NAS, a router): the server asks for a user name and password. */
  #auth { display: none; padding: 18px 20px 16px; }
  body.authing #auth { display: block; }
  body.authing .search, body.authing #list, body.authing .foot { display: none; }
  #auth h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; overflow-wrap: anywhere; }
  #auth p { font-size: 12.5px; opacity: .6; overflow-wrap: anywhere; }
  #auth p.warn { opacity: 1; color: #ffb86b; margin-top: 6px; }
  #auth p:empty { display: none; }
  #auth label { display: block; font-size: 12.5px; opacity: .7; margin: 12px 0 5px; }
  #auth input { width: 100%; font: inherit; font-size: 14px; color: inherit; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 9px; padding: 7px 10px; outline: none; user-select: text; -webkit-user-select: text; }
  #auth input:focus { border-color: var(--accent); }
  #asaved { margin: 12px 0 0; }
  #asaved:empty { display: none; }
  /* Emoji picker */
  #emoji { display: none; padding: 18px 20px 16px; }
  body.picking #emoji { display: block; }
  body.picking .search, body.picking #list, body.picking .foot { display: none; }
  #emoji h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  #grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-bottom: 12px; }
  #grid button { font-size: 22px; line-height: 1; padding: 7px 0; border: 0; border-radius: 9px; background: transparent; cursor: pointer; }
  #grid button:hover, #grid button.cur { background: rgba(255,255,255,.14); }
  #eq { flex: 1; min-width: 0; font: inherit; font-size: 15px; color: inherit; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 9px; padding: 6px 10px; outline: none; user-select: text; -webkit-user-select: text; }
  #eq:focus { border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
</style>
</head>
<body>
<div id="scrim">
  <div id="menu"></div>
  <div id="hole"><i></i></div>
  <div id="panel">
    <div class="search">
      <i data-icon="search" data-size="md"></i>
      <input id="q" data-i18n-placeholder="palette.placeholder" spellcheck="false" autocomplete="off">
    </div>
    <div id="list"></div>
    <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> <span data-i18n="palette.foot_navigate">navigate</span></span><span><kbd>↵</kbd> <span data-i18n="palette.foot_open">open</span></span><span id="fkeep" hidden><kbd id="fkeepk"></kbd> <span data-i18n="palette.foot_keep">to the Easel</span></span><span><kbd>esc</kbd> <span data-i18n="palette.foot_close">close</span></span></div>
    <div id="emoji">
      <h2><span data-i18n="palette.icon">Icon</span> · <span id="ename"></span></h2>
      <div id="grid"></div>
      <div class="actions" style="margin-top:0"><input id="eq" spellcheck="false" autocomplete="off"><button class="btn" id="eclear" data-i18n="easel.remove">Remove</button><button class="btn primary" id="eok" data-i18n="palette.apply">Apply</button></div>
    </div>
    <div id="compare">
      <h2><span data-i18n="palette.compare_title">Compare tabs</span><button class="btn" id="ckeep" type="button"><i data-icon="easel" data-size="xs"></i> <span data-i18n="palette.compare_keep">Add to the Easel</span></button></h2>
      <div id="cpick"></div>
      <div id="cwrap"><table id="ctable"></table></div>
    </div>
    <form id="auth" autocomplete="off">
      <h2><span data-i18n="error.login">Sign in</span> · <span id="ahost"></span></h2>
      <p id="arealm"></p>
      <p id="awarn" class="warn"></p>
      <div id="asaved" class="chips"></div>
      <label for="auser" data-i18n="palette.user_name">User name</label>
      <input id="auser" spellcheck="false" autocomplete="off" autocapitalize="off">
      <label for="apass" data-i18n="palette.password">Password</label>
      <input id="apass" type="password" autocomplete="off">
      <div class="actions"><button type="button" class="btn" id="acancel" data-i18n="common.cancel">Cancel</button><button type="submit" class="btn primary" id="aok" data-i18n="error.login">Sign in</button></div>
    </form>
    <div id="boost">
      <h2>Boost · <span id="bhost"></span></h2>
      <p data-i18n="palette.boost_hint">CSS applied to every page of this site. Leave empty to remove the Boost.</p>
      <div class="chips" id="presets"></div>
      <textarea id="css" spellcheck="false" placeholder="body { font-size: 18px; }"></textarea>
      <div class="actions"><button class="btn" id="cancel" data-i18n="common.cancel">Cancel</button><button class="btn primary" id="save">Save</button></div>
    </div>
  </div>
</div>
<script>
// The list navigation below uses Ctrl+N, so it must not open a window from here.
window.keepCtrlN = true;
// Ctrl/Cmd+Enter keeps the selected result in the Easel (not the app's shortcut).
window.keepModEnter = true;
const $ = (id) => document.getElementById(id);
const send = (m) => window.ipc.postMessage(JSON.stringify(m));
const PRESETS = {
  'palette.preset_dark': 'html { filter: invert(1) hue-rotate(180deg); }\nimg, video, picture, canvas, svg { filter: invert(1) hue-rotate(180deg); }',
  'palette.preset_bigger': 'html { zoom: 1.15; }',
  'palette.preset_narrow': 'body { max-width: 860px; margin: 0 auto !important; }',
  'palette.preset_sticky': '[style*="position: fixed"], [style*="position:fixed"] { display: none !important; }',
};
let S = { mode: 'new', tabs: [], favorites: [], bookmarks: [], recent: [], actions: [], found: null };
// What Ctrl/Cmd+Enter does on the selected row: keep it in the Easel, when it can be kept.
const keepKey = (e) => (bhMac ? e.metaKey : e.ctrlKey);
let items = [], sel = 0, pristine = true, target = null;
// Recall: the last query sent, its answer, and the timer that waits for the typing to pause.
let recallSeq = 0, recallHits = [], recallNow = 0, recallTimer = 0, recallAsked = '';
const RECALL_FROM = 3, PER_GROUP = 3;
const EMOJIS = ['🏠','💼','🎮','📚','🎓','🛒','💰','🎵','🎬','📷','✈️','🍳','🧪','💻','🛠️','🎨','📰','🔒','❤️','⭐','🚀','🌍','🔥','🌱','☕','🧠','📁','📌','🗂️','🧩','🎯','💡','🧳','🏋️','🐱','🐶','🌙','☀️','🍀','🎁'];

const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return 'hsl(' + h + ',60%,50%)'; };
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const looksLikeUrl = (q) => /^https?:\/\//i.test(q) || (!/\s/.test(q) && /\./.test(q) && !q.startsWith('.') && !q.endsWith('.'));

function site(url, title, hint, run) {
  const h = host(url);
  return { letter: (h[0] || '•').toUpperCase(), color: hue(h), title, sub: h, hint, run };
}

// Recall: the pages read that match what is typed (found by the shell's encrypted store).
// Titles and excerpts come from pages: they only ever go in through textContent.
function buildRecall() {
  const r = S.recall || {};
  if (!r.on) {
    return [{
      glyph: 'history', title: bhT('palette.recall_off'), id: 'recall:on',
      sub: bhT(r.available ? 'palette.recall_off_sub' : 'palette.recall_private'),
      hint: r.available ? bhT('palette.recall_turn_on') : '',
      run: () => { if (r.available) send({ cmd: 'set_recall', on: true }); },
    }];
  }
  if (!$('q').value.trim()) return [];
  return recallHits.map((h) => recallRow(h, true));
}
// A page found by Recall: opens it; Ctrl/Cmd+Enter keeps its excerpt in the Easel.
function recallRow(h, wide) {
  const when = (at) => { const d = Math.floor((recallNow - at) / 86400); return d <= 0 ? bhT('time.today') : d === 1 ? bhT('time.yesterday') : new Date(at * 1000).toLocaleDateString(bhI18n.lang); };
  return {
    ...site(h.url, h.title || host(h.url), when(h.at), () => send({ cmd: 'open', input: h.url })),
    sub: host(h.url) + ' · ' + h.snippet, wide,
    keep: () => send({ cmd: 'found_to_easel', url: h.url, title: h.title || '', text: h.snippet || '' }),
  };
}
function askRecall() {
  clearTimeout(recallTimer);
  recallTimer = setTimeout(() => {
    const query = $('q').value.trim();
    if (!(S.recall || {}).on || query === recallAsked) return;
    recallAsked = query;
    // Outside its own mode, Recall is one group among the results, from three letters on.
    if (!query || (S.mode !== 'recall' && query.length < RECALL_FROM)) { recallHits = []; draw(); return; }
    if (S.mode !== 'recall') recallHits = [];
    send({ cmd: 'recall_search', query, seq: ++recallSeq });
  }, 160);
}

function build() {
  if (S.mode === 'recall') return buildRecall();
  const raw = $('q').value.trim();
  const q = pristine ? '' : raw;
  const ql = q.toLowerCase();
  const out = [];
  const enter = (input) => send({ cmd: S.mode === 'url' ? 'navigate' : 'open', input });
  if (q) {
    out.push(looksLikeUrl(q)
      ? { glyph: 'go', title: q, sub: bhT('palette.go_to_site'), hint: bhT('menu.open'), run: () => enter(q) }
      : { glyph: 'search', title: q, sub: bhT('palette.search_with', { engine: S.engine }), hint: bhT('palette.search'), run: () => enter(q) });
  }
  const match = (...f) => !q || f.some(v => (v || '').toLowerCase().includes(ql));
  const seen = new Set();
  for (const t of S.tabs) {
    if (!match(t.title, t.url)) continue;
    seen.add(t.url);
    out.push(site(t.url, t.title || host(t.url), bhT('palette.switch_to_tab'), () => send({ cmd: 'activate', id: t.id })));
  }
  const pool = q ? [...S.favorites, ...(S.bookmarks || []), ...S.recent] : S.favorites;
  for (const e of pool) {
    if (seen.has(e.url) || !match(e.title, e.name, e.url)) continue;
    seen.add(e.url);
    out.push(site(e.url, e.title || e.name || host(e.url), host(e.url), () => enter(e.url)));
  }
  for (const a of S.actions) {
    if (!match(a.label)) continue;
    out.push({
      glyph: 'bolt', title: a.label, sub: '', hint: a.keys ? bhKeys(a.keys) : a.hint || bhT('palette.action'),
      confirm: a.confirm, id: 'action:' + a.id, run: () => send({ cmd: 'action', id: a.id }),
    });
  }
  const base = out.slice(0, q ? 9 : 10);
  return q ? [...base, ...groups(q, match)] : base;
}
// One search for everything: what the Library keeps (highlights, watched areas, archive,
// downloads) and what Recall finds, a few rows per group under its own head. Their text comes
// from pages: it only ever goes in through textContent.
function groups(q, match) {
  const F = S.found || {}, out = [];
  const leave = (cmd) => () => close(() => send(cmd));
  const group = (head, rows) => { if (rows.length) out.push({ head: bhT(head) }, ...rows.slice(0, PER_GROUP)); };
  group('palette.group_highlights', (F.highlights || []).filter(h => match(h.quote, h.note, h.title)).map(h => ({
    glyph: 'marker', title: h.quote, sub: [host(h.url), h.note].filter(Boolean).join(' · '), hint: bhT('palette.hint_highlight'),
    run: leave({ cmd: 'highlight_open', id: h.id }), keep: () => send({ cmd: 'highlight_to_easel', id: h.id }),
  })));
  group('palette.group_watches', (F.watches || []).filter(w => match(w.title, w.url, w.value)).map(w => ({
    glyph: 'eye', title: w.title || host(w.url), sub: [w.previous ? w.previous + ' → ' + w.value : w.value, host(w.url)].filter(Boolean).join(' · '),
    hint: bhT(w.unread ? 'library.changed' : 'palette.hint_watch'),
    run: leave({ cmd: 'open', input: w.url }), keep: () => send({ cmd: 'watch_to_easel', id: w.id }),
  })));
  if ((S.recall || {}).on && q.length >= RECALL_FROM && q === recallAsked) group('palette.group_recall', recallHits.map(h => recallRow(h, false)));
  group('palette.group_archive', (F.archive || []).filter(a => match(a.title, a.url)).map(a => ({
    ...site(a.url, a.title || host(a.url), bhT('palette.hint_reopen'), leave({ cmd: 'reopen_archived', index: a.index })),
    keep: () => send({ cmd: 'found_to_easel', url: a.url, title: a.title || '', text: '' }),
  })));
  group('palette.group_downloads', (F.downloads || []).filter(d => match(d.name, d.url)).map(d => ({
    glyph: 'download', title: d.name, sub: host(d.url), hint: bhT('menu.open'), run: leave({ cmd: 'library_open_file', id: d.id }),
  })));
  return out;
}
// Nothing is selected until the user types or moves: Enter then acts on what the field holds,
// not on the first row of the list. The untouched address of the page shown loads it again.
function submit() {
  if (S.mode === 'recall') { if (items.length) run(Math.max(0, sel)); return; }
  if (sel >= 0) { run(sel); return; }
  const input = $('q').value.trim();
  if (!input) return;
  if (pristine && S.mode === 'url') { send({ cmd: 'reload' }); close(); }
  else send({ cmd: S.mode === 'url' ? 'navigate' : 'open', input });
}
// An action that cannot be undone asks for a second Enter / click; it shows what will happen.
let armed = null;

function draw() {
  items = build();
  sel = Math.min(sel, items.length - 1);
  if (items[sel] && items[sel].head) sel = Math.min(sel + 1, items.length - 1);
  const rows = items.map((it, i) => {
    if (it.head) {
      const h = document.createElement('div');
      h.className = 'ghead'; h.textContent = it.head; h.style.setProperty('--i', i);
      return h;
    }
    const r = document.createElement('div');
    r.className = 'row' + (i === sel ? ' sel' : '') + (it.wide ? ' wide' : '');
    r.style.setProperty('--i', i);
    const ico = document.createElement('span');
    if (it.glyph) { ico.className = 'ico glyph'; ico.append(bhIcon(it.glyph)); }
    else { ico.className = 'ico'; ico.textContent = it.letter; ico.style.background = it.color; }
    const t = document.createElement('span'); t.className = 't'; t.textContent = it.title;
    const s = document.createElement('span'); s.className = 's'; s.textContent = armed && armed === it.id ? it.confirm : it.sub;
    if (armed && armed === it.id) r.classList.add('armed');
    const g = document.createElement('span'); g.className = 'grow';
    const h = document.createElement('span'); h.className = 'hint';
    h.append(it.hint);
    const chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = '→';
    h.append(chip);
    r.append(ico, t, s, g, h);
    r.onmousemove = () => { if (sel !== i) { sel = i; mark(); } };
    r.onclick = () => run(i);
    return r;
  });
  if (!rows.length) {
    const n = document.createElement('div'); n.className = 'none';
    const waiting = S.mode === 'recall' && (!$('q').value.trim() || $('q').value.trim() !== recallAsked);
    n.textContent = bhT(waiting ? 'palette.recall_hint' : 'palette.no_results');
    rows.push(n);
  }
  $('list').replaceChildren(...rows);
  footKeep();
}

// The foot says what Ctrl/Cmd+Enter does when the selected row can go to the Easel.
function footKeep() {
  const it = items[sel];
  $('fkeep').hidden = !(it && it.keep);
  $('fkeepk').textContent = bhKeys('mod+enter');
}

function mark() {
  [...$('list').children].forEach((r, i) => r.classList.toggle('sel', i === sel));
  const cur = $('list').children[sel];
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
  footKeep();
}

// Up and down skip the heads of the groups.
function step(d) {
  const n = items.length;
  if (!n) return;
  let i = sel < 0 ? (d > 0 ? -1 : n) : sel;
  for (let k = 0; k < n; k++) {
    i = (i + d + n) % n;
    if (!items[i].head) { sel = i; mark(); return; }
  }
}

function run(i) {
  const it = items[i];
  if (!it || it.head) return;
  if (it.confirm && armed !== it.id) { armed = it.id; draw(); return; }
  armed = null;
  it.run();
}
// Closes the overlay, then runs `then` (what the menu entry asked for). A menu fades out first;
// the shell hides the view at once, so the order "close, then the command" is kept.
const MENU_OUT = 120;
const close = (then) => {
  const cl = document.body.classList;
  const done = () => { cl.remove('leaving'); send({ cmd: 'palette_close' }); if (typeof then === 'function') then(); };
  const calm = cl.contains('noanim') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!cl.contains('menuing') || calm) { done(); return; }
  if (cl.contains('leaving')) return;
  cl.add('leaving');
  setTimeout(done, MENU_OUT);
};

function applyIcon(icon) {
  if (!target) return;
  send({ cmd: target.kind === 'space' ? 'set_space_icon' : 'set_folder_icon', id: target.id, icon });
  close();
}

// Menu icons: a menu item names one of ui/icons.js (`icon: 'trash'`), drawn the same on every
// system (emoji are not); anything else (a space's emoji) is shown as text.
// `color` draws a swatch (space colors), with the icon (a check mark) on top of it.
function menuIcon(name, color) {
  const ic = document.createElement('span');
  ic.className = 'mi' + (color ? ' sw' : '');
  if (color) ic.style.setProperty('--sw', color);
  if (bhIcons.has(name)) ic.append(bhIcon(name, color ? 'xs' : 'sm'));
  else ic.textContent = name || '';
  return ic;
}
// Shell pages have no secure origin for navigator.clipboard: the copy command still works.
function copyText(text) {
  const area = document.createElement('textarea');
  area.value = text;
  area.style.cssText = 'position:fixed;opacity:0';
  document.body.append(area);
  area.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  area.remove();
  return ok;
}

function showMenu(m) {
  const box = $('menu');
  document.body.classList.remove('leaving');
  box.replaceChildren(...m.items.map(it => {
    if (it.sep) return Object.assign(document.createElement('div'), { className: 'msep' });
    if (it.head) return Object.assign(document.createElement('div'), { className: 'mhead', textContent: it.head });
    const b = document.createElement('button');
    if (it.danger) b.className = 'danger';
    const label = document.createElement('span');
    label.textContent = it.label;
    b.append(menuIcon(it.icon, it.color), label);
    // `confirm`: the first click only arms the item and says what will be lost.
    // `background`: what Ctrl/Cmd+click or a middle click runs instead (a tab behind, like a link).
    if (it.background) {
      b.onmousedown = (e) => { if (e.button === 1) e.preventDefault(); };
      b.onauxclick = (e) => { if (e.button === 1) { e.preventDefault(); close(() => send(it.background)); } };
    }
    b.onclick = (e) => {
      if (it.copy != null) {
        label.textContent = bhT(copyText(it.copy) ? 'palette.copied' : 'palette.copy_failed');
        setTimeout(() => close(), 450);
        return;
      }
      if (it.background && (bhMac ? e.metaKey : e.ctrlKey)) {
        close(() => send(it.background));
        return;
      }
      if (it.confirm && !b.classList.contains('armed')) {
        b.classList.add('armed');
        label.textContent = it.confirm;
        return;
      }
      close(() => { if (it.run) send(it.run); });
    };
    return b;
  }));
  [...box.children].forEach((n, i) => n.style.setProperty('--i', Math.min(i, 9)));
  box.style.left = '0px'; box.style.top = '0px';
  const w = box.offsetWidth, h = box.offsetHeight;
  const x = Math.max(8, Math.min(m.x, innerWidth - w - 8)), y = Math.max(8, Math.min(m.y, innerHeight - h - 8));
  box.style.left = x + 'px'; box.style.top = y + 'px';
  box.style.setProperty('--ox', (m.x > x ? '100%' : '0'));
  box.style.setProperty('--oy', (m.y > y ? '100%' : '0'));
}

// The tab comparator: pick the pages (products found are picked first, five at most), then
// one column per page and one row per field; the lowest price and the best rating stand out.
// Page data only ever goes in through textContent.
let cmpItems = [], cmpPicked = new Set();
const cmpNum = (v) => { const n = parseFloat(String(v || '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };
function showCompare(c) {
  cmpItems = (c && c.items) || [];
  const products = cmpItems.filter(i => i.price || i.rating);
  cmpPicked = new Set((products.length >= 2 ? products : cmpItems).slice(0, 5).map(i => i.id));
  $('cpick').replaceChildren(...cmpItems.map(i => {
    const label = document.createElement('label');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = cmpPicked.has(i.id);
    box.onchange = () => { box.checked ? cmpPicked.add(i.id) : cmpPicked.delete(i.id); drawCompare(); };
    const name = document.createElement('span');
    name.textContent = i.name || i.title || host(i.url);
    label.append(box, name);
    return label;
  }));
  drawCompare();
}
$('ckeep').onclick = () => { send({ cmd: 'compare_to_easel', ids: [...cmpPicked] }); close(); };
function drawCompare() {
  const cols = cmpItems.filter(i => cmpPicked.has(i.id));
  const cell = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text || '—'; if (cls) e.className = cls; return e; };
  const head = document.createElement('tr');
  head.append(cell('th', ''));
  for (const i of cols) {
    const th = cell('th', i.name || i.title || host(i.url));
    const sub = document.createElement('small');
    sub.textContent = host(i.url);
    th.append(sub);
    th.title = bhT('palette.show_tab');
    th.onclick = () => { send({ cmd: 'activate', id: i.id }); close(); };
    head.append(th);
  }
  const prices = cols.map(i => cmpNum(i.price)), ratings = cols.map(i => cmpNum(i.rating));
  const low = Math.min(...prices.filter(n => n != null)), high = Math.max(...ratings.filter(n => n != null));
  // Our fields carry a catalog key; the page's own specifications keep their name (`spec`).
  const rows = [
    ['palette.cmp_price', (i) => i.price ? `${i.price} ${i.currency || ''}`.trim() : '', (i, k) => prices[k] === low && cols.length > 1],
    ['palette.cmp_rating', (i) => i.rating, (i, k) => ratings[k] === high && cols.length > 1],
    ['palette.cmp_reviews', (i) => i.reviews],
    ['palette.cmp_brand', (i) => i.brand],
    ['palette.cmp_availability', (i) => i.availability],
  ];
  // Specifications shared by at least two pages (or all of them when only one has some).
  const counts = new Map();
  for (const i of cols) for (const k of Object.keys(i.specs || {})) counts.set(k, (counts.get(k) || 0) + 1);
  const shared = [...counts].filter(([, n]) => n >= Math.min(2, cols.length)).sort((a, b) => b[1] - a[1]).slice(0, 15);
  for (const [k] of shared) rows.push([k, (i) => (i.specs || {})[k], null, true]);
  const body = rows
    .filter(([, get]) => cols.some(i => get(i)))
    .map(([name, get, best, spec]) => {
      const tr = document.createElement('tr');
      tr.append(cell('td', spec ? name : bhT(name)));
      cols.forEach((i, k) => tr.append(cell('td', get(i), best && best(i, k) ? 'best' : '')));
      return tr;
    });
  if (!cols.length) {
    const tr = document.createElement('tr');
    tr.append(cell('td', bhT('palette.cmp_pick')));
    body.push(tr);
  }
  $('ctable').replaceChildren(head, ...body);
}

function saveBoost() { send({ cmd: 'save_boost', css: $('css').value }); }

// The server's text (host, realm) is shown with textContent only. The password is cleared as
// soon as it is sent and never kept by this page.
let authId = null;
function showAuth(a) {
  const fresh = authId !== a.id;
  authId = a.id;
  $('ahost').textContent = a.host;
  $('arealm').textContent = a.realm ? bhT('palette.auth_realm', { realm: a.realm }) : '';
  const warn = [];
  if (a.retry) warn.push(bhT('palette.auth_retry'));
  if (!a.secure) warn.push(bhT('palette.auth_insecure'));
  $('awarn').textContent = warn.join(' ');
  // Logins saved for this server: the user name only, the wallet answers for the password.
  $('asaved').replaceChildren(...(a.saved || []).map((user, index) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn';
    b.textContent = bhT('palette.auth_use', { user: user || bhT('palette.auth_no_user') });
    b.onclick = () => { if (authId != null) send({ cmd: 'auth_saved', id: authId, index }); clearAuth(); };
    return b;
  }));
  $('apass').value = '';
  if (fresh && !a.retry) $('auser').value = '';
  ($('auser').value ? $('apass') : $('auser')).focus();
}
function clearAuth() { $('apass').value = ''; $('apass').blur(); $('auser').blur(); }

window.bh = {
  save: saveBoost,
  // The store's answer to the query numbered `seq` (an older one is dropped).
  recall(a) {
    if (a.seq !== recallSeq) return;
    recallHits = a.hits || [];
    recallNow = a.now || 0;
    if (S.mode === 'recall') sel = recallHits.length ? 0 : -1;
    draw();
  },
  open(s) {
    S = s;
    armed = null;
    const root = document.documentElement.style;
    root.setProperty('--accent', s.color);
    root.setProperty('--sel', rgba(s.color, .85));
    document.body.classList.add('open');
    document.body.classList.toggle('noanim', !s.animations);
    const authing = s.mode === 'auth' && !!s.auth;
    document.body.classList.toggle('authing', authing);
    if (authing) {
      document.body.classList.remove('menuing', 'comparing', 'boosting', 'picking', 'intro', 'pop', 'pre');
      showAuth(s.auth);
      return;
    }
    const menuing = s.mode === 'menu';
    document.body.classList.toggle('menuing', menuing);
    if (menuing) { showMenu(s.menu); return; }
    const comparing = s.mode === 'compare';
    document.body.classList.toggle('comparing', comparing);
    if (comparing) { showCompare(s.compare); return; }
    const boosting = s.mode === 'boost';
    const picking = s.mode === 'emoji';
    document.body.classList.toggle('boosting', boosting);
    document.body.classList.toggle('picking', picking);
    if (picking) {
      target = s.target;
      $('ename').textContent = bhT(target.kind === 'space' ? 'palette.icon_space' : 'palette.icon_folder', { name: target.name });
      $('eq').value = target.icon || '';
      [...$('grid').children].forEach(b => b.classList.toggle('cur', b.textContent === target.icon));
      $('eq').focus();
      return;
    }
    if (boosting) {
      $('bhost').textContent = s.boostHost;
      $('css').value = s.boost || '';
      $('css').focus();
      return;
    }
    document.body.classList.remove('intro', 'pop');
    document.body.classList.toggle('pre', !!s.animations);
    if (s.animations) {
      // Two frames so the animation clock is fresh after the view was hidden.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        document.body.classList.remove('pre');
        document.body.classList.add('pop');
        if (s.mode === 'new') document.body.classList.add('intro');
        setTimeout(() => document.body.classList.remove('intro', 'pop'), 800);
      }));
    }
    pristine = s.mode === 'url';
    // The next address opens in a black hole tab: the field says so.
    $('q').dataset.i18nPlaceholder = s.mode === 'recall' ? 'palette.placeholder_recall' : s.burner ? 'palette.placeholder_burner' : 'palette.placeholder';
    recallHits = []; recallAsked = ''; recallSeq++;
    if (s.mode === 'recall') pristine = false;
    $('q').placeholder = bhT($('q').dataset.i18nPlaceholder);
    $('q').value = s.mode === 'url' ? s.url : '';
    sel = -1;
    draw();
    $('q').focus();
    if (pristine) $('q').select();
  },
  hide() { document.body.classList.remove('open', 'boosting', 'picking', 'intro', 'pop', 'pre', 'menuing', 'leaving', 'comparing', 'authing'); $('q').blur(); $('eq').blur(); clearAuth(); },
};

$('q').addEventListener('input', () => {
  pristine = false; armed = null;
  if (S.mode === 'recall') { sel = recallHits.length ? 0 : -1; askRecall(); }
  else { sel = $('q').value.trim() ? 0 : -1; askRecall(); }
  draw();
});
document.addEventListener('keydown', (e) => {
  if (!document.body.classList.contains('open')) return;
  if (e.key === 'Escape') { e.preventDefault(); close(); return; }
  if (document.body.classList.contains('menuing') || document.body.classList.contains('comparing')) return;
  if (document.body.classList.contains('authing')) return;
  if (document.body.classList.contains('picking')) {
    if (e.key === 'Enter') { e.preventDefault(); applyIcon($('eq').value); }
    return;
  }
  if (document.body.classList.contains('boosting')) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveBoost(); }
    return;
  }
  if (e.key === 'ArrowDown' || (e.ctrlKey && e.key === 'n')) { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowUp' || (e.ctrlKey && e.key === 'p')) { e.preventDefault(); step(-1); }
  else if (e.key === 'Enter' && keepKey(e) && items[sel] && items[sel].keep) { e.preventDefault(); const it = items[sel]; close(() => it.keep()); }
  else if (e.key === 'Enter') { e.preventDefault(); submit(); }
});
$('scrim').addEventListener('mousedown', (e) => { if (e.target === $('scrim')) close(); });
$('cancel').onclick = close;
$('auth').addEventListener('submit', (e) => {
  e.preventDefault();
  if (authId == null) return;
  send({ cmd: 'auth_answer', id: authId, user: $('auser').value, password: $('apass').value });
  clearAuth();
});
$('acancel').onclick = () => { if (authId != null) send({ cmd: 'auth_cancel', id: authId }); clearAuth(); };
$('eok').onclick = () => applyIcon($('eq').value);
$('eclear').onclick = () => applyIcon('');
$('grid').replaceChildren(...EMOJIS.map(em => {
  const b = document.createElement('button'); b.textContent = em; b.onclick = () => applyIcon(em); return b;
}));
$('save').onclick = saveBoost;
function statics() {
  $('save').textContent = bhT('palette.save_keys', { keys: bhKeys('mod+enter') });
  $('eq').placeholder = bhT('palette.emoji_placeholder', { keys: bhMac ? '⌃⌘Space' : 'Win+.' });
  $('presets').replaceChildren(...Object.entries(PRESETS).map(([name, css]) => {
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = bhT(name);
    b.onclick = () => { const cur = $('css').value.trim(); $('css').value = cur ? cur + '\n' + css : css; };
    return b;
  }));
}
statics();
addEventListener('bhlang', statics);
send({ cmd: 'palette_ready' });
</script>
</body>
</html>
