[package]
name = "blackhole-macos-url"
version.workspace = true
edition.workspace = true
description = "Receives http(s) links from macOS and makes BlackHole the default browser (macOS, Windows)"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSString", "NSURL", "NSBundle", "NSError", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "block2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Objective-C bindings need `unsafe`; it is confined to this crate and the rest of the workspace
# keeps `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "allow"
