[package]
name = "blackhole-infrastructure"
version.workspace = true
edition.workspace = true

[dependencies]
blackhole-domain.workspace = true
blackhole-application.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
url.workspace = true
ureq = { version = "2", default-features = false, features = ["native-certs", "tls"] }
sha2 = "0.10"
rusqlite = { version = "0.41.1", features = ["bundled"] }
csv = "1.4.0"
chacha20poly1305 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
rrule = "0.14.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
