<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-label="BlackHole">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="45%" stop-color="#ff9a3c" stop-opacity="0.95"/>
      <stop offset="62%" stop-color="#ff6a3d" stop-opacity="0.55"/>
      <stop offset="78%" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffb35c"/>
      <stop offset="55%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <!-- A warm glint sweeps across the word, then rests. -->
    <linearGradient id="text" x1="-160" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8f74ff"/>
      <stop offset="42%" stop-color="#8f74ff"/>
      <stop offset="50%" stop-color="#ffb35c"/>
      <stop offset="58%" stop-color="#8f74ff"/>
      <stop offset="100%" stop-color="#8f74ff"/>
      <animate attributeName="x1" values="-160;520;520" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="40;720;720" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .glow { transform-origin: 90px 90px; animation: breathe 4s ease-in-out infinite; }
    .ring { stroke-dasharray: 150 90; animation: flow 3s linear infinite; }
    .ring2 { transform-origin: 90px 90px; animation: spin 11s linear infinite reverse; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.3s; }
    .word { font: 700 64px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -1px; }
    .tag { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #8b8a99; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes flow { to { stroke-dashoffset: -240; } }
    @keyframes breathe { 50% { transform: scale(1.08); opacity: .8; } }
    @keyframes twinkle { 50% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) {
      .glow, .ring, .ring2, .star { animation: none; }
    }
  </style>
  <circle class="star" cx="22" cy="30" r="1.6" fill="#c9c2ff"/>
  <circle class="star s2" cx="168" cy="22" r="1.2" fill="#ffd9a8"/>
  <circle class="star s3" cx="160" cy="158" r="1.5" fill="#c9c2ff"/>
  <circle class="star s4" cx="18" cy="150" r="1.1" fill="#ffd9a8"/>
  <circle class="star s3" cx="690" cy="40" r="1.3" fill="#c9c2ff"/>
  <circle class="star s2" cx="640" cy="150" r="1.1" fill="#ffd9a8"/>
  <circle class="glow" cx="90" cy="90" r="62" fill="url(#glow)"/>
  <ellipse cx="90" cy="90" rx="74" ry="20" fill="none" stroke="url(#disk)" stroke-opacity=".35" stroke-width="3" transform="rotate(-18 90 90)"/>
  <ellipse class="ring" cx="90" cy="90" rx="74" ry="20" fill="none" stroke="url(#disk)" stroke-width="4" stroke-linecap="round" transform="rotate(-18 90 90)"/>
  <g class="ring2"><circle cx="90" cy="90" r="50" fill="none" stroke="#7c5cff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="70 245" stroke-linecap="round"/></g>
  <circle cx="90" cy="90" r="34" fill="#07060c"/>
  <circle cx="90" cy="90" r="34" fill="none" stroke="#ffb35c" stroke-opacity=".9" stroke-width="2"/>
  <text class="word" x="190" y="104" fill="url(#text)">BlackHole</text>
  <text class="tag" x="193" y="136">Rust · WebKit · WebView2 · Android</text>
</svg>
